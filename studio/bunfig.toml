# Bun configuration for the Studio workspace.

[install]
# Reproducible installs: CI runs `bun install --frozen-lockfile`.
exact = true

[test]
preload = ["./test-setup.ts"]
pathIgnorePatterns = ["e2e/**", "**/node_modules/**"]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
