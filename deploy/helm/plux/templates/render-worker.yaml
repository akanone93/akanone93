# The render worker (O-9, ADR-0097): `plux render-worker serve`, the process of
# the render worker image, compiles the projects of a release request and draws
# their pages with the Flutter toolchain. The worker role calls it over mutual
# TLS 1.3 at renderWorker.address; it holds no database, object-store or
# signing credential (L-4): no data environment variables, no keys volume, no
# ServiceAccount token, and the NetworkPolicy lets it reach nothing.
#
# The root file system is read-only. The Flutter tool writes below its SDK, so
# an init container copies the SDK and the package cache of the image into a
# volume the process owns; the packages are in the image, so a render needs no
# network.
{{- if .Values.renderWorker.enabled }}
{{- $role := "render-worker" }}
{{- $v := .Values.renderWorker }}
{{- $name := printf "%s-%s" (include "plux.fullname" .) $role }}
{{- $ctx := dict "root" . "role" $role "v" $v }}
{{- $image := include "plux.renderWorkerImage" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "plux.labels" (dict "root" . "component" $role) | nindent 4 }}
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "plux.selectorLabels" (dict "root" . "component" $role) | nindent 6 }}
  template:
    metadata:
      {{- with include "plux.podAnnotations" $ctx }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "plux.labels" (dict "root" . "component" $role) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plux.serviceAccountName" . }}
      automountServiceAccountToken: false
      # A stopping worker lets the render that runs finish (up to ten minutes).
      terminationGracePeriodSeconds: 660
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "plux.podSecurityContext" (dict "root" . "role" $role) | nindent 8 }}
      {{- include "plux.scheduling" $ctx | nindent 6 }}
      initContainers:
        - name: sdk
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.renderWorkerImage.pullPolicy }}
          command: [cp, -a, /opt/flutter, /opt/pub-cache, /sdk/]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            {{- include "plux.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: sdk, mountPath: /sdk}
      containers:
        - name: plux
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.renderWorkerImage.pullPolicy }}
          args:
            - render-worker
            - serve
            - --listen=:8443
            - --flutter=/sdk/flutter/bin/flutter
            - --runtime=/opt/plux/packages/plux_flutter
            - --fonts=/opt/plux/schema/goldens/fonts
            - --work=/var/lib/plux/render
            - --concurrency={{ $v.concurrency }}
            - --ca=/etc/plux/internal/ca.crt
            - --cert=/etc/plux/internal/tls.crt
            - --key=/etc/plux/internal/tls.key
          ports:
            - {name: mtls, containerPort: 8443}
          env:
            - {name: PUB_CACHE, value: /sdk/pub-cache}
            - {name: PATH, value: "/sdk/flutter/bin:/usr/lib/dart/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # The listener demands a client certificate, so the probes only open
          # the TCP connection.
          startupProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "plux.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - {name: internal-tls, mountPath: /etc/plux/internal, readOnly: true}
            - {name: sdk, mountPath: /sdk}
            - {name: scratch, mountPath: /var/lib/plux/render}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: internal-tls
          secret: {secretName: {{ include "plux.tlsSecretName" (dict "root" . "role" $role "key" "renderWorker") }}}
        - name: sdk
          emptyDir: {sizeLimit: {{ $v.sdkSize }}}
        # Flutter test projects and images; gone with the pod.
        - name: scratch
          emptyDir: {sizeLimit: {{ $v.scratchSize }}}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "plux.labels" (dict "root" . "component" $role) | nindent 4 }}
spec:
  selector:
    {{- include "plux.selectorLabels" (dict "root" . "component" $role) | nindent 4 }}
  ports:
    - {name: mtls, port: 8443, targetPort: mtls}
---
{{ include "plux.pdb" $ctx }}
{{- if $v.autoscaling.enabled }}
---
{{ include "plux.hpa" $ctx }}
{{- end }}
{{- end }}
