# Alert rules, recording rules and Grafana dashboards (OBS-004, OBS-005,
# ADR-0085). The files under files/observability are copies of
# deploy/observability, which the Compose stack mounts directly
# (deploy/observability/sync.sh keeps them equal; make helm-lint checks it).
#
#   * observability.prometheusRule.enabled: a PrometheusRule for the
#     Prometheus Operator (kube-prometheus-stack and compatible).
#   * observability.dashboards.enabled: a ConfigMap Grafana's dashboard sidecar
#     loads, selected by the label observability.dashboards.label.
{{- $o := .Values.observability }}
{{- if $o.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "plux.fullname" . }}
  labels:
    {{- include "plux.labels" (dict "root" . "component" "observability") | nindent 4 }}
    {{- with $o.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- (.Files.Get "files/observability/plux.rules.yml" | fromYaml).groups | dict "groups" | toYaml | nindent 2 }}
{{- end }}
{{- if $o.dashboards.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plux.fullname" . }}-dashboards
  labels:
    {{- include "plux.labels" (dict "root" . "component" "observability") | nindent 4 }}
    {{ $o.dashboards.label }}: "1"
  {{- with $o.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $path, $_ := .Files.Glob "files/observability/dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
# The read-only analytics datasource (ANL-020). Grafana reads the password from
# the environment variable named by observability.dashboards.analytics.passwordEnv.
{{- with $o.dashboards.analytics }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "plux.fullname" $ }}-analytics-datasource
  labels:
    {{- include "plux.labels" (dict "root" $ "component" "observability") | nindent 4 }}
    {{ $o.dashboards.datasourceLabel }}: "1"
data:
  plux-analytics.yaml: |
    apiVersion: 1
    datasources:
      - name: Plux analytics
        uid: plux-analytics
        type: grafana-postgresql-datasource
        access: proxy
        url: {{ required "observability.dashboards.analytics.url is required" .url }}
        user: {{ .user }}
        database: {{ .database }}
        editable: false
        jsonData:
          sslmode: require
          postgresVersion: 1600
        secureJsonData:
          password: ${{ .passwordEnv }}
{{- end }}
{{- end }}
