# The roles talk over mutual TLS 1.3 (SEC-043): every listener demands a client
# certificate of the internal CA, and every client trusts only that CA. In
# "generate" mode the chart makes the CA and one identity per role at install
# and reuses them on every upgrade (the Secrets are looked up); to rotate,
# delete the Secrets, upgrade and restart the roles. The CA's key is stored in
# its own Secret, which no pod mounts. Each identity serves and authenticates
# (serverAuth and clientAuth), with its Service name as its name.
{{- if and .Values.functions.enabled (eq .Values.internalTLS.mode "generate") }}
{{- $fullname := include "plux.fullname" . }}
{{- $caName := printf "%s-internal-ca" $fullname }}
{{- $ca := include "plux.ca" (dict "root" . "name" $caName "cn" "plux-internal-ca") | fromJson }}
{{- $roles := list "api" "worker" "fnrunner" "egress" }}
{{- if .Values.builder.enabled }}{{ $roles = append $roles "builder" }}{{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  labels:
    {{- include "plux.labels" (dict "root" . "component" "internal-tls") | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.cert | b64enc }}
  ca.key: {{ $ca.key | b64enc }}
{{- range $role := $roles }}
{{- $svc := printf "%s-%s" $fullname $role }}
{{- $sans := include "plux.sans" (dict "root" $ "svc" $svc) | fromJsonArray }}
{{- if eq $role "api" }}
{{- $sans = concat $sans (include "plux.sans" (dict "root" $ "svc" (printf "%s-internal" $svc)) | fromJsonArray) }}
{{- end }}
{{- $secret := printf "%s-tls-%s" $fullname $role }}
{{- $id := include "plux.identity" (dict "root" $ "name" $secret "cn" $svc "sans" $sans "ca" $ca) | fromJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "plux.labels" (dict "root" $ "component" "internal-tls") | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca.cert | b64enc }}
  tls.crt: {{ $id.crt | b64enc }}
  tls.key: {{ $id.key | b64enc }}
{{- end }}
{{- end }}
