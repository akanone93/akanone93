# One ServiceAccount for every pod. No role calls the Kubernetes API, so no
# pod mounts its token (automountServiceAccountToken: false) and the account
# is bound to nothing.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "plux.serviceAccountName" . }}
  labels:
    {{- include "plux.labels" (dict "root" . "component" "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and (eq .Values.signing.backend "file") (not .Values.signing.file.persistence.existingClaim) }}
---
# The file signing backend's keys (development and CI only).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "plux.fullname" . }}-keys
  labels:
    {{- include "plux.labels" (dict "root" . "component" "keys") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.signing.file.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.signing.file.persistence.size }}
{{- end }}
