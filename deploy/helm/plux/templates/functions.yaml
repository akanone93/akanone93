# The roles that run tenant code (FN-009 to FN-013, FN-016, ADR-0063, ADR-0064).
# None of them holds a database, object-store or signing credential (L-4): they
# have no data environment variables, no keys volume and a ServiceAccount token
# is not mounted. Each mounts its own configuration and its own certificate and
# reaches its peers over mutual TLS 1.3. The NetworkPolicies decide who talks.
{{- define "plux.mtlsRole" -}}
{{- $root := .root }}
{{- $role := .role }}
{{- $v := .v }}
{{- $name := printf "%s-%s" (include "plux.fullname" $root) $role }}
{{- $ctx := dict "root" $root "role" $role "v" $v }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "plux.labels" (dict "root" $root "component" $role) | nindent 4 }}
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "plux.selectorLabels" (dict "root" $root "component" $role) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (printf "plux.config.%s" $role) $root | sha256sum }}
        {{- include "plux.podAnnotations" $ctx | nindent 8 }}
      labels:
        {{- include "plux.labels" (dict "root" $root "component" $role) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plux.serviceAccountName" $root }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ include "plux.terminationGrace" $root }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "plux.podSecurityContext" (dict "root" $root "role" $role "seccomp" .seccomp) | nindent 8 }}
      {{- include "plux.scheduling" $ctx | nindent 6 }}
      containers:
        - name: plux
          image: {{ .image | quote }}
          imagePullPolicy: {{ .pullPolicy }}
          args: [serve, --config, /etc/plux/plux.yaml]
          ports:
            - {name: mtls, containerPort: {{ .port }}}
          {{- with $v.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The listener demands a client certificate, so the probes only
          # open the TCP connection.
          startupProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: {seconds: 5}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- include "plux.containerSecurityContext" $root | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/plux/plux.yaml, subPath: plux.yaml, readOnly: true}
            - {name: internal-tls, mountPath: /etc/plux/internal, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if eq $role "builder" }}
            - {name: scratch, mountPath: /var/lib/plux/build}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: internal-tls
          secret: {secretName: {{ include "plux.tlsSecretName" (dict "root" $root "role" $role) }}}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        {{- if eq $role "builder" }}
        # Cargo runs build scripts and procedural macros from here, so the
        # directory is executable; it is memory-backed, owned by the builder's
        # user and gone with the pod.
        - name: scratch
          emptyDir: {medium: Memory, sizeLimit: {{ $root.Values.builder.scratchSize }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "plux.labels" (dict "root" $root "component" $role) | nindent 4 }}
spec:
  selector:
    {{- include "plux.selectorLabels" (dict "root" $root "component" $role) | nindent 4 }}
  ports:
    - {name: mtls, port: {{ .port }}, targetPort: mtls}
---
{{ include "plux.pdb" $ctx }}
{{- if $v.autoscaling.enabled }}
---
{{ include "plux.hpa" $ctx }}
{{- end }}
{{- end -}}

{{- if .Values.functions.enabled }}
{{ include "plux.mtlsRole" (dict "root" . "role" "fnrunner" "v" .Values.fnrunner "port" 8445 "image" (include "plux.serverImage" .) "pullPolicy" .Values.image.pullPolicy) }}
---
{{ include "plux.mtlsRole" (dict "root" . "role" "egress" "v" .Values.egress "port" 8444 "image" (include "plux.serverImage" .) "pullPolicy" .Values.image.pullPolicy) }}
{{- if .Values.builder.enabled }}
---
{{ include "plux.mtlsRole" (dict "root" . "role" "builder" "v" .Values.builder "port" 8446 "image" (include "plux.builderImage" .) "pullPolicy" .Values.builderImage.pullPolicy "seccomp" .Values.builder.seccompProfile) }}
{{- end }}
{{- end }}
