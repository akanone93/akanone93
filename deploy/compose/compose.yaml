# A complete single-node Plux installation (DEP-002):
#
#   make compose-up        # generates secrets on first run, then starts it
#
# plux-server runs the api and worker roles; PostgreSQL, SeaweedFS (S3),
# Valkey, the OpenTelemetry Collector, Prometheus and Grafana run beside it.
# The function roles run as their own containers (FN-013, FN-016): fnrunner
# and egress always, builder under the `functions` profile because its image
# carries the Rust toolchain. None holds a database, storage or signing
# credential (L-4); they talk over mutual TLS (SEC-043). The render worker
# (visual diffs of release requests, O-9) runs under the `visual-diff` profile
# because its image carries the Flutter SDK. Optional profiles add Keycloak
# (an OpenID Connect provider) and Ollama. Studio
# (the BFF and the web app, DEP-002) runs beside the server. Images are pinned by digest. The API serves
# TLS 1.3 with HSTS on https://localhost:8080 under a development
# certificate that init-secrets.sh issues (README.md, "Development TLS").
#
# The signing backend is the file backend, which never signs for an
# environment marked production (SEC-056): a production installation
# configures Vault Transit in plux-server.yaml.

name: plux

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  # Docker applies its default seccomp profile (RuntimeDefault) unless a
  # service opts out; none does.
  security_opt: ["no-new-privileges:true"]

# The server image also runs the fnrunner and egress roles; the services share
# one build, so it happens once.
x-server-build: &server-build
  context: ../..
  dockerfile: backend/Dockerfile
  target: server

# The function roles reach each other and the api role on `functions`, which
# is internal: Docker gives it no route out of the host. Only plux-egress is
# also on `outbound`, so the internet is reachable from the function runner
# through the egress proxy alone (ADR-0064). `default` carries everything else.
networks:
  functions:
    internal: true
  outbound: {}
  # The worker role reaches the render worker here, and nothing else is on it
  # or can leave it: the render worker compiles and draws tenant projects and
  # needs no route out (its Flutter packages are in the image).
  render:
    internal: true

services:
  plux-server:
    <<: *hardened
    build: *server-build
    image: plux-server:local
    user: "65532:65532"
    depends_on:
      postgres: { condition: service_healthy }
      s3-bucket: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    env_file: [.secrets/plux-server.env]
    volumes:
      - ./plux-server.yaml:/etc/plux/plux.yaml:ro
      - plux-keys:/var/lib/plux/keys
      # The function-artifact key, made by init-secrets.sh so that
      # plux-fnrunner can be configured with its public half.
      - ./.secrets/function-artifact.ed25519:/var/lib/plux/keys/function-artifact.ed25519:ro
      - ./.secrets/tls:/etc/plux/tls:ro
      - ./.secrets/internal/plux-server:/etc/plux/internal:ro
    tmpfs: [/tmp]
    networks: [default, functions, render]
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped

  # Studio: the BFF serves the web app and proxies the API (DEP-002). It
  # reaches plux-server over TLS and trusts the development CA for that.
  studio:
    <<: *hardened
    build:
      context: ../..
      dockerfile: studio/Dockerfile
    image: plux-studio:local
    user: "65532:65532"
    depends_on:
      # The server has no container healthcheck (its image has no shell); the
      # BFF's /readyz asks the API itself, so Studio is ready when it answers.
      plux-server: { condition: service_started }
    # PLUX_BFF_STATE_SECRET, generated by init-secrets.sh and never committed.
    env_file: [./.secrets/studio.env]
    environment:
      PLUX_BFF_API_UPSTREAM: https://plux-server:8080
      PLUX_BFF_PUBLIC_BASE_URL: http://localhost:8081
      # Optional https URL of a documentation site, shown in the help menu:
      # PLUX_BFF_DOCS_URL: https://docs.example.org
      NODE_EXTRA_CA_CERTS: /etc/plux/ca.crt
    volumes:
      - ./.secrets/ca/ca.crt:/etc/plux/ca.crt:ro
    tmpfs: [/tmp]
    networks: [default]
    ports: ["127.0.0.1:8081:8081"]
    restart: unless-stopped

  # Runs server functions on wazero (FN-009 to FN-013). It gets modules and
  # the key-value store from plux-server's internal listener, and reaches the
  # internet through plux-egress only. It has no database, storage or signing
  # credential, no keys volume and no network but `functions`; it holds only
  # its own certificate and the public key of the function-artifact key
  # (.secrets/plux-fnrunner.yaml).
  plux-fnrunner:
    <<: *hardened
    build: *server-build
    image: plux-server:local
    user: "65532:65532"
    depends_on:
      plux-egress: { condition: service_started }
    volumes:
      - ./.secrets/plux-fnrunner.yaml:/etc/plux/plux.yaml:ro
      - ./.secrets/internal/plux-fnrunner:/etc/plux/internal:ro
    tmpfs: [/tmp]
    networks: [functions]
    restart: unless-stopped

  # The only route from plux-fnrunner to the internet (FN-013, FN-017): a
  # CONNECT-only proxy that applies each function's domain allowlist and the
  # SSRF rules. No credential; its own certificate only.
  plux-egress:
    <<: *hardened
    build: *server-build
    image: plux-server:local
    user: "65532:65532"
    volumes:
      - ./plux-egress.yaml:/etc/plux/plux.yaml:ro
      - ./.secrets/internal/plux-egress:/etc/plux/internal:ro
    tmpfs: [/tmp]
    networks: [functions, outbound]
    restart: unless-stopped

  # Compiles uploaded function sources (FN-016, ADR-0063), under the
  # `functions` profile: `docker compose --profile functions up -d`. The
  # image is large (Rust toolchain, Bun, Binaryen). No credential and no
  # network but `functions`. The builds run in a sandbox of user, network,
  # mount and PID namespaces. That needs one privilege beyond the hardened
  # defaults, the seccomp rule below, and a scratch directory that can run
  # what cargo builds; README.md ("Function builder") says why.
  plux-builder:
    <<: *hardened
    profiles: [functions]
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      target: builder
    image: plux-builder:local
    user: "65532:65532"
    security_opt:
      - "no-new-privileges:true"
      # Docker's default seccomp profile plus one rule: clone may create user,
      # network, mount and PID namespaces. No capability is added.
      - "seccomp=./seccomp-builder.json"
    volumes:
      - ./plux-builder.yaml:/etc/plux/plux.yaml:ro
      - ./.secrets/internal/plux-builder:/etc/plux/internal:ro
    tmpfs:
      - /tmp
      # Scratch for builds: cargo's output includes executables (build scripts,
      # procedural macros) that run from here, so it is not noexec.
      - /var/lib/plux/build:exec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=2g
    networks: [functions]
    restart: unless-stopped

  # Renders the visual diffs of release requests (O-9, ADR-0097) with the
  # Flutter toolchain, under the `visual-diff` profile:
  # `COMPOSE_PROFILES=visual-diff make compose-up`. The image is large (the
  # Flutter SDK) and its build downloads the pinned archive, checked against
  # its SHA-256. No credential, no keys, no route out: it answers the worker
  # role of plux-server on the `render` network over mutual TLS and holds only
  # its own certificate. It is not read-only because the Flutter tool writes
  # its lock and stamp files below the SDK (README.md, "Render worker").
  plux-render-worker:
    <<: *hardened
    read_only: false
    profiles: [visual-diff]
    build:
      context: ../..
      dockerfile: deploy/render-worker/Dockerfile
      args:
        # The same pin as FLUTTER_VERSION in the Makefile and as release.yml,
        # which also holds the digest of the archive; they change together.
        FLUTTER_VERSION: 3.47.5
        FLUTTER_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
    image: plux-render-worker:local
    user: "65532:65532"
    volumes:
      - ./.secrets/internal/plux-render-worker:/etc/plux/internal:ro
    tmpfs:
      - /tmp
      # Scratch of the renders: each builds a Flutter test project, whose
      # test executable runs from here, so it is not noexec.
      - /var/lib/plux/render:exec,nosuid,nodev,uid=65532,gid=65532,mode=0700,size=4g
    networks: [render]
    restart: unless-stopped

  postgres:
    image: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
    env_file: [.secrets/postgres.env]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-plux-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plux"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    volumes:
      - seaweedfs:/data
      - ./.secrets/s3.json:/etc/seaweedfs/s3.json:ro
    # Healthy once the master and the S3 gateway both answer: the gateway
    # starts after the master, and a client that comes first is reset (CI
    # run 38290006836).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Creates the bucket once; SeaweedFS keeps it in its data volume.
  s3-bucket:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    depends_on:
      seaweedfs: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "echo 's3.bucket.create -name plux' | weed shell -master=seaweedfs:9333"]
    restart: "no"

  valkey:
    <<: *hardened
    image: valkey/valkey:8.1.9-trixie@sha256:d5e642b89ee060a784f322cad2daad61c35d55530c32b74ce38b73ae01cd9fb3
    user: "999:999"   # the image's valkey user, so its entrypoint needs no capabilities
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
    restart: unless-stopped

  otel-collector:
    <<: *hardened
    image: otel/opentelemetry-collector-contrib:0.137.0@sha256:886722fe0f37af9d1fe24d29529253ec59fbf263b3b1df4facaf221373e19d23
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - ./.secrets/tls/ca.crt:/etc/prometheus/plux-ca.crt:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    env_file: [.secrets/grafana.env]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/plux-dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  keycloak:
    profiles: [keycloak]
    image: keycloak/keycloak:26.4.0@sha256:5f3fb534cde6bf006d79f5912473e5d2c828c707cdfc52e16972803aca9d43dd
    command: ["start-dev"]
    env_file: [.secrets/keycloak.env]
    ports: ["127.0.0.1:8180:8080"]
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.12.3@sha256:c622a7adec67cf5bd7fe1802b7e26aa583a955a54e91d132889301f50c3e0bd0
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  plux-keys:
  postgres:
  seaweedfs:
  prometheus:
  grafana:
  ollama:
