# The read-only analytics datasource (ANL-020) over analytics_rollups. It
# connects as the reader role postgres-init.sh creates; its password comes from
# PLUX_ANALYTICS_READER_PASSWORD in .secrets/grafana.env. The reader's table
# grant is in deploy/observability/analytics-reader.sql.
apiVersion: 1
datasources:
  - name: Plux analytics
    uid: plux-analytics
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: plux_analytics_reader
    database: plux
    editable: false
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $PLUX_ANALYTICS_READER_PASSWORD
