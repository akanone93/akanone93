# The dashboards of deploy/observability (OBS-005), mounted read-only by
# compose.yaml; the Helm chart ships the same files.
apiVersion: 1
providers:
  - name: plux
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/plux-dashboards
