# plux-server configuration of the Compose stack. Credentials come from
# .secrets/plux-server.env, which `make compose-up` generates.
server:
  roles: [api, worker]
  listen: ":8080"
  publicBaseURL: "https://localhost:8080"
  # The api role terminates TLS 1.3 itself, as a production installation
  # does; init-secrets.sh issues this development-only certificate.
  tls:
    certFile: "/etc/plux/tls/server.crt"
    keyFile: "/etc/plux/tls/server.key"
  # Browsers apply HSTS to a host on every port, so a long policy for
  # localhost would also force https on Grafana and Prometheus here.
  hsts:
    maxAge: "10m"
    includeSubDomains: false
  shutdownGrace: "30s"
  # The listener for the other roles (SEC-043): mutual TLS 1.3, and only a
  # certificate of the internal CA is accepted. It serves the function host
  # service that plux-fnrunner calls for modules and the key-value store.
  # init-secrets.sh issues the identity (README.md, "Internal TLS").
  internalListen: ":8443"
  internalTLS:
    caFile: "/etc/plux/internal/ca.crt"
    certFile: "/etc/plux/internal/tls.crt"
    keyFile: "/etc/plux/internal/tls.key"
database:
  migrateOnStart: true
objectStorage:
  backend: "s3"
  endpoint: "http://seaweedfs:8333"
  bucket: "plux"
  pathStyle: true
  # SeaweedFS is not reachable from devices, so they download bundles and
  # deltas from the server's own object route (DEP-041).
  cdnBaseURL: "https://localhost:8080/v1/objects"
cache:
  backend: "valkey"
  valkeyURL: "redis://valkey:6379"
signing:
  backend: "file"
  directory: "/var/lib/plux/keys"
# The development provider accepts the dev app's unattested builds in this
# non-production stack (SEC-008); a real installation leaves it off.
attestation:
  developmentProvider: true
observability:
  logFormat: "json"
  otlpEndpoint: "http://otel-collector:4318"
# Server functions (FN-020): the api role invokes them on plux-fnrunner, and
# the worker builds uploaded sources on plux-builder, which runs under the
# `functions` profile. Without it, builds fail as unavailable and every other
# feature works.
functions:
  runnerURL: "https://plux-fnrunner:8445"
builder:
  address: "https://plux-builder:8446"
# Visual diffs of release requests (O-9): the worker role sends both projects
# to plux-render-worker over mutual TLS (server.internalTLS above), which runs
# under the `visual-diff` profile. Without it a requested diff fails after its
# attempts and every other feature works.
renderWorker:
  address: "https://plux-render-worker:8443"
