global:
  scrape_interval: 15s
  evaluation_interval: 30s
# The rules of deploy/observability (OBS-004), the same file the Helm chart ships.
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: plux-server
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/plux-ca.crt
      server_name: plux-server
    static_configs:
      - targets: ["plux-server:8080"]
