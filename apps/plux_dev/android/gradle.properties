org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Play Services Cronet, which cronet_http uses for HTTP/2 (SYN-010), brings
# cronet-api and cronet-shared, which declare one namespace; the Android
# Gradle plugin 9 refuses that unless unique package names are off.
android.uniquePackageNames=false
# Kotlin's incremental compiler fails when a plugin's sources (the pub
# cache, on C: on Windows) and the app are on different drives ("this and
# base files have different roots"); the host-app guide gives every host
# the same setting.
kotlin.incremental=false
