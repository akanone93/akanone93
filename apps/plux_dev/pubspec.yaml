name: plux_dev
description: >-
  The Plux Dev app (DEV-001, ADR-0093): a host on the Plux runtime with every
  first-party optional package, pinned development root keys and QR pairing,
  so that any plugin can be previewed on a device while it is edited.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  http: ^1.6.0
  plux_charts: ^0.5.0
  plux_components: ^0.1.0
  plux_db_drift: ^0.1.0
  plux_devtools: ^0.2.0
  plux_flutter: ^0.6.0
  plux_functions: ^0.1.0
  plux_go_router: ^0.1.0
  plux_host_kit: ^0.1.0
  plux_location: ^0.1.0
  plux_lottie: ^0.1.0
  plux_maps: ^0.1.0
  plux_markdown: ^0.5.0
  plux_media: ^0.1.0
  plux_player: ^0.5.0
  plux_rive: ^0.1.0
  plux_scanner: ^0.1.0
  plux_security: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
