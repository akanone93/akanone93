name: plux_viewer
description: >-
  The viewer host (SEC-142, ADR-0082): an auditor signs in, lists the
  reconstruction releases of an app and opens one in the runtime's
  reconstruction mode, which shows the page a user saw at a past moment under
  a banner, with nothing live behind it.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  plux_components: ^0.1.0
  plux_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
