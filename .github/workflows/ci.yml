# CI — every quality gate for the monorepo (CI-001, CI-002).
#
# Design (docs/engineering/ci.md, ADR-0043):
#   - On a pull request, each job runs only when the change can affect it:
#     tools/cmd/affected reads ci/affected.json, follows the Go and Dart
#     dependency graphs and this file's job blocks, and runs everything
#     when in doubt. Pushes to main and the merge queue run every job
#     except the iOS and Android 26 device flows; the daily run and manual
#     runs run every job (ADR-0043, Revision 2026-10-16).
#   - Repository jobs (hygiene, secrets, specification, workflows, licensing,
#     links, docs site, SBOM) always run; they are fast.
#   - "CI OK" depends on every job and is the single required status check of
#     the main ruleset; it passes a skipped job only when the selection
#     skipped it, so path filtering never blocks a merge.
#   - Every job runs the same Makefile target a developer runs locally.
#   - Compiler output is checked against the goldens on Linux, macOS and
#     Windows (CMP-002); fuzzing runs on a schedule in fuzz.yml.
#   - Actions are pinned to full commit SHAs; permissions are read-only unless
#     a job needs more; checkouts never persist credentials.
#   - Caches are restored by every run and saved only by runs that are not
#     pull requests, each by one named job, so the repository's 10 GB stay
#     enough and a pull request never writes one (ADR-0043, Revision
#     2026-10-16): Go's modules and builds, one per OS (Linux: the Android
#     35 starter shard; macOS: the iOS starter shard; Windows: Go
#     determinism); Flutter and the pub cache (Linux: Dart and Flutter;
#     macOS: Size (iOS)); Gradle and the Android 35 system image (the
#     Android 35 starter shard); the pinned tools, keyed on their pins (Go
#     lint); the benchmark's package archives.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited: re-check the PR title after a rename (it becomes the squash commit).
    types: [opened, synchronize, reopened, edited]
  merge_group:
  schedule:
    - cron: "17 5 * * *" # daily: newly published vulnerabilities
  workflow_dispatch:
    inputs:
      as-push:
        description: Select the jobs a push to main runs, leaving out the daily-only ones (iOS, Android 26)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Keep in sync with the pinned versions in the Makefile.
env:
  FLUTTER_VERSION: 3.47.5
  BUN_VERSION: 1.3.11
  PRE_COMMIT_VERSION: 4.6.2
  ZIZMOR_VERSION: 1.30.1
  REUSE_VERSION: 6.2.0

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      android-apis: ${{ steps.select.outputs.android-apis }}
    steps:
      # A pull request's checkout is its merge commit: the first parent is
      # the base branch, so HEAD^1..HEAD is exactly what the merge adds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Verifies: CI-002.
      - name: Select the jobs the change affects
        id: select
        env:
          # A manual run with as-push selects as a push to main does.
          EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.as-push && 'push' || github.event_name }}
        run: |
          base=()
          if [ "$EVENT" = pull_request ]; then base=(-base HEAD^1 -head HEAD); fi
          go run ./tools/cmd/affected -event "$EVENT" "${base[@]}" \
            -github-output "$RUNNER_TEMP/selection" -summary "$GITHUB_STEP_SUMMARY"
          jobs=$(sed -n 's/^jobs=//p' "$RUNNER_TEMP/selection")
          # Android 35 when the device flows are affected; Android 26 as
          # well on pushes, daily and manual runs, and for changes to
          # Android-specific files (maintainer, 2026-10-01).
          apis=$(jq -c '[(if .["e2e-android-26"] then 26 else empty end), (if .["e2e-android"] then 35 else empty end)]' <<<"$jobs")
          {
            echo "jobs=$jobs"
            echo "android-apis=$apis"
          } >> "$GITHUB_OUTPUT"

  # ── Repository ───────────────────────────────────────────────────────────

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: File hygiene hooks
        run: make hygiene

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the tip
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make install-gitleaks
      - name: Scan history for secrets
        run: make secrets

  spec:
    name: Specification and traceability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Verifies: QA-073.
      - name: Specification consistency
        run: make spec-lint
      # Verifies: QA-070.
      - name: Traceability report
        run: make trace
      - name: Publish report
        if: always()
        run: |
          if [ -f reqtrace.md ]; then
            cat reqtrace.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: traceability-report
          path: |
            reqtrace.md
            reqtrace.json
          if-no-files-found: ignore

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make install-actionlint
      - run: pipx install "zizmor==${ZIZMOR_VERSION}"
      - name: actionlint and zizmor
        env:
          GH_TOKEN: ${{ github.token }} # enables zizmor's online audits (read-only)
        run: make workflows-lint

  licensing:
    name: Licensing (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx install "reuse==${REUSE_VERSION}"
      - name: REUSE compliance
        run: make reuse-lint

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check relative links and anchors in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path node_modules "./**/*.md"
          fail: true

  # The documentation site (ADR-0033): Starlight renders docs/ in place;
  # a broken internal link fails the build. pages.yml publishes it.
  docs-site:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Verifies: DX-002.
      - name: Build the site
        run: make docs-site

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: plux.cdx.json
          artifact-name: sbom-cyclonedx.json
          dependency-snapshot: false

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request title (becomes the squash commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          ./scripts/check-commit-msg.sh "$RUNNER_TEMP/title"
      - name: Every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            ./scripts/check-commit-msg.sh "$RUNNER_TEMP/msg" || { echo "  in commit $sha"; status=1; }
          done
          exit "$status"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Licences compatible with the open-core model (ADR-0022,
          # docs/engineering/dependencies.md §1).
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD,
            Unlicense, CC0-1.0, Zlib, BlueOak-1.0.0, Python-2.0, OFL-1.1,
            BSL-1.0, Unicode-3.0
          # Dependencies whose licence the action cannot validate: pub.dev
          # reports licences in lower case, some packages report none, and
          # Go's x/ modules add the Go patent grant to BSD-3-Clause, which the
          # action reads as a non-SPDX "AND LicenseRef-…" expression. Each
          # was checked by hand against the package's LICENSE file:
          #   Apache-2.0    clock, cryptography, material_color_utilities,
          #                 webdriver;
          #                 plux_flutter, plux_devtools, plux_go_router,
          #                 plux_auto_route, plux_native_scan and plux_media
          #                 are this repository's
          #                 (REUSE.toml), not yet on pub.dev
          #   BSD-3-Clause  the Dart team packages below, go_router,
          #                 material_ui and cupertino_ui (Flutter team),
          #                 intl, golang.org/x/net,
          #                 x/sync, x/sys and x/text
          #                 (plus the Go PATENTS grant, which adds rights);
          #                 cross_file, file_selector_*,
          #                 image_picker_platform_interface and url_launcher*
          #                 (Flutter team), mobile_scanner, win32;
          #                 image_picker, image_picker_android and
          #                 image_picker_ios also carry aFileChooser's
          #                 Apache-2.0
          #   MIT           auto_route, flutter_riverpod, node_preamble,
          #                 petitparser, riverpod, xml; yaml is BSD-3-Clause
          #                 and MIT; archive, drift, sqlite3, lottie, rive,
          #                 rive_native, geolocator*, file_picker*,
          #                 android_file_picker, windows_file_picker;
          #                 sqlcipher_flutter_libs, with OpenSSL's Apache-2.0
          #   MPL-2.0       dbus, gsettings; riverqueue/river/rivershared,
          #                 with a vendored MIT levenshtein package
          allow-dependencies-licenses: >-
            pkg:golang/github.com/riverqueue/river/rivershared,
            pkg:golang/golang.org/x/net, pkg:golang/golang.org/x/sync,
            pkg:golang/golang.org/x/sys, pkg:golang/golang.org/x/text,
            pkg:pub/_fe_analyzer_shared, pkg:pub/analyzer,
            pkg:pub/android_file_picker, pkg:pub/archive, pkg:pub/auto_route,
            pkg:pub/clock, pkg:pub/code_assets, pkg:pub/cronet_http,
            pkg:pub/cross_file, pkg:pub/crypto, pkg:pub/cryptography,
            pkg:pub/cupertino_http, pkg:pub/cupertino_ui, pkg:pub/dbus,
            pkg:pub/drift, pkg:pub/file_picker, pkg:pub/file_picker_darwin,
            pkg:pub/file_picker_linux, pkg:pub/file_picker_platform_interface,
            pkg:pub/file_picker_web, pkg:pub/file_selector_linux,
            pkg:pub/file_selector_macos, pkg:pub/file_selector_windows,
            pkg:pub/flutter_riverpod, pkg:pub/frontend_server_client,
            pkg:pub/geolocator, pkg:pub/geolocator_android,
            pkg:pub/geolocator_platform_interface, pkg:pub/geolocator_windows,
            pkg:pub/glob, pkg:pub/go_router, pkg:pub/gsettings, pkg:pub/hooks,
            pkg:pub/http, pkg:pub/image_picker, pkg:pub/image_picker_android,
            pkg:pub/image_picker_ios, pkg:pub/image_picker_platform_interface,
            pkg:pub/intl, pkg:pub/io, pkg:pub/jni, pkg:pub/jni_flutter,
            pkg:pub/listen, pkg:pub/lottie, pkg:pub/matcher,
            pkg:pub/material_color_utilities, pkg:pub/material_ui,
            pkg:pub/mime, pkg:pub/mobile_scanner, pkg:pub/native_toolchain_c,
            pkg:pub/node_preamble, pkg:pub/objective_c, pkg:pub/path,
            pkg:pub/petitparser, pkg:pub/platform, pkg:pub/plux_auto_route,
            pkg:pub/plux_devtools, pkg:pub/plux_flutter,
            pkg:pub/plux_go_router, pkg:pub/plux_media,
            pkg:pub/plux_native_scan, pkg:pub/pool, pkg:pub/process,
            pkg:pub/pub_semver, pkg:pub/record_use, pkg:pub/rive,
            pkg:pub/rive_native, pkg:pub/riverpod, pkg:pub/source_maps,
            pkg:pub/sqlcipher_flutter_libs, pkg:pub/sqlite3,
            pkg:pub/stack_trace, pkg:pub/test, pkg:pub/test_api,
            pkg:pub/test_core, pkg:pub/url_launcher,
            pkg:pub/url_launcher_android, pkg:pub/url_launcher_ios,
            pkg:pub/url_launcher_linux, pkg:pub/url_launcher_macos,
            pkg:pub/url_launcher_windows, pkg:pub/vector_graphics,
            pkg:pub/vector_math, pkg:pub/webdriver, pkg:pub/win32,
            pkg:pub/windows_file_picker, pkg:pub/xml, pkg:pub/yaml
          comment-summary-in-pr: never

  # ── Go ───────────────────────────────────────────────────────────────────

  go-lint:
    name: Go lint
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['go-lint']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the permanent-ID lock is compared with the base commit's
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # The pinned Go tools, built once per set of pins and the toolchain
      # that builds them, and flatc, built from source at its pinned commit
      # (ADR-0002): keyed on the pins alone, so neither a dependency update
      # nor another change to the Makefile rebuilds them.
      - name: Tool pins
        id: pins
        run: |
          echo "go-tools=$(make -s go-tool-pins | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "flatc=$(make -s flatc-pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-tools
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ steps.pins.outputs.go-tools }}
      - if: steps.go-tools.outputs.cache-hit != 'true'
        run: make install-golangci-lint install-buf install-sqlc
      - name: Format, lint, tidiness
        run: make go-fmt-check go-lint go-tidy-check
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flatc
        with:
          path: ~/.cache/plux
          key: flatc-${{ runner.os }}-${{ steps.pins.outputs.flatc }}
      - run: make install-flatc
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && steps.flatc.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/plux
          key: ${{ steps.flatc.outputs.cache-primary-key }}
      # `make gen` also regenerates the API contract's Go code (ADR-0005)
      # and the server's query code from its SQL (ADR-0007), with the tools
      # installed above.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && steps.go-tools.outputs.cache-hit != 'true'
        with:
          path: ~/go/bin
          key: ${{ steps.go-tools.outputs.cache-primary-key }}
      # Verifies: CI-003, BND-001.
      - name: Generated code is committed
        run: make go-gen-check
      # Verifies: BND-011.
      - name: Permanent IDs are append-only
        env:
          LOCK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make registry-lock-check LOCK_BASE="$LOCK_BASE"

  api-contract:
    name: API contract
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['api-contract']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # buf breaking compares with the last release tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # buf and its plugins from Go lint's cache of the pinned tools.
      - name: Tool pins
        id: pins
        run: echo "go-tools=$(make -s go-tool-pins | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-tools
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ steps.pins.outputs.go-tools }}
      - if: steps.go-tools.outputs.cache-hit != 'true'
        run: make install-buf
      # Verifies: SRV-000, SRV-002.
      - name: Lint, format and breaking-change check
        run: make proto-check

  # The race detector and coverage run in two parallel jobs: together
  # the two instrumentations cost more than each alone (ADR-0043,
  # Revision 2026-10-16); coverage is the same either way.
  go-test:
    name: Go test (${{ matrix.part }})
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['go-test']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: race detector
            target: go-test-race
          - part: coverage
            target: go-cover
    # Integration tests run against real infrastructure, never fakes
    # (QA-005). Without PLUX_TEST_DATABASE_URL they skip, so the same
    # command is useful on a developer's machine.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # The tests connect as a role row-level security binds, as the
      # server must (SRV-022); the image's own user is a superuser.
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-001.
      - name: Tests with the race detector, or with coverage floors
        env:
          TARGET: ${{ matrix.target }}
        run: make "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
      # ubuntu-latest is the reference runner of the timing budgets.
      - name: Compiler timing budgets
        if: matrix.target == 'go-cover'
        run: make go-budgets | tee -a "$GITHUB_STEP_SUMMARY"

  compose:
    name: Compose stack and integration
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['compose']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Verifies: DEP-002.
      - name: Build and start the single-node stack
        run: make compose-up
      - name: The server answers ready
        run: |
          for _ in $(seq 60); do curl -fsS --cacert deploy/compose/.secrets/tls/ca.crt https://localhost:8080/readyz && exit 0; sleep 2; done
          docker compose -f deploy/compose/compose.yaml logs plux-server; exit 1
      # Verifies: SEC-108.
      - name: The server container is hardened
        run: |
          id=$(docker compose -f deploy/compose/compose.yaml ps -q plux-server)
          docker inspect "$id" --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}' | tee /dev/stderr |
            grep -Eq '^65532:65532 true \[ALL\] \[no-new-privileges:true\]$'
          if docker compose -f deploy/compose/compose.yaml exec -T plux-server /bin/sh -c true 2>/dev/null; then
            echo "::error::the server image has a shell; it must be distroless"; exit 1
          fi
      # Verifies: QA-005.
      - name: Integration and end-to-end tests against PostgreSQL, SeaweedFS and Valkey
        run: make compose-test
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
      # Verifies: CMP-031, CMP-002.
      - name: The shipped SVG compiler reproduces its golden; the image carries its notices
        run: make image-check

  # The OWASP ZAP baseline scan of the API against the Compose stack
  # (QA-008); the scan of Studio joins in P11. The same selection as the
  # stack's own job: a server, image or deployment change can open a hole.
  zap-api:
    name: OWASP ZAP baseline (API)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['zap-api']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start the single-node stack
        run: make compose-up
      # Verifies: QA-008.
      - name: Scan the API; only test/zap/api-rules.tsv is ignored
        run: make zap-api
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: zap-api-report
          path: build/zap/zap-api.*
          if-no-files-found: ignore

  # The release image is multi-arch; its arm64 half builds Skia and
  # plux-svgc natively here, so an arm64 break or a difference in the
  # worker's output between architectures shows before a release.
  image-arm64:
    name: Server image (arm64)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['image-arm64']
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Verifies: CMP-031, CMP-002.
      - name: Build the image; the shipped SVG compiler reproduces the amd64 golden
        run: make image-check

  # On Linux and Windows here; on macOS in the Size (iOS) job, so the macOS
  # jobs fit GitHub's five concurrent macOS runners (ADR-0043, Revision
  # 2026-10-16).
  go-determinism:
    name: Go determinism (${{ matrix.os }})
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['go-determinism']
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: command -v make || choco install make --no-progress
      # Every platform compiles the conformance vectors and projects to the
      # committed goldens, byte for byte.
      - name: Goldens are reproduced
        run: make go-determinism
      # Windows' Go caches: this is the only job on Windows.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && runner.os == 'Windows' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  go-build:
    name: Go build
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['go-build']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false # reproducibility is checked with cold caches
      - name: Build
        run: make go-build
      # Verifies: CI-006.
      - name: Reproducible build
        run: make go-reproducible

  go-vuln:
    name: Go vulnerabilities
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['go-vuln']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - run: make install-govulncheck
      - name: govulncheck
        run: make go-vuln

  wasm-codecs:
    name: Image codecs reproduce
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['wasm-codecs']
    runs-on: ubuntu-24.04 # build.sh pins the toolchain of Ubuntu 24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          ci/apt-install.sh clang-18 lld-18 llvm-18 libclang-rt-18-dev-wasm32 \
            wasi-libc=0.0~git20230113.4362b18-3 cmake ninja-build
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/wasm-ld-18 /usr/local/bin/wasm-ld
      # Verifies: CMP-030.
      - name: Rebuild the codecs and compare them with codecs.lock
        run: WORK="$RUNNER_TEMP/codecs-work" make wasm-codecs-check WASM_CODECS_OUT="$RUNNER_TEMP/codecs"
      - name: Show how a rebuilt codec differs
        if: failure()
        run: |
          for m in webp avif; do
            committed=backend/internal/compiler/media/codecs/$m.wasm rebuilt="$RUNNER_TEMP/codecs/$m.wasm"
            cmp -s "$committed" "$rebuilt" && continue
            echo "== $m.wasm: committed $(wc -c <"$committed") bytes, rebuilt $(wc -c <"$rebuilt") bytes; first difference:"
            cmp "$committed" "$rebuilt" | head -1 || true
            diff <(strings -n 6 "$committed") <(strings -n 6 "$rebuilt") | head -40 || true
          done
          # The configuration CMake generated, to compare with a local build.
          cd "$RUNNER_TEMP/codecs-work"
          sha256sum aom-build/config/*.h
          grep -E '^#define (CONFIG|HAVE|ARCH)_' aom-build/config/aom_config.h
          grep -E '^(CMAKE_C_COMPILER|CMAKE_AR|CMAKE_RANLIB|CMAKE_C_FLAGS)[:=]' aom-build/CMakeCache.txt avif-build/CMakeCache.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: rebuilt-codecs
          path: ${{ runner.temp }}/codecs/*.wasm
          retention-days: 7

  functions:
    name: Rust SDK and function builds
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['functions']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # The end-to-end build signs and deploys through the function domain,
    # which stores versions in PostgreSQL (QA-005).
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # rustup on the runner installs the toolchain sdk/fn/rust-toolchain.toml
      # pins (Rust 1.97.0 with wasm32-wasip1) on the first cargo call.
      - name: Install the pinned Rust toolchain
        working-directory: sdk/fn
        run: rustup show active-toolchain || rustup toolchain install
      # The builder's sandbox runs each build in new user, mount, network
      # and PID namespaces (ADR-0063); Ubuntu 24.04 restricts unprivileged
      # user namespaces through AppArmor by default.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: FN-001, FN-004.
      - name: Format, lint and test the SDK
        run: make rust-check
      # Verifies: FN-016, FN-019.
      - name: Build the examples with the builder role, twice, and compare
        run: make rust-e2e

  wamr:
    name: Vendored WAMR matches upstream
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['wamr']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Verifies: FN-050.
      - name: Re-create WAMR 2.4.3 from the upstream release and compare
        run: make wamr-check

  # ── Dart and Flutter ─────────────────────────────────────────────────────

  dart:
    name: Dart and Flutter
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['dart']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Verifies: CI-003.
      - name: Lockfile is committed
        run: make dart-lock-check
      - name: Format, analyze, test with coverage floors (three packages at a time)
        run: make dart-fmt-check dart-analyze dart-cover | tee -a "$GITHUB_STEP_SUMMARY"
      # Verifies: WGT-003.
      - name: Flutter snapshot matches the pinned SDK
        run: make widgets-api-check
      # Linux's Flutter and pub cache: this job resolves the whole pub
      # workspace (dart-lock-check).
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && steps.flutter-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && steps.pub-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

  # The starter app's flows against a server built from source, under
  # flutter test on the runner (the device jobs below run them on an
  # emulator and a simulator), and the compatibility matrix against released runtimes
  # and servers, which needs the tags.
  starter-e2e:
    name: Starter app end-to-end
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['starter-e2e']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-006, QA-010.
      - name: Starter flows and the compatibility matrix
        run: make compat | tee -a "$GITHUB_STEP_SUMMARY"

  # The same flows on an Android emulator and an iOS simulator, in the app
  # built for the device, with the platform's key store and HTTP client
  # (test/e2e/README.md). No emulator action: the runner's Android SDK
  # tools, and Xcode's simctl. Each flow runs as its own job (E2E_SHARD,
  # mk/device.mk): the starter, a generated project, the add-to-app hosts,
  # Plux Bank and Plux Express. Android 26 and iOS do not run on pushes to
  # main or in the merge queue: a pull request that can affect them runs
  # them, and so do the daily and manual runs (ADR-0043, Revision
  # 2026-10-16). Caches are restored on every run and saved by a passing
  # run that is not a pull request, keyed on the toolchain and the
  # lockfiles. GitHub scopes a cache to the branch that saved it: main's
  # caches reach every branch, a branch's reach only that branch, and pull
  # requests never save, so no branch or pull request can write a cache
  # main reads (maintainer, 2026-10-07; ADR-0043, Revision).
  e2e-android:
    name: Device end-to-end (Android ${{ matrix.api }}, ${{ matrix.shard }})
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['e2e-android'] || fromJSON(needs.changes.outputs.jobs)['e2e-android-26']
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 26: the oldest level that boots here (the API 24 kernel panics
        # on the emulator, ADR-0035); 35: current. Which of them run is
        # the selection's (changes job).
        api: ${{ fromJSON(needs.changes.outputs.android-apis) }}
        shard: [starter, generated, hosts, bank, express]
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # Gradle's distribution and caches, one for every shard and the size
      # jobs (ADR-0043): each build downloads and transforms the same
      # dependencies. The shards are short enough without their build
      # outputs, which would crowd the repository's cache quota. A changed
      # lockfile starts from the previous cache: run 37644772933 started
      # with none, and Maven Central answered ten parallel builds with 429
      # Too Many Requests.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gradle
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: e2e-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'apps/*/pubspec.lock', 'apps/*/android/**/*.gradle.kts', 'apps/*/android/gradle/wrapper/gradle-wrapper.properties', 'apps/add_to_app/android_host/**/*.gradle.kts', 'packages/*/android/**') }}
          restore-keys: e2e-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      # The emulator and the API 35 system image: downloading them in ten
      # jobs at once broke an archive in run 37644772933. Android 26, which
      # runs only daily, manually and for pull requests that change Android
      # files, downloads its image: its 1.3 GB cache pushed the repository
      # past its 10 GB, which evicted every other cache (ADR-0043, Revision
      # 2026-10-16).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: android-sdk
        if: matrix.api == 35
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}
          key: e2e-android-sdk-${{ matrix.api }}-${{ runner.os }}-${{ hashFiles('test/e2e/android.sh') }}
          restore-keys: e2e-android-sdk-${{ matrix.api }}-${{ runner.os }}-
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-006, RT-002, HST-033.
      - name: The shard's flows on the emulator
        env:
          API: ${{ matrix.api }}
          E2E_SHARD: ${{ matrix.shard }}
        run: make e2e-android ANDROID_API="$API"
      # Saved by a passing run that is not a pull request (branch-scoped,
      # above), by the shard whose build has the most dependencies (the
      # starter, with every plugin), which also builds the server's tests and
      # the CLI that every Linux job with Go builds.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && matrix.api == 35 && matrix.shard == 'starter' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && matrix.api == 35 && matrix.shard == 'starter' && steps.gradle.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && matrix.api == 35 && matrix.shard == 'starter' && steps.android-sdk.outputs.cache-hit != 'true'
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api }}
          key: ${{ steps.android-sdk.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-android-${{ matrix.api }}-${{ matrix.shard }}
          path: build/e2e/*.log
          retention-days: 14

  e2e-ios:
    name: Device end-to-end (iOS, ${{ matrix.shard }})
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['e2e-ios']
    # The newest iPhone on the newest iOS and Xcode (ADR-0035).
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Four, not five: GitHub runs at most five macOS jobs at once, and
        # the iOS size job is the fifth (run 37630248033 queued a sixth
        # for six minutes). The two shortest flows share a job.
        shard: [starter, hosts, bank, express+generated]
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: go-cache
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # macOS ships GNU Make 3.81, which ignores .SHELLFLAGS; the Makefile
      # needs 4 or later.
      - name: Use GNU Make 4 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      # macOS runners have no service containers: PostgreSQL from Homebrew.
      - name: Start PostgreSQL and create the application role
        run: |
          brew install --quiet postgresql@16
          "$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$RUNNER_TEMP/pg" init -o "--auth=trust --username=postgres" >/dev/null
          "$(brew --prefix postgresql@16)/bin/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-k $RUNNER_TEMP -h 127.0.0.1" start
          psql() { "$(brew --prefix postgresql@16)/bin/psql" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 "$@"; }
          psql -d postgres -c "CREATE DATABASE plux_test;"
          psql -d plux_test -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # No Xcode build cache: a fresh checkout gives every source file a new
      # modification time, so a restored DerivedData was rebuilt anyway; a
      # restored cache never made a shard faster (runs 38776124984,
      # 38782704836) and the four took 2.2 GB of the repository's 10 GB
      # (ADR-0043, Revision 2026-10-16).
      # Verifies: QA-006, RT-002, HST-033.
      - name: The shard's flows on the simulator
        env:
          E2E_SHARD: ${{ matrix.shard }}
        run: make e2e-ios
      # macOS's Go caches, saved by the starter's shard, which builds the
      # server's tests and the CLI as the other shards do.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && matrix.shard == 'starter' && steps.go-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-ios-${{ matrix.shard }}
          path: build/e2e/
          retention-days: 14

  # ── Benchmarks and size (QA-007) ─────────────────────────────────────────

  # The runtime benchmark in profile mode, on Linux desktop under xvfb:
  # this commit's runtime and the base's run alternately on the same
  # runner, and the job fails when this one is more than 10% slower
  # (docs/benchmarks/p3-runtime.md). Absolute numbers come from the
  # reference devices, not from here. Its parts run in parallel jobs,
  # each with the base and the change on one runner and the same method
  # (ADR-0043); together they measure every metric.
  bench-runtime:
    name: Runtime benchmark (${{ matrix.shard }})
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['bench-runtime']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced by the time a run of each part takes (ADR-0043,
          # Revision 2026-10-16): since the sync isolate's fix (#32), a run
          # of start-up takes under a second and one of opening about 8 s;
          # the list, scrolled end to end, is the longest part.
          - shard: start-up and open
            scenarios: startup,open
          - shard: native control and scroll
            scenarios: native,scroll
          - shard: list
            scenarios: list
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # The packages' archives: three parts download the same 38 MB, and
      # the runners' mirror has taken 16 minutes for them (run 36894816035).
      # apt still installs what the current index names.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: apt
        with:
          path: ~/apt-archives
          key: apt-desktop-${{ runner.os }}-ubuntu-24.04
      - name: Install the Linux desktop toolchain and a virtual display
        run: |
          mkdir -p ~/apt-archives/partial
          ci/apt-install.sh -o Dir::Cache::Archives="$HOME/apt-archives" \
            clang cmake ninja-build pkg-config libgtk-3-dev xvfb
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && matrix.scenarios == 'startup,open' && steps.apt.outputs.cache-hit != 'true'
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.cache-primary-key }}
      - name: Choose the base to compare with
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=$PR_BASE ;;
            merge_group) base=$QUEUE_BASE ;;
            push) base=$BEFORE ;;
            *) base=$(git merge-base HEAD origin/main) ;;
          esac
          # A push that created the branch, or a run on main itself: the
          # parent commit.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # Verifies: QA-007.
      - name: Compare with the base's runtime
        env:
          BASE: ${{ steps.base.outputs.sha }}
          SCENARIOS: ${{ matrix.scenarios }}
        run: make bench-runtime-ab BASE="$BASE" SCENARIOS="$SCENARIOS"
      - name: Report
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          echo "#### Runtime benchmark: $SHARD" >> "$GITHUB_STEP_SUMMARY"
          cat build/bench-runtime/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-runtime-${{ matrix.scenarios }}
          path: |
            build/bench-runtime/**/*.json
            build/bench-runtime/**/*.log
            build/bench-runtime/report.md
          retention-days: 14

  # The sync benchmark: the runtime syncs the fifty-plugin benchmark app
  # through the spec's slow network against a server built from source. The
  # function runner's invocation overhead (NFR-022) is measured here too.
  bench-sync:
    name: Sync benchmark
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['bench-sync']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLUX_TEST_DATABASE_URL: postgres://plux:plux@127.0.0.1:5432/plux_test?sslmode=disable
      PLUX_BENCH_SYNC_OUT: ${{ github.workspace }}/bench-sync.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Create the application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d plux_test -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE plux LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'plux'; GRANT CONNECT, CREATE, TEMPORARY ON DATABASE plux_test TO plux; ALTER SCHEMA public OWNER TO plux;"
      # Verifies: QA-007, NFR-007.
      - name: Sync on the simulated slow network
        run: make bench-sync
      # Verifies: NFR-022, FN-023.
      - name: Function invocation overhead
        run: make bench-fn
      - name: Report
        if: always()
        run: cat "$PLUX_BENCH_SYNC_OUT" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  # What plux_flutter adds to release builds: the blank app of test/size
  # with and without it (RT-061, ADR-0036); and, in a parallel job, the
  # release builds of the starter app and Plux Bank checked for dev tooling
  # (SEC-074), which took a third of the job alone (ADR-0043, Revision
  # 2026-10-16).
  size-android:
    name: ${{ matrix.name }}
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['size-android']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Size (Android)
            part: size
          - name: Release inspect (Android)
            part: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # The device jobs' Gradle cache: the same Flutter, plugins and
      # Gradle distribution, and the same key (e2e-android).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: e2e-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'apps/*/pubspec.lock', 'apps/*/android/**/*.gradle.kts', 'apps/*/android/gradle/wrapper/gradle-wrapper.properties', 'apps/add_to_app/android_host/**/*.gradle.kts', 'packages/*/android/**') }}
          restore-keys: e2e-gradle-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      # Verifies: RT-061, NFR-009.
      - name: Release APKs and App Bundle, blank and with plux_flutter
        if: matrix.part == 'size'
        run: make size-android
      # Verifies: SEC-074, DEV-050.
      - name: Release APKs of the starter and Plux Bank hold no dev tooling
        if: matrix.part == 'release'
        run: make release-inspect PLATFORM=android
      - name: Report
        if: always() && matrix.part == 'size'
        run: cat build/size/android-compare.md build/size/android.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.part == 'size'
        with:
          name: size-android
          path: |
            build/size/android.md
            build/size/android-compare.md
            build/size/android-*.md
            build/size/android-code-size.txt
            build/size/code-size/
          retention-days: 14

  # The fifth macOS job beside the four iOS device shards (GitHub runs five
  # macOS jobs at once): the size of the iOS build, when the runtime's
  # shipped code can change it, and the compiler's goldens on macOS
  # (CMP-002), which Go determinism checks on Linux and Windows. The goldens
  # run whenever the job does, so a change to this block is checked by the
  # pull request that makes it (ADR-0043, Revision 2026-10-16).
  size-ios:
    name: Size (iOS), Go determinism (macOS)
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['size-ios'] || fromJSON(needs.changes.outputs.jobs)['go-determinism']
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SIZE: ${{ fromJSON(needs.changes.outputs.jobs)['size-ios'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      # Go's module and build caches, one per OS (header).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/AppData/Local/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.work', 'backend/go.mod', 'backend/go.sum', 'tools/go.mod', 'test/refapi/go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      # macOS ships GNU Make 3.81, which ignores .SHELLFLAGS; the Makefile
      # needs 4 or later.
      - name: Use GNU Make 4 (macOS)
        run: |
          brew install --quiet make
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
      # Verifies: CMP-002.
      - name: Goldens are reproduced
        run: make go-determinism
      # Flutter and the pub cache, one each per OS (header): the action
      # names them without installing (dry run), every run restores them,
      # then the action finds the SDK in place.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        id: flutter
        if: env.SIZE == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          dry-run: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: flutter-cache
        if: env.SIZE == 'true'
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter.outputs.CACHE-KEY }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pub-cache
        if: env.SIZE == 'true'
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ steps.flutter.outputs.PUB-CACHE-KEY }}-
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: env.SIZE == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      # Verifies: RT-061, NFR-009.
      - name: Release app for arm64, blank and with plux_flutter, unsigned
        if: env.SIZE == 'true'
        run: make size-ios
      # Verifies: SEC-074, DEV-050.
      - name: Release apps of the starter and Plux Bank hold no dev tooling
        if: env.SIZE == 'true'
        run: make release-inspect PLATFORM=ios
      - name: Report
        if: always() && env.SIZE == 'true'
        run: cat build/size/ios.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      # macOS's Flutter and pub cache: the whole pub workspace first, so the
      # device shards find every package.
      - name: Resolve the pub workspace
        if: github.event_name != 'pull_request' && env.SIZE == 'true' && (steps.flutter-cache.outputs.cache-hit != 'true' || steps.pub-cache.outputs.cache-hit != 'true')
        run: make dart-get
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && env.SIZE == 'true' && steps.flutter-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && env.SIZE == 'true' && steps.pub-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.flutter.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

  # ── Studio ───────────────────────────────────────────────────────────────

  studio:
    name: Studio
    needs: changes
    if: fromJSON(needs.changes.outputs.jobs)['studio']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Install (frozen lockfile), lint, type-check, test with coverage floors
        run: make studio-check | tee -a "$GITHUB_STEP_SUMMARY"

  # ── Gate ─────────────────────────────────────────────────────────────────

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - hygiene
      - secrets
      - spec
      - workflows
      - licensing
      - links
      - docs-site
      - sbom
      - commits
      - dependency-review
      - go-lint
      - api-contract
      - go-test
      - compose
      - zap-api
      - image-arm64
      - wasm-codecs
      - functions
      - wamr
      - go-determinism
      - go-build
      - go-vuln
      - dart
      - starter-e2e
      - e2e-android
      - e2e-ios
      - bench-runtime
      - bench-sync
      - size-android
      - size-ios
      - studio
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # Verifies: CI-002.
      - name: Fail unless every job succeeded or was skipped by the selection
        env:
          NEEDS: ${{ toJSON(needs) }}
          JOBS: ${{ needs.changes.outputs.jobs }}
          EVENT: ${{ github.event_name }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A job may be skipped only when the selection of the changes job
          # skipped it; the commit and dependency checks run only on pull
          # requests, and the commit check not on Dependabot's. Anything
          # else skipped (a failed changes job, a broken condition) fails.
          echo "$NEEDS" | jq -e --argjson sel "${JOBS:-null}" --arg event "$EVENT" --arg author "$AUTHOR" '
            def skippable($job):
              if $job == "e2e-android" then ($sel["e2e-android"] or $sel["e2e-android-26"]) == false
              elif $job == "size-ios" then ($sel["size-ios"] or $sel["go-determinism"]) == false
              elif $job == "commits" then $event != "pull_request" or $author == "dependabot[bot]"
              elif $job == "dependency-review" then $event != "pull_request"
              else $sel[$job] == false end;
            $sel != null and all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and skippable(.key)))' > /dev/null
