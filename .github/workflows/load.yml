# Load — the manifest endpoint's throughput target (NFR-020), the device
# fleet (DEP-051, NFR-023) and control propagation (NFR-024), measured
# nightly and on demand rather than on every pull request. The Compose
# stack is started with the load overlay, seeded with the loan calculator
# promoted to staging, and k6 runs test/load/manifest.js against it.
# A GitHub-hosted runner is smaller than the reference deployment (§30.1),
# so the run records the numbers in the job summary; the committed
# benchmark in docs/benchmarks/p2-backend.md is the reference measurement.

name: Load

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      rate:
        description: Requests per second
        default: "5000"

permissions: {}

# Keep in sync with the pinned versions in the Makefile (ci.md).
env:
  FLUTTER_VERSION: 3.47.5
  BUN_VERSION: 1.3.11

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  manifest:
    name: Manifest endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # The Studio image takes the pinned CanvasKit from this SDK (make studio-image-inputs).
      - run: flutter precache --web
      - name: Start and seed the stack
        run: make compose-seed COMPOSE_OVERLAY=deploy/compose/compose.load.yaml
      # Verifies: NFR-020.
      - name: k6
        env:
          RATE: ${{ inputs.rate || '5000' }}
        run: |
          . deploy/compose/.secrets/dev.env
          export SSL_CERT_FILE="$PWD/deploy/compose/.secrets/tls/ca.crt"
          k6 run --summary-export k6-summary.json -e BASE_URL=https://localhost:8080 -e APP_ID="$PLUX_DEV_APP" \
            -e ENVIRONMENT=staging -e RATE="$RATE" -e DURATION=60s test/load/manifest.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v

  # A fleet of synthetic devices against the Compose stack (DEP-051,
  # NFR-023): the generator of backend/cmd/plux-load, nightly at a size a
  # hosted runner holds; the report goes to the job summary.
  fleet:
    name: Device fleet
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      # Verifies: DEP-051, NFR-023.
      - name: Run the fleet
        run: make load-test LOAD_DEVICES=1000 LOAD_DURATION=5m | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v

  # How long a control-document change takes to reach a fleet, by polling
  # and with silent push through a fake FCM (NFR-024).
  control:
    name: Control propagation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      # Verifies: NFR-024.
      - name: Measure propagation
        run: |
          url=$(make --no-print-directory test-db | sed -n 's/^  export PLUX_TEST_DATABASE_URL=//p')
          PLUX_TEST_DATABASE_URL="$url" make bench-control | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove the test database
        if: always()
        run: make test-db-down
