# Image — build, push, sign and attest one multi-arch image: the distroless
# images of the backend, the Studio image and the render worker image
# (DEP-001, SEC-108, CI-004, CI-006, O-9). Called by release.yml for each
# image; the SLSA provenance is generated there from the digest returned.

name: Image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/<owner>/
        type: string
        required: true
      dockerfile:
        description: Dockerfile, relative to the repository root
        type: string
        default: backend/Dockerfile
      target:
        description: Target of the Dockerfile; empty builds the last stage
        type: string
        default: ""
      version:
        description: Release version, without the component prefix
        type: string
        required: true
      build-args:
        description: Further build arguments, one NAME=value per line
        type: string
        default: ""
      stage-canvaskit:
        description: Stage the pinned CanvasKit into the build context first (the Studio image)
        type: boolean
        default: false
      rewrite-timestamp:
        description: Build with SOURCE_DATE_EPOCH set to the commit date and every layer timestamp rewritten (CI-006)
        type: boolean
        default: false
    outputs:
      name:
        description: Image name without tag or digest
        value: ${{ jobs.image.outputs.name }}
      digest:
        description: Manifest-list digest
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

# Keep in sync with the pinned versions in the Makefile.
env:
  FLUTTER_VERSION: 3.47.5
  BUN_VERSION: 1.3.11

jobs:
  image:
    name: ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signatures
    outputs:
      name: ${{ steps.meta.outputs.name }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Studio image has no Flutter SDK inside: the pinned CanvasKit comes
      # from this one, and the build checks it against its SHA-256 (DEP-001).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.stage-canvaskit
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: inputs.stage-canvaskit
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false # a release is built from a cold cache (CI-006)
      - name: Stage the pinned CanvasKit
        if: inputs.stage-canvaskit
        run: |
          flutter precache --web
          make studio-image-inputs
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name and build metadata
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "name=ghcr.io/${OWNER,,}/$IMAGE"
            echo "tag=ghcr.io/${OWNER,,}/$IMAGE:$VERSION"
            echo "commit=$(git rev-parse HEAD)"
            echo "date=$(TZ=UTC0 git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        if: ${{ !inputs.rewrite-timestamp }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          provenance: false # SLSA provenance comes from the generator in release.yml
          sbom: false # attached as a signed CycloneDX attestation below
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            COMMIT_DATE=${{ steps.meta.outputs.date }}
            ${{ inputs.build-args }}
      # The same build with the commit date as every timestamp: the image is a
      # pure function of the commit, which make studio-image-repro checks in CI.
      - name: Build and push (reproducible)
        id: reproducible
        if: inputs.rewrite-timestamp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ steps.meta.outputs.name }},push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tag }}
          provenance: false # SLSA provenance comes from the generator in release.yml
          sbom: false # attached as a signed CycloneDX attestation below
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ steps.meta.outputs.epoch }}
            ${{ inputs.build-args }}
      - name: Digest of the pushed image
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.reproducible.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build returned no image digest"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.name }}@${{ steps.digest.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      # Verifies: DEP-001, CI-004.
      - name: Sign the image and attest its SBOM
        env:
          REF: ${{ steps.meta.outputs.name }}@${{ steps.digest.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$REF"
