# OpenSSF Scorecard — supply-chain security posture of the repository.
# Results appear in the Security tab (code scanning) and on the public
# Scorecard API, which backs the README badge.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly, Monday
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

# Every run step is bash with -eo pipefail, so a failing command fails its
# step even when piped (into tee, say); the runner's default shell has no
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read workflow runs for the CI-Tests check
      security-events: write # upload SARIF to code scanning
      id-token: write # sign and publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
