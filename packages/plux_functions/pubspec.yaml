name: plux_functions
description: >-
  The Plux device function engine: runs Plux Functions compiled to
  WebAssembly on the device, in an interpreter, off the UI isolate.
version: 0.1.0
repository: https://github.com/nightCode42/plux3/tree/main/packages/plux_functions
# Not published until its release is wired (release.yml, pub.dev).
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  code_assets: ^1.2.1
  flutter:
    sdk: flutter
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.3
  plux_flutter: ^0.6.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
