name: plux_charts
description: >-
  Chart widgets for Plux pages: LineChart, BarChart, PieChart and Sparkline,
  drawn in house, with text summaries and data tables for screen readers.
version: 0.5.0
repository: https://github.com/nightCode42/plux3/tree/main/packages/plux_charts
# Not published until its release is wired (release.yml, pub.dev).
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plux_flutter: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
