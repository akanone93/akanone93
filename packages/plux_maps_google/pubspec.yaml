name: plux_maps_google
description: >-
  MapView and OrderTrackerMap for Plux pages on Google Maps; the host app
  supplies the Google Maps API key.
version: 0.1.0
repository: https://github.com/nightCode42/plux3/tree/main/packages/plux_maps_google
# Not published until its release is wired (release.yml, pub.dev).
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: 2.19.0
  plux_flutter: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
