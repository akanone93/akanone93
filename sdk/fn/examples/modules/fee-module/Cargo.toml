[package]
name = "fee-module"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
plux-fn = "0.1"
fee = { path = "../../fee" }

[features]
