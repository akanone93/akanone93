[workspace]
resolver = "3"
members = ["plux-fn", "examples/loan", "examples/fee", "examples/modules/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"

# FN-001: function crates depend on the published name `plux-fn = "0.1"`. The crate is
# not on crates.io, so every build workspace, this one included, resolves that name to
# the SDK the builder pins (ADR-0063).
[patch.crates-io]
plux-fn = { path = "plux-fn" }

# E7: the release profile is part of the reproducible-build contract (FN-019).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
