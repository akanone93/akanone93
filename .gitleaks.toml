# gitleaks configuration — https://github.com/gitleaks/gitleaks
# Extends the built-in rule set; add narrowly scoped allowlist entries only.

title = "plux"

[extend]
useDefault = true

[allowlist]
description = "Files that cannot contain real secrets"
paths = [
  '''go\.sum$''',
  '''pubspec\.lock$''',
  '''bun\.lockb?$''',
  # Vendored zstd sources, re-imported only by native/zstd/import.sh
  # (ADR-0030): xxhash.h names SIMD registers data_key_lo/hi.
  '''^packages/plux_flutter/native/zstd/common/xxhash\.h$''',
  # The Standard Webhooks test vectors (feat/phase-9), copied unmodified from
  # github.com/standard-webhooks/standard-webhooks: the published test key
  # whsec_MfKQ9r8G…, not a credential. Maintainer-approved, 2026-10-22.
  '''^(ee/)?backend/internal/(notify/webhook|stdwebhook)/testdata/standard_webhooks_vectors\.json$''',
]
