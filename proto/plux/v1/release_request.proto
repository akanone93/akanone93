syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// ReleaseRequestService holds the state of Studio's publish wizard on the
// server (STU-100, ADR-0097): a release request moves through the nine steps
// of the publish flow, and the wizard only displays it. Closing the tab loses
// nothing, and there is at most one open request per app, environment and
// channel. Every mutating call carries an idempotency key (SRV-005); a call
// that completes a step the request has already passed returns the request
// as it is. An approval is bound to the content hash of the builds
// (GOV-022): if the content changes, the approval is void and the request
// returns to the build step.
service ReleaseRequestService {
  // CreateReleaseRequest opens a request at the select step. If the app,
  // environment and channel already have an open request, that one is
  // returned with existing set, so that Studio can show who is publishing.
  // It needs release.publish.
  rpc CreateReleaseRequest(CreateReleaseRequestRequest) returns (CreateReleaseRequestResponse) {}
  // GetReleaseRequest returns a request, its diff jobs and results. It needs
  // plugin.read.
  rpc GetReleaseRequest(GetReleaseRequestRequest) returns (GetReleaseRequestResponse) {}
  // ListReleaseRequests lists the requests of an app, newest first. It needs
  // plugin.read.
  rpc ListReleaseRequests(ListReleaseRequestsRequest) returns (ListReleaseRequestsResponse) {}
  // AdvanceReleaseRequest completes the step the request is at (select,
  // build, reports, diffs, changelog, target or rollout) with that step's
  // payload and moves it to the next. It needs release.publish.
  rpc AdvanceReleaseRequest(AdvanceReleaseRequestRequest) returns (AdvanceReleaseRequestResponse) {}
  // RefreezeReleaseRequest returns a request to the build step after the
  // draft changed; builds, reports, diffs and any approval are void. It needs
  // release.publish.
  rpc RefreezeReleaseRequest(RefreezeReleaseRequestRequest) returns (RefreezeReleaseRequestResponse) {}
  // RequestVisualDiff queues the render job of the exact content, rate-limited
  // per organisation. Asking again while a job is queued or running returns
  // that job. It needs release.publish.
  rpc RequestVisualDiff(RequestVisualDiffRequest) returns (RequestVisualDiffResponse) {}
  // RequestReleaseApproval is the approval step: it asks the approval engine
  // whether the policies need approval of this content, opens a request there
  // if they do, and moves the release request on when they are satisfied. It
  // needs release.publish.
  rpc RequestReleaseApproval(RequestReleaseApprovalRequest) returns (RequestReleaseApprovalResponse) {}
  // CompleteReleaseRequest is the release step: it creates the app release
  // from the built versions and promotes it to the channel. It needs
  // release.promote; production still needs the step-up of SEC-103.
  rpc CompleteReleaseRequest(CompleteReleaseRequestRequest) returns (CompleteReleaseRequestResponse) {}
  // CancelReleaseRequest ends an open request. Versions already built stay.
  // It needs release.publish.
  rpc CancelReleaseRequest(CancelReleaseRequestRequest) returns (CancelReleaseRequestResponse) {}
}

// ReleaseRequest is the server-side state of one publish flow.
message ReleaseRequest {
  string id = 1;
  string app_id = 2;
  string environment_id = 3;
  string channel = 4;
  // state is the step the request is at (select, build, reports, diffs,
  // changelog, target, approval, rollout, release) or how it ended
  // (released, rejected, expired, cancelled).
  string state = 5;
  // hold says why the request waits at its step: failed, blocked or
  // awaiting_approval; empty when it does not.
  string hold = 6;
  string hold_reason = 7;
  // revision rises with every change; a client can tell that it is stale.
  int64 revision = 8;
  repeated SelectedPlugin plugins = 9;
  repeated BuildRef builds = 10;
  // acknowledged lists the warnings the user acknowledged.
  repeated string acknowledged = 11;
  // content_hash is the SHA-256 of what the builds produced, in hex; empty
  // before the builds are done.
  string content_hash = 12;
  string changelog_notes = 13;
  string label = 14;
  // rollout_plan is the plan as JSON; empty before the rollout step.
  bytes rollout_plan = 15;
  // approval_request_id names the request in ApprovalService, if one was
  // opened.
  string approval_request_id = 16;
  // approved_hash is the content hash the approval was given for.
  string approved_hash = 17;
  // release_sequence is the app release the request made, once released.
  int64 release_sequence = 18;
  string created_by = 19;
  string created_by_name = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  google.protobuf.Timestamp ended_at = 23;
}

// SelectedPlugin is a plugin in the request and why it is there.
message SelectedPlugin {
  string plugin_key = 1;
  // reason is "changed" for a plugin with unpublished changes and
  // "dependency" for one added because another needs it (REL-003).
  string reason = 2;
}

// BuildRef is the publish job that froze and built one plugin.
message BuildRef {
  string plugin_key = 1;
  string job_id = 2;
  // state is the job's state when the request last looked.
  string state = 3;
  int64 version = 4;
  string bundle_sha256 = 5;
  int32 errors = 6;
  // warnings are the identifiers of the job's warnings, which the reports step
  // acknowledges.
  repeated string warnings = 7;
}

// VisualDiffJob is a render job of the visual-diff step (O-9).
message VisualDiffJob {
  string id = 1;
  string release_request_id = 2;
  string content_hash = 3;
  // state is queued, running, succeeded or failed.
  string state = 4;
  string error = 5;
  repeated VisualDiffScreen screens = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}

// VisualDiffScreen is one changed screen rendered on one standard device.
message VisualDiffScreen {
  string plugin_key = 1;
  string screen = 2;
  string device = 3;
  // before_sha256 and after_sha256 are the hashes of the PNGs in object
  // storage; before is empty for a new screen.
  string before_sha256 = 4;
  string after_sha256 = 5;
  bool changed = 6;
}

message CreateReleaseRequestRequest {
  string app_id = 1;
  string environment_id = 2;
  // channel defaults to production.
  string channel = 3;
  repeated SelectedPlugin plugins = 4;
}
message CreateReleaseRequestResponse {
  ReleaseRequest request = 1;
  // existing is true when the request was already open.
  bool existing = 2;
}

message GetReleaseRequestRequest {
  string app_id = 1;
  string id = 2;
}
message GetReleaseRequestResponse {
  ReleaseRequest request = 1;
  // visual_diff is the newest job for the request's current content.
  VisualDiffJob visual_diff = 2;
}

message ListReleaseRequestsRequest {
  string app_id = 1;
  bool open_only = 2;
  Page page = 3;
}
message ListReleaseRequestsResponse {
  repeated ReleaseRequest requests = 1;
  PageResult page = 2;
}

// AdvanceReleaseRequestRequest completes the step expected_state names. The
// payload is that step's: selection at select, builds at build, reports at
// reports, none at diffs, changelog at changelog, target at target and
// rollout at rollout.
message AdvanceReleaseRequestRequest {
  string app_id = 1;
  string id = 2;
  string expected_state = 3;
  oneof step {
    SelectionStep selection = 4;
    BuildsStep builds = 5;
    ReportsStep reports = 6;
    ChangelogStep changelog = 7;
    TargetStep target = 8;
    RolloutStep rollout = 9;
  }
}
message SelectionStep {
  repeated SelectedPlugin plugins = 1;
}
message BuildsStep {
  // builds are the publish jobs, one per selected plugin; the server reads
  // their state, versions and diagnostics itself.
  repeated BuildJobRef builds = 1;
}
message BuildJobRef {
  string plugin_key = 1;
  string job_id = 2;
}
message ReportsStep {
  // acknowledged_warnings are the warnings the user acknowledged; every
  // warning of the builds needs one (SRV-051).
  repeated string acknowledged_warnings = 1;
}
message ChangelogStep {
  string notes = 1;
  string label = 2;
}
message TargetStep {
  string environment_id = 1;
  string channel = 2;
}
message RolloutStep {
  // plan is the rollout plan as a JSON object.
  bytes plan = 1;
}
message AdvanceReleaseRequestResponse {
  ReleaseRequest request = 1;
}

message RefreezeReleaseRequestRequest {
  string app_id = 1;
  string id = 2;
}
message RefreezeReleaseRequestResponse {
  ReleaseRequest request = 1;
}

message RequestVisualDiffRequest {
  string app_id = 1;
  string id = 2;
}
message RequestVisualDiffResponse {
  VisualDiffJob job = 1;
}

message RequestReleaseApprovalRequest {
  string app_id = 1;
  string id = 2;
}
message RequestReleaseApprovalResponse {
  ReleaseRequest request = 1;
}

message CompleteReleaseRequestRequest {
  string app_id = 1;
  string id = 2;
}
message CompleteReleaseRequestResponse {
  ReleaseRequest request = 1;
}

message CancelReleaseRequestRequest {
  string app_id = 1;
  string id = 2;
}
message CancelReleaseRequestResponse {
  ReleaseRequest request = 1;
}
