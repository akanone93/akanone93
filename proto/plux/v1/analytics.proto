syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// AnalyticsService queries the rollups of runtime events, manages how long
// events, rollups and the production audit log are kept, and configures the
// OTLP export (ANL-010, ANL-011, ADR-0080, maintainer decision Q17).
service AnalyticsService {
  // QueryRollups reads one event name's rollups of an app over a time range,
  // optionally grouped by dimensions. A result cut off by the limit carries a
  // page token. It needs analytics.read.
  rpc QueryRollups(QueryRollupsRequest) returns (QueryRollupsResponse) {}
  // GetRetention returns the effective retention of every data class and
  // the changes waiting for the maintenance window. It needs analytics.read.
  rpc GetRetention(GetRetentionRequest) returns (GetRetentionResponse) {}
  // SetRetention changes the retention of a data class. The change waits
  // for the maintenance window and the response carries PLX-8301, unless
  // immediate is set. It needs retention.manage and is audited.
  rpc SetRetention(SetRetentionRequest) returns (SetRetentionResponse) {}
  // ListRetentionChanges lists scheduled and finished changes, newest first.
  // It needs analytics.read.
  rpc ListRetentionChanges(ListRetentionChangesRequest) returns (ListRetentionChangesResponse) {}
  // CancelRetentionChange withdraws a scheduled change. It needs
  // retention.manage and is audited.
  rpc CancelRetentionChange(CancelRetentionChangeRequest) returns (CancelRetentionChangeResponse) {}
  // GetExport returns the OTLP destination. It needs analytics.read.
  rpc GetExport(GetExportRequest) returns (GetExportResponse) {}
  // SetExport sets the OTLP destination after sending it an empty request;
  // an unreachable destination is PLX-8302. It needs organization.manage and
  // is audited.
  rpc SetExport(SetExportRequest) returns (SetExportResponse) {}
  // DeleteExport removes the OTLP destination. It needs organization.manage
  // and is audited.
  rpc DeleteExport(DeleteExportRequest) returns (DeleteExportResponse) {}
  // GetFileExport returns the settings of the Parquet and webhook exports
  // (ANL-011) and how far they have come. It needs analytics.read.
  rpc GetFileExport(GetFileExportRequest) returns (GetFileExportResponse) {}
  // SetFileExport sets the Parquet and webhook exports. An export the
  // licence does not allow is PLX-8600. It needs organization.manage and is
  // audited.
  rpc SetFileExport(SetFileExportRequest) returns (SetFileExportResponse) {}
  // CreateAlertRule defines an alert on a rollup metric (ANL-030). It needs
  // alerts.manage on the app and is audited.
  rpc CreateAlertRule(CreateAlertRuleRequest) returns (CreateAlertRuleResponse) {}
  // UpdateAlertRule replaces a rule's definition and resets its state. It
  // needs alerts.manage on the app and is audited.
  rpc UpdateAlertRule(UpdateAlertRuleRequest) returns (UpdateAlertRuleResponse) {}
  // DeleteAlertRule removes a rule and its state. It needs alerts.manage on
  // the app and is audited.
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse) {}
  // ListAlertRules lists the rules of an app, or of the organisation. It
  // needs analytics.read.
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse) {}
  // ListAlertStates lists the current state of rules: ok, pending, firing or
  // resolved. It needs analytics.read.
  rpc ListAlertStates(ListAlertStatesRequest) returns (ListAlertStatesResponse) {}
  // ListErrorGroups lists the error groups of an app, newest activity first,
  // with their trend by day (ANL-040). It needs analytics.read.
  rpc ListErrorGroups(ListErrorGroupsRequest) returns (ListErrorGroupsResponse) {}
  // GetErrorGroup returns one group with its newest sample events. The first
  // read symbolicates it through the release's retained source map
  // (CMP-041). It needs analytics.read.
  rpc GetErrorGroup(GetErrorGroupRequest) returns (GetErrorGroupResponse) {}
  // CreateFunnel defines a funnel of an app: an ordered list of event names
  // (ANL-020, STU-114). It needs alerts.manage on the app and is audited.
  rpc CreateFunnel(CreateFunnelRequest) returns (CreateFunnelResponse) {}
  // DeleteFunnel removes a funnel. It needs alerts.manage on the app and is
  // audited.
  rpc DeleteFunnel(DeleteFunnelRequest) returns (DeleteFunnelResponse) {}
  // ListFunnels lists the funnels of an app, or of the organisation. It
  // needs analytics.read.
  rpc ListFunnels(ListFunnelsRequest) returns (ListFunnelsResponse) {}
  // GetFunnelResult counts the events of each step of a funnel over a time
  // range, from the rollups. It needs analytics.read on the app.
  rpc GetFunnelResult(GetFunnelResultRequest) returns (GetFunnelResultResponse) {}
  // GetOverview summarises every app the caller may read analytics of over a
  // time range: sessions, screen views, errors and firing alerts. It needs
  // analytics.read.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {}
}

// RollupGroup is the dimension values of a point; a dimension not grouped by
// is empty.
message RollupGroup {
  string environment_id = 1;
  int64 release_sequence = 2;
  string plugin_key = 3;
  string page = 4;
  string device_class = 5;
  string locale = 6;
}

// RollupPoint is one bucket of one series. Durations are milliseconds; the
// percentiles are estimated from a fixed-bucket histogram.
message RollupPoint {
  google.protobuf.Timestamp bucket = 1;
  RollupGroup group = 2;
  int64 events = 3;
  int64 value_count = 4;
  double sum = 5;
  double min = 6;
  double max = 7;
  double p50 = 8;
  double p90 = 9;
  double p99 = 10;
}

message QueryRollupsRequest {
  string app_id = 1;
  // environment restricts the query to one environment key; empty for all.
  string environment = 2;
  // metric is the event name, such as render_perf.
  string metric = 3;
  // granularity is 5m, 1h or 1d.
  string granularity = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  // group_by names dimensions to keep apart: environment, release, plugin,
  // page, device_class, locale.
  repeated string group_by = 7;
  // limit is the most points to return, up to api.pageSize.
  int32 limit = 8;
  // page_token continues a result cut off by the limit: the
  // next_page_token of the previous response, with the same other fields.
  string page_token = 9;
}
message QueryRollupsResponse {
  repeated RollupPoint points = 1;
  // next_page_token is set when the limit was reached; it is empty on the
  // last page.
  string next_page_token = 2;
}

// RetentionSetting is the retention of one data class: raw_events, rollups
// or audit_production.
message RetentionSetting {
  string data_class = 1;
  // days is 0 for indefinitely.
  int32 days = 2;
  // is_default says the installation default applies.
  bool is_default = 3;
  // enforced is false where nothing deletes yet (audit_production).
  bool enforced = 4;
  string changed_by = 5;
  google.protobuf.Timestamp changed_at = 6;
}

// RetentionChange is a retention change that was scheduled or made.
message RetentionChange {
  string id = 1;
  string data_class = 2;
  // days is 0 for indefinitely.
  int32 days = 3;
  // state is scheduled, applied or cancelled.
  string state = 4;
  string requested_by = 5;
  google.protobuf.Timestamp requested_at = 6;
  google.protobuf.Timestamp apply_at = 7;
  google.protobuf.Timestamp finished_at = 8;
}

message GetRetentionRequest {}
message GetRetentionResponse {
  repeated RetentionSetting settings = 1;
  repeated RetentionChange scheduled = 2;
}

message SetRetentionRequest {
  string data_class = 1;
  // days is 1 to 36500, or 0 for indefinitely.
  int32 days = 2;
  // immediate applies the change now instead of in the maintenance window.
  bool immediate = 3;
}
message SetRetentionResponse {
  RetentionChange change = 1;
  // diagnostics carries PLX-8301 for a scheduled change.
  repeated Diagnostic diagnostics = 2;
}

message ListRetentionChangesRequest {
  bool only_scheduled = 1;
  int32 limit = 2;
}
message ListRetentionChangesResponse {
  repeated RetentionChange changes = 1;
}

message CancelRetentionChangeRequest {
  string id = 1;
}
message CancelRetentionChangeResponse {
  RetentionChange change = 1;
}

// Export is the OTLP destination of an organisation.
message Export {
  // endpoint is the OTLP/HTTP metrics URL.
  string endpoint = 1;
  bool enabled = 2;
  // exported_until is the end of the last bucket sent.
  google.protobuf.Timestamp exported_until = 3;
  // last_error says why the last attempt failed; empty when it did not.
  string last_error = 4;
  google.protobuf.Timestamp last_attempt_at = 5;
}

message GetExportRequest {}
message GetExportResponse {
  Export export = 1;
}

message SetExportRequest {
  // endpoint is the collector's base URL or its /v1/metrics URL, https only.
  string endpoint = 1;
  bool enabled = 2;
}
message SetExportResponse {
  Export export = 1;
}

message DeleteExportRequest {}
message DeleteExportResponse {}

// FileExportSettings is what an organisation exports as files and messages
// (ANL-011).
message FileExportSettings {
  bool parquet_enabled = 1;
  // parquet_events and parquet_rollups choose the kinds of Parquet file.
  bool parquet_events = 2;
  bool parquet_rollups = 3;
  // parquet_granularity is the width of the exported rollups: 5m, 1h or 1d.
  string parquet_granularity = 4;
  bool webhook_enabled = 5;
  // webhook_url is the https address of the receiver.
  string webhook_url = 6;
}

// FileExport is the settings of the Parquet and webhook exports and the
// progress of their delivery.
message FileExport {
  FileExportSettings settings = 1;
  // secret_hint is the end of the webhook signing secret, which is never
  // returned; empty when none is stored.
  string secret_hint = 2;
  // exported_until is the end of the last hour delivered.
  google.protobuf.Timestamp exported_until = 3;
  // last_error says why the last attempt failed; empty when it did not.
  string last_error = 4;
  google.protobuf.Timestamp last_attempt_at = 5;
}

message GetFileExportRequest {}
message GetFileExportResponse {
  FileExport export = 1;
}

message SetFileExportRequest {
  FileExportSettings settings = 1;
  // webhook_secret is the Standard Webhooks signing secret, "whsec_" and
  // base64; empty keeps the stored one.
  string webhook_secret = 2;
}
message SetFileExportResponse {
  FileExport export = 1;
}

// AlertRule is a condition on a rollup metric (ANL-030). The aggregation of
// the metric over the window is compared with the threshold; the rule fires
// when the comparison has held for for_seconds.
message AlertRule {
  string id = 1;
  string app_id = 2;
  string name = 3;
  // metric is an event name, such as render_perf or fatal_error.
  string metric = 4;
  // environment is an environment key; empty for all.
  string environment = 5;
  // filters maps a rollup dimension (release, plugin, page, device_class,
  // locale) to the value a series must have.
  map<string, string> filters = 6;
  // aggregation is count, sum, avg, min, max, p50, p90 or p99.
  string aggregation = 7;
  int32 window_seconds = 8;
  // comparison is >, >=, < or <=.
  string comparison = 9;
  double threshold = 10;
  int32 for_seconds = 11;
  // severity is info, warning or critical.
  string severity = 12;
  // disabled stops the rule being evaluated; its state is kept.
  bool disabled = 13;
  int64 revision = 14;
  string updated_by = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// AlertState is where a rule stands.
message AlertState {
  string rule_id = 1;
  string app_id = 2;
  string rule_name = 3;
  // state is ok, pending, firing or resolved.
  string state = 4;
  // since is when the state began.
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  // value is the aggregation at the last evaluation; unset without data.
  optional double value = 7;
  google.protobuf.Timestamp fired_at = 8;
  google.protobuf.Timestamp resolved_at = 9;
}

message CreateAlertRuleRequest {
  // rule is the definition; id, revision and updated_* are ignored.
  AlertRule rule = 1;
}
message CreateAlertRuleResponse {
  AlertRule rule = 1;
}

message UpdateAlertRuleRequest {
  // rule names the rule by id and carries its new definition.
  AlertRule rule = 1;
}
message UpdateAlertRuleResponse {
  AlertRule rule = 1;
}

message DeleteAlertRuleRequest {
  string id = 1;
}
message DeleteAlertRuleResponse {}

message ListAlertRulesRequest {
  // app_id narrows the list to one app; empty for the organisation.
  string app_id = 1;
}
message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
}

message ListAlertStatesRequest {
  string app_id = 1;
  // state keeps one state; empty for all.
  string state = 2;
}
message ListAlertStatesResponse {
  repeated AlertState states = 1;
}

// ErrorDay is the events of a group on one UTC day.
message ErrorDay {
  // day is YYYY-MM-DD.
  string day = 1;
  int64 events = 2;
}

// ErrorGroup is the errors with one fingerprint in one release of an app
// (ANL-040).
message ErrorGroup {
  string id = 1;
  string app_id = 2;
  int64 release_sequence = 3;
  string fingerprint = 4;
  // code is the error code, such as PLX-4101.
  string code = 5;
  string plugin_key = 6;
  string route = 7;
  // node_path is where the runtime reported the error; Studio opens the
  // node by it (P11).
  string node_path = 8;
  // json_path and source_file are the document location the retained source
  // map gives for the node; empty when it cannot be resolved.
  string json_path = 9;
  string source_file = 10;
  // frames are the normalised top frames the fingerprint covers.
  repeated string frames = 11;
  bool fatal = 12;
  google.protobuf.Timestamp first_seen = 13;
  google.protobuf.Timestamp last_seen = 14;
  int64 events = 15;
  int64 devices = 16;
  // trend is the events per UTC day over the window asked for.
  repeated ErrorDay trend = 17;
}

// ErrorSample is one event of a group.
message ErrorSample {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  // fields are the event's flat scalar fields as a JSON object.
  string fields_json = 3;
}

message ListErrorGroupsRequest {
  string app_id = 1;
  // release_sequence keeps one release; 0 for all.
  int64 release_sequence = 2;
  // days is how far back groups were last seen and how long the trend is;
  // 0 is the default of fourteen days.
  int32 days = 3;
  int32 limit = 4;
}
message ListErrorGroupsResponse {
  repeated ErrorGroup groups = 1;
}

message GetErrorGroupRequest {
  string id = 1;
  int32 days = 2;
}
message GetErrorGroupResponse {
  ErrorGroup group = 1;
  repeated ErrorSample samples = 2;
}

// Funnel is an ordered list of event names of an app.
message Funnel {
  string id = 1;
  string app_id = 2;
  string name = 3;
  // steps are event names, two to ten, in order.
  repeated string steps = 4;
  // environment narrows the funnel to one environment key; empty for all.
  string environment = 5;
  int64 revision = 6;
  string updated_by = 7;
  google.protobuf.Timestamp updated_at = 8;
}
message CreateFunnelRequest {
  Funnel funnel = 1;
}
message CreateFunnelResponse {
  Funnel funnel = 1;
}
message DeleteFunnelRequest {
  string id = 1;
}
message DeleteFunnelResponse {}
message ListFunnelsRequest {
  // app_id narrows the list to one app; empty for the organisation.
  string app_id = 1;
}
message ListFunnelsResponse {
  repeated Funnel funnels = 1;
}

// FunnelStep is one step of a funnel result.
message FunnelStep {
  string event = 1;
  int64 events = 2;
  // conversion is the share of the first step's events, 0 to 1.
  double conversion = 3;
}
message GetFunnelResultRequest {
  string id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}
message GetFunnelResultResponse {
  Funnel funnel = 1;
  repeated FunnelStep steps = 2;
}

// OverviewApp is the headline numbers of one app.
message OverviewApp {
  string app_id = 1;
  int64 sessions = 2;
  int64 screen_views = 3;
  int64 errors = 4;
  int32 firing_alerts = 5;
}
message GetOverviewRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
}
message GetOverviewResponse {
  repeated OverviewApp apps = 1;
}
