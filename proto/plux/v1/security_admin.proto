syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// SecurityAdminService is the administrators' side of device security: an
// environment's security configuration, the upstreams its gateway
// reaches, and the signed audit checkpoints. Devices never call it.
service SecurityAdminService {
  // SetSecurityConfig sets an environment's profile and overrides. It
  // fails when expected_version is not the current version, so two
  // administrators cannot overwrite each other (SEC-180).
  rpc SetSecurityConfig(SetSecurityConfigRequest) returns (SetSecurityConfigResponse) {}
  // GetEffectiveSecurityConfig returns the profile merged with the
  // overrides, which is what the manifest pins (SEC-182).
  rpc GetEffectiveSecurityConfig(GetEffectiveSecurityConfigRequest) returns (GetEffectiveSecurityConfigResponse) {}

  rpc CreateUpstream(CreateUpstreamRequest) returns (CreateUpstreamResponse) {}
  rpc GetUpstream(GetUpstreamRequest) returns (GetUpstreamResponse) {}
  rpc ListUpstreams(ListUpstreamsRequest) returns (ListUpstreamsResponse) {}
  rpc UpdateUpstream(UpdateUpstreamRequest) returns (UpdateUpstreamResponse) {}
  rpc DeleteUpstream(DeleteUpstreamRequest) returns (DeleteUpstreamResponse) {}

  // SetUserIdentityProvider sets the customer identity provider whose user
  // tokens an environment's devices may exchange (SEC-026).
  rpc SetUserIdentityProvider(SetUserIdentityProviderRequest) returns (SetUserIdentityProviderResponse) {}
  rpc GetUserIdentityProvider(GetUserIdentityProviderRequest) returns (GetUserIdentityProviderResponse) {}
  rpc DeleteUserIdentityProvider(DeleteUserIdentityProviderRequest) returns (DeleteUserIdentityProviderResponse) {}

  // ListAuditCheckpoints lists the signed checkpoints over the audit
  // log's hash chain, which let anyone verify that no entry was removed
  // (SEC-141).
  rpc ListAuditCheckpoints(ListAuditCheckpointsRequest) returns (ListAuditCheckpointsResponse) {}

  // SetConfigValue creates or changes a server-held configuration value
  // of an environment (DAT-090). It fails when expected_version is not
  // the value's current version.
  rpc SetConfigValue(SetConfigValueRequest) returns (SetConfigValueResponse) {}
  // GetConfigValue returns one value; a sensitive value's content is
  // omitted (DAT-090).
  rpc GetConfigValue(GetConfigValueRequest) returns (GetConfigValueResponse) {}
  rpc ListConfigValues(ListConfigValuesRequest) returns (ListConfigValuesResponse) {}
  rpc DeleteConfigValue(DeleteConfigValueRequest) returns (DeleteConfigValueResponse) {}
}

message SetSecurityConfigRequest {
  string app_id = 1;
  string environment_id = 2;
  // profile names the security profile, such as "maximum" (SEC-180).
  string profile = 3;
  // overrides_json is a JSON object of settings that differ from the
  // profile (SEC-181).
  bytes overrides_json = 4;
  // expected_version is the version the caller read; zero for an
  // environment with no configuration yet.
  int64 expected_version = 5;
}
message SetSecurityConfigResponse {
  // version is the new configuration version.
  int64 version = 1;
}

message GetEffectiveSecurityConfigRequest {
  string app_id = 1;
  string environment_id = 2;
}
message GetEffectiveSecurityConfigResponse {
  string profile = 1;
  int64 version = 2;
  // effective_json is the canonical JSON of the merged configuration.
  bytes effective_json = 3;
  // sha256 is the hash of effective_json, the value the manifest pins
  // (SEC-182).
  bytes sha256 = 4;
}

// Upstream is an API the gateway may reach for an environment's devices
// (SEC-030).
message Upstream {
  string id = 1;
  string app_id = 2;
  string environment_id = 3;
  // name is what GatewayCallRequest.upstream refers to.
  string name = 4;
  // base_url is the upstream's base URL.
  string base_url = 5;
  // auth is how the server authenticates to the upstream. Secrets are
  // referenced, never carried (SEC-092).
  oneof auth {
    UpstreamMtls mtls = 6;
    UpstreamOAuthClientCredentials oauth_client_credentials = 7;
    UpstreamApiKey api_key = 8;
  }
  // allow_private_addresses lets the upstream resolve to a private or
  // loopback address. It is off by default, because the gateway would
  // otherwise reach the server's own network (SEC-105).
  bool allow_private_addresses = 9;
  // timeout_ms bounds one call to the upstream; zero uses the registry's
  // default (LIM-001).
  int32 timeout_ms = 10;
  // allowed_methods are the HTTP methods the gateway forwards to the
  // upstream; at least one is required (SEC-031).
  repeated string allowed_methods = 11;
  // requires_assurance is the lowest assurance level ("AL0" to "AL3") any
  // call to the upstream needs; empty means "AL0". An operation may ask
  // for more, never less (SEC-007).
  string requires_assurance = 12;
  // operations are the named operations devices may call. When the list
  // is not empty a call must name one of them; each narrows the upstream's
  // methods and paths and carries the policy the gateway enforces for it
  // (SEC-028, SEC-030).
  repeated UpstreamOperation operations = 13;
  // audience is the `aud` of the Plux assertion sent to the upstream;
  // empty means base_url (SEC-031).
  string audience = 14;
}

// UpstreamOperation is one operation of an upstream and the policy the
// gateway enforces before it forwards a call to it.
message UpstreamOperation {
  // name is what CallRequest.operation names.
  string name = 1;
  // methods narrow the upstream's allowed methods; empty means all of
  // them.
  repeated string methods = 2;
  // path_prefix is the path every call must start with, in segments;
  // empty means any path under the base URL.
  string path_prefix = 3;
  // requires_assurance is the lowest assurance level this operation
  // needs; empty means the upstream's (SEC-007).
  string requires_assurance = 4;
  // transaction, when set, makes the operation a transaction that needs
  // strong customer authentication: the gateway refuses a call without a
  // valid signature over the fields it names (SEC-028, SEC-032).
  UpstreamTransaction transaction = 5;
  // plugins limits the operation to the plugins that declare the
  // capability to call it (SEC-080); empty means any plugin of the app.
  repeated string plugins = 6;
  // bindings put server-held configuration values into the request the
  // gateway forwards, at locations only this definition names (DAT-091).
  repeated ConfigBinding bindings = 7;
}

// ConfigBinding binds one server-held configuration value into the
// outgoing request of an operation (DAT-091). The device never sends,
// chooses or sees a bound value, and a request that sets the bound
// location is refused.
message ConfigBinding {
  // key is the configuration value; its tier must be server-bound.
  string key = 1;
  // location is where the gateway puts the value.
  oneof location {
    // json_pointer (RFC 6901) addresses a member of a JSON request body.
    string json_pointer = 2;
    // header is the name of a request header.
    string header = 3;
    // path_param names a path segment the gateway inserts directly after
    // the operation's path prefix, in the order of the bindings.
    string path_param = 4;
    // query_param is the name of a query parameter.
    string query_param = 5;
  }
  // display marks a value of a transaction the user must see before they
  // confirm it: the gateway resolves it when the challenge is created,
  // returns it for the confirmation sheet and binds it into the signed
  // summary (DAT-093). It needs a json_pointer location that the
  // operation's transaction maps.
  bool display = 6;
  // label is what the confirmation sheet calls a displayed value; empty
  // means key.
  string label = 7;
}

// UpstreamTransaction maps the fields that dynamic linking signs to
// positions in the request body, which must be JSON (SEC-028). Each is a
// JSON Pointer (RFC 6901).
message UpstreamTransaction {
  string amount = 1;
  string currency = 2;
  string payee = 3;
  // summary is optional: a human-readable summary the user also confirmed.
  string summary = 4;
}

// UpstreamMtls authenticates with a client certificate.
message UpstreamMtls {
  // client_cert_secret_ref names the secret that holds the certificate
  // and key.
  string client_cert_secret_ref = 1;
}

// UpstreamOAuthClientCredentials authenticates with the OAuth 2.0 client
// credentials grant (RFC 6749 §4.4).
message UpstreamOAuthClientCredentials {
  string token_url = 1;
  string client_id = 2;
  // client_secret_ref names the secret that holds the client secret.
  string client_secret_ref = 3;
  repeated string scopes = 4;
}

// UpstreamApiKey authenticates with a static key in a header.
message UpstreamApiKey {
  // header is the header that carries the key.
  string header = 1;
  // secret_ref names the secret that holds the key.
  string secret_ref = 2;
}

message CreateUpstreamRequest {
  // upstream is the new upstream; its id is assigned by the server.
  Upstream upstream = 1;
}
message CreateUpstreamResponse {
  Upstream upstream = 1;
}

message GetUpstreamRequest {
  string id = 1;
}
message GetUpstreamResponse {
  Upstream upstream = 1;
}

message ListUpstreamsRequest {
  string app_id = 1;
  string environment_id = 2;
  Page page = 3;
}
message ListUpstreamsResponse {
  repeated Upstream upstreams = 1;
  PageResult page = 2;
}

message UpdateUpstreamRequest {
  // upstream replaces the stored upstream with the same id.
  Upstream upstream = 1;
}
message UpdateUpstreamResponse {
  Upstream upstream = 1;
}

message DeleteUpstreamRequest {
  string id = 1;
}
message DeleteUpstreamResponse {}

// UserIdentityProvider is the customer identity provider an environment's
// user tokens come from (SEC-026).
message UserIdentityProvider {
  string app_id = 1;
  string environment_id = 2;
  // issuer is the `iss` the provider's tokens carry.
  string issuer = 3;
  // jwks_url is where the provider publishes its signing keys. It is
  // fetched through the SSRF-safe client and must be HTTPS.
  string jwks_url = 4;
  // audiences are the `aud` values accepted; a token must carry one.
  repeated string audiences = 5;
  // forward_claims are the claims of the user token the gateway passes to
  // upstreams in the Plux assertion; `sub` always is.
  repeated string forward_claims = 6;
}

message SetUserIdentityProviderRequest {
  UserIdentityProvider provider = 1;
}
message SetUserIdentityProviderResponse {}

message GetUserIdentityProviderRequest {
  string app_id = 1;
  string environment_id = 2;
}
message GetUserIdentityProviderResponse {
  UserIdentityProvider provider = 1;
}

message DeleteUserIdentityProviderRequest {
  string app_id = 1;
  string environment_id = 2;
}
message DeleteUserIdentityProviderResponse {}

// AuditCheckpoint is a signed point in the audit log's hash chain
// (SEC-141).
message AuditCheckpoint {
  // sequence is the sequence number of the last entry the checkpoint
  // covers.
  int64 sequence = 1;
  // entry_hash is the chain hash at that entry.
  bytes entry_hash = 2;
  // signature signs sequence and entry_hash.
  bytes signature = 3;
  // key_id identifies the audit signing key.
  string key_id = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListAuditCheckpointsRequest {
  Page page = 1;
}
message ListAuditCheckpointsResponse {
  repeated AuditCheckpoint checkpoints = 1;
  PageResult page = 2;
}

// ConfigTier says how a configuration value reaches the code that uses it
// (DAT-090).
enum ConfigTier {
  CONFIG_TIER_UNSPECIFIED = 0;
  // CONFIG_TIER_SERVER_BOUND values are resolved by the gateway for every
  // request and bound where an operation declares; devices never see
  // them (DAT-091).
  CONFIG_TIER_SERVER_BOUND = 1;
  // CONFIG_TIER_LIVE values are fetched by the device over its DPoP-bound
  // channel and held in memory only (DAT-094).
  CONFIG_TIER_LIVE = 2;
}

// ConfigType is the type of a configuration value, which is carried as
// text.
enum ConfigType {
  CONFIG_TYPE_UNSPECIFIED = 0;
  CONFIG_TYPE_STRING = 1;
  // CONFIG_TYPE_INTEGER is a base-10 integer that fits 64 bits.
  CONFIG_TYPE_INTEGER = 2;
  // CONFIG_TYPE_DECIMAL is an exact decimal number, carried as a string
  // and bound as one.
  CONFIG_TYPE_DECIMAL = 3;
  // CONFIG_TYPE_BOOLEAN is "true" or "false".
  CONFIG_TYPE_BOOLEAN = 4;
}

// ConfigValue is one server-held configuration value of an environment
// (DAT-090).
message ConfigValue {
  // key names the value: a letter followed by letters, digits and
  // underscores.
  string key = 1;
  ConfigTier tier = 2;
  // sensitive values are sealed at rest and never returned (SEC-106);
  // only server-bound values may be sensitive.
  bool sensitive = 3;
  // strict marks a live value whose change refuses a gateway call made
  // with an older live-configuration version (DAT-096, DAT-097).
  bool strict = 4;
  ConfigType type = 5;
  // value is the text form of the value; it is omitted when the value is
  // sensitive and the message is a response.
  string value = 6;
  // version rises with every change of the value.
  int64 version = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message SetConfigValueRequest {
  string app_id = 1;
  string environment_id = 2;
  // value is the value to store; version and updated_at are ignored.
  ConfigValue value = 3;
  // expected_version is the version the caller read; zero for a key that
  // does not exist yet. Omit it to set without the check.
  optional int64 expected_version = 4;
}
message SetConfigValueResponse {
  // value is the stored value, without its content when it is sensitive.
  ConfigValue value = 1;
}

message GetConfigValueRequest {
  string app_id = 1;
  string environment_id = 2;
  string key = 3;
}
message GetConfigValueResponse {
  ConfigValue value = 1;
}

message ListConfigValuesRequest {
  string app_id = 1;
  string environment_id = 2;
  Page page = 3;
}
message ListConfigValuesResponse {
  repeated ConfigValue values = 1;
  PageResult page = 2;
  // epoch is the environment's configuration epoch, which rises with
  // every change (DAT-095).
  int64 epoch = 3;
}

message DeleteConfigValueRequest {
  string app_id = 1;
  string environment_id = 2;
  string key = 3;
}
message DeleteConfigValueResponse {}
