syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// FlagService administers the feature flags of an environment (ABT-006): a
// flag's type, default and per-segment values, which reach devices through the
// control document of every channel of the environment without a release.
// Writes need flags.manage on the environment; reads need app.read.
service FlagService {
  // CreateFlag makes a flag. PLX-1701 for an unknown type, PLX-1702-style
  // value errors as PLX-1003 or PLX-1008, PLX-1102 for an unknown segment,
  // PLX-1101 when the key exists and PLX-1320 past flags.perApp.
  rpc CreateFlag(CreateFlagRequest) returns (CreateFlagResponse) {}
  // UpdateFlag replaces a flag's description, schema, default and segment
  // values. Changing the type is refused with PLX-8203.
  rpc UpdateFlag(UpdateFlagRequest) returns (UpdateFlagResponse) {}
  // DeleteFlag removes a flag; devices fall back to the default compiled into
  // the app.
  rpc DeleteFlag(DeleteFlagRequest) returns (DeleteFlagResponse) {}
  // GetFlag returns one flag.
  rpc GetFlag(GetFlagRequest) returns (GetFlagResponse) {}
  // ListFlags lists an environment's flags by key.
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse) {}
}

// ExperimentService administers and analyses experiments (ABT-001, ABT-003,
// ABT-004, ABT-005). Changes need experiments.manage on the app, results need
// analytics.read and the rest app.read.
service ExperimentService {
  // CreateExperiment registers a draft from an experiment document.
  rpc CreateExperiment(CreateExperimentRequest) returns (CreateExperimentResponse) {}
  // GetExperiment returns one experiment.
  rpc GetExperiment(GetExperimentRequest) returns (GetExperimentResponse) {}
  // ListExperiments lists an app's experiments.
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsResponse) {}
  // DeleteExperiment discards a draft.
  rpc DeleteExperiment(DeleteExperimentRequest) returns (DeleteExperimentResponse) {}
  // StartExperiment writes the allocation into the environment's control
  // documents. PLX-8200 when its layer has no free range, PLX-1320 past
  // experiments.activePerApp, PLX-8001 when approval is required.
  rpc StartExperiment(StartExperimentRequest) returns (StartExperimentResponse) {}
  // StopExperiment takes a running experiment out of the control documents.
  rpc StopExperiment(StopExperimentRequest) returns (StopExperimentResponse) {}
  // SetHoldout sets the share of subjects kept out of every experiment of an
  // environment; zero removes it.
  rpc SetHoldout(SetHoldoutRequest) returns (SetHoldoutResponse) {}
  // GetHoldout returns the environment's holdout.
  rpc GetHoldout(GetHoldoutRequest) returns (GetHoldoutResponse) {}
  // GetResults analyses an experiment with sequential inference valid at any
  // time. PLX-8201 until every variant has the minimum sample size; a sample
  // ratio mismatch (PLX-8202) is reported in the result.
  rpc GetResults(GetResultsRequest) returns (GetResultsResponse) {}
  // PromoteExperiment makes a variant the app: the project is rewritten with
  // the winner as the default and a publish job makes the release.
  rpc PromoteExperiment(PromoteExperimentRequest) returns (PromoteExperimentResponse) {}
}

// FlagType is the type of a flag.
enum FlagType {
  FLAG_TYPE_UNSPECIFIED = 0;
  FLAG_TYPE_BOOL = 1;
  FLAG_TYPE_NUMBER = 2;
  FLAG_TYPE_STRING = 3;
  FLAG_TYPE_JSON = 4;
}

// FlagSegmentValue is a flag's value for the devices of one segment. Values
// are JSON text.
message FlagSegmentValue {
  string segment = 1;
  string value_json = 2;
}

// FlagSpec is the content of a flag; all of it replaces the flag's content.
message FlagSpec {
  // type may be left unspecified on an update, but not changed.
  FlagType type = 1;
  string description = 2;
  // schema_json is the JSON Schema of a json flag's values; empty on an
  // update keeps the current one.
  string schema_json = 3;
  string default_json = 4;
  // segments are in precedence order: the first a device belongs to wins.
  repeated FlagSegmentValue segments = 5;
}

message Flag {
  string id = 1;
  string app_id = 2;
  string environment_id = 3;
  string key = 4;
  FlagType type = 5;
  string description = 6;
  string schema_json = 7;
  // default_json is canonical JSON.
  string default_json = 8;
  repeated FlagSegmentValue segments = 9;
  Actor created_by = 10;
  Actor updated_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateFlagRequest {
  string app_id = 1;
  string environment_id = 2;
  string key = 3;
  FlagSpec spec = 4;
}
message UpdateFlagRequest {
  string app_id = 1;
  string environment_id = 2;
  string key = 3;
  FlagSpec spec = 4;
}
message CreateFlagResponse {
  Flag flag = 1;
}
message UpdateFlagResponse {
  Flag flag = 1;
}
message GetFlagResponse {
  Flag flag = 1;
}
message DeleteFlagRequest {
  string app_id = 1;
  string environment_id = 2;
  string key = 3;
}
message DeleteFlagResponse {}
message GetFlagRequest {
  string app_id = 1;
  string environment_id = 2;
  string key = 3;
}
message ListFlagsRequest {
  string app_id = 1;
  string environment_id = 2;
}
message ListFlagsResponse {
  repeated Flag flags = 1;
}

// ExperimentState is where an experiment is in its life.
enum ExperimentState {
  EXPERIMENT_STATE_UNSPECIFIED = 0;
  EXPERIMENT_STATE_DRAFT = 1;
  EXPERIMENT_STATE_RUNNING = 2;
  EXPERIMENT_STATE_STOPPED = 3;
  EXPERIMENT_STATE_CONCLUDED = 4;
}

message Experiment {
  string id = 1;
  string app_id = 2;
  string environment_id = 3;
  string key = 4;
  ExperimentState state = 5;
  // definition_json is the experiment document it was made from.
  string definition_json = 6;
  string salt = 7;
  // layer_share_percent is the share of its layer it asked for when it
  // started; layer_start and layer_end are the buckets (of 10000) it holds
  // while it runs.
  double layer_share_percent = 8;
  uint32 layer_start = 9;
  uint32 layer_end = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp stopped_at = 12;
  string winner = 13;
  string promote_job_id = 14;
  Actor created_by = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message CreateExperimentRequest {
  string app_id = 1;
  string environment_id = 2;
  // document is the experiment document (experiments/<key>.experiment.json).
  bytes document = 3;
}
message CreateExperimentResponse {
  Experiment experiment = 1;
}
message GetExperimentResponse {
  Experiment experiment = 1;
}
message StartExperimentResponse {
  Experiment experiment = 1;
}
message StopExperimentResponse {
  Experiment experiment = 1;
}
message GetExperimentRequest {
  string id = 1;
}
message ListExperimentsRequest {
  string app_id = 1;
  // environment_id restricts the list to one environment; empty for all.
  string environment_id = 2;
  // state restricts the list to one state; unspecified for all.
  ExperimentState state = 3;
}
message ListExperimentsResponse {
  repeated Experiment experiments = 1;
}
message DeleteExperimentRequest {
  string id = 1;
}
message DeleteExperimentResponse {}
message StartExperimentRequest {
  string id = 1;
  // layer_share_percent is the share of the experiment's layer to take, above
  // 0 and up to 100; zero takes the whole layer.
  double layer_share_percent = 2;
}
message StopExperimentRequest {
  string id = 1;
}

message SetHoldoutRequest {
  string app_id = 1;
  string environment_id = 2;
  // percent is 0 to 100 with at most two decimals.
  double percent = 3;
}
message GetHoldoutRequest {
  string app_id = 1;
  string environment_id = 2;
}
message SetHoldoutResponse {
  string app_id = 1;
  string environment_id = 2;
  double percent = 3;
}
message GetHoldoutResponse {
  string app_id = 1;
  string environment_id = 2;
  double percent = 3;
}

message GetResultsRequest {
  string id = 1;
}

// VariantCount is the subjects of a variant against the share promised.
message VariantCount {
  string name = 1;
  bool control = 2;
  int64 subjects = 3;
  // share is the fraction of exposed subjects the allocation promises.
  double share = 4;
}

// VariantMean is the mean outcome of a variant.
message VariantMean {
  string variant = 1;
  int64 subjects = 2;
  double mean = 3;
}

// Comparison is a variant against the control. lower and upper bound the true
// difference at every look at once (an always-valid confidence sequence).
message Comparison {
  string variant = 1;
  double diff = 2;
  double lower = 3;
  double upper = 4;
  // p_value is the always-valid p-value of "no difference".
  double p_value = 5;
  double relative_diff = 6;
  bool improved = 7;
  bool worsened = 8;
  bool guardrail_tripped = 9;
  // cuped says the pre-exposure covariate adjusted the estimate;
  // variance_reduction is the share of variance it removed.
  bool cuped = 10;
  double variance_reduction = 11;
}

message MetricResult {
  string event = 1;
  string property = 2;
  string kind = 3;
  string direction = 4;
  repeated VariantMean means = 5;
  repeated Comparison comparisons = 6;
}

message GetResultsResponse {
  string experiment_id = 1;
  string key = 2;
  ExperimentState state = 3;
  google.protobuf.Timestamp at = 4;
  repeated VariantCount variants = 5;
  // sample_ratio_p_value and sample_ratio_mismatch are the chi-squared check
  // of the subjects per variant; a mismatch is PLX-8202 and the comparisons are
  // not to be trusted.
  double sample_ratio_p_value = 6;
  bool sample_ratio_mismatch = 7;
  int32 sample_ratio_code = 8;
  MetricResult primary = 9;
  repeated MetricResult guardrails = 10;
  // primaries are every primary metric, the lead one (primary) first.
  repeated MetricResult primaries = 11;
}

message PromoteExperimentRequest {
  string id = 1;
  string variant = 2;
  // environment_id is the environment the release is made for.
  string environment_id = 3;
  string label = 4;
  string notes = 5;
}
message PromoteExperimentResponse {
  Experiment experiment = 1;
  // publish_job_id is the publish job that makes the release.
  string publish_job_id = 2;
}
