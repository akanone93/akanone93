syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// PluginService manages plugins and their editing locks (SRV-040–SRV-042).
// App-level documents share one lock of their own, addressed by app_id with
// an empty plugin_id.
service PluginService {
  rpc CreatePlugin(CreatePluginRequest) returns (CreatePluginResponse) {}
  rpc GetPlugin(GetPluginRequest) returns (GetPluginResponse) {}
  rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {}
  rpc UpdatePlugin(UpdatePluginRequest) returns (UpdatePluginResponse) {}
  rpc DeletePlugin(DeletePluginRequest) returns (DeletePluginResponse) {}
  // DuplicatePlugin copies a plugin's draft under a new key, with new
  // document IDs (STU-034).
  rpc DuplicatePlugin(DuplicatePluginRequest) returns (DuplicatePluginResponse) {}
  // ArchivePlugin archives or restores a plugin without deleting it.
  rpc ArchivePlugin(ArchivePluginRequest) returns (ArchivePluginResponse) {}
  // ListPluginSummaries returns one bounded summary per plugin of an app,
  // for the app canvas, in a single call (plan P11 §4.3 #14).
  rpc ListPluginSummaries(ListPluginSummariesRequest) returns (ListPluginSummariesResponse) {}

  // AcquireLock takes the editing lock. It fails with PLX-8020 when
  // someone else holds it and force is not set (SRV-040).
  rpc AcquireLock(AcquireLockRequest) returns (AcquireLockResponse) {}
  // RenewLock is the 30-second heartbeat; a lock expires 2 minutes after
  // the last one (SRV-040).
  rpc RenewLock(RenewLockRequest) returns (RenewLockResponse) {}
  rpc ReleaseLock(ReleaseLockRequest) returns (ReleaseLockResponse) {}
  // RequestLock notifies the holder that someone else wants it (SRV-041).
  rpc RequestLock(RequestLockRequest) returns (RequestLockResponse) {}
  rpc GetLock(GetLockRequest) returns (GetLockResponse) {}

  rpc ListPluginLimits(ListPluginLimitsRequest) returns (ListPluginLimitsResponse) {}
  rpc SetPluginLimit(SetPluginLimitRequest) returns (SetPluginLimitResponse) {}
}

message Plugin {
  string id = 1;
  string app_id = 2;
  string key = 3;
  string name = 4;
  // latest_version is the highest published version, zero when none.
  int64 latest_version = 5;
  // draft_revision is the plugin draft's current revision (SRV-030).
  int64 draft_revision = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string description = 9;
  string icon_asset_id = 10;
  string owning_team_id = 11;
  repeated string tags = 12;
  bool archived = 13;
}

// PluginSummary is what the app canvas shows of one plugin.
message PluginSummary {
  Plugin plugin = 1;
  int64 screens = 2;
  // versions is the number of published versions (the highest is the latest).
  int64 versions = 3;
  // unpublished_changes is true when the draft changed after the newest
  // published version, or nothing was published yet and the draft has content.
  bool unpublished_changes = 4;
  // lock_holder is the display name of the draft's lock holder, or empty.
  string lock_holder = 5;
  int64 validation_errors = 6;
  // killed is true when a channel of the app switches the plugin off.
  bool killed = 7;
  // owner_team_id mirrors plugin.owning_team_id.
  string owner_team_id = 8;
  int64 bundle_size = 9;
  // links_out and links_in are the distinct other plugins this plugin
  // navigates to, and that navigate to it, by plugin key.
  repeated string links_out = 10;
  repeated string links_in = 11;
  repeated string functions_used = 12;
  google.protobuf.Timestamp published_at = 13;
}

// Lock is an exclusive editing lock (SRV-040, ADR-0015).
message Lock {
  // plugin_id is empty for the app-level lock (SRV-042).
  string plugin_id = 1;
  string app_id = 2;
  Actor holder = 3;
  // session identifies the holder's editing session.
  string session = 4;
  google.protobuf.Timestamp acquired_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // requested_by lists users who asked for the lock since it was taken.
  repeated Actor requested_by = 7;
  // scope is empty for the draft's own lock and "translations/<locale>" for
  // the lock of one locale's translations document (I18N-008).
  string scope = 8;
  // last_edit_at is the time of the holder's last accepted write under
  // this lock (ADR-0095).
  google.protobuf.Timestamp last_edit_at = 9;
  // takeover_allowed_at is the earliest time another user may take the
  // lock over: studio.lockTakeoverIdleMinutes after last_edit_at, or at
  // once when the lease has lapsed. The server enforces it (L-1, SRV-041).
  google.protobuf.Timestamp takeover_allowed_at = 10;
}

message CreatePluginRequest {
  string app_id = 1;
  string key = 2;
  string name = 3;
}
message CreatePluginResponse {
  Plugin plugin = 1;
}

message GetPluginRequest {
  string id = 1;
}
message GetPluginResponse {
  Plugin plugin = 1;
}

message ListPluginsRequest {
  string app_id = 1;
  Page page = 2;
}
message ListPluginsResponse {
  repeated Plugin plugins = 1;
  PageResult page = 2;
}

message UpdatePluginRequest {
  string id = 1;
  // name is required unless metadata is set, when an empty name keeps it.
  string name = 2;
  MetadataUpdate metadata = 3;
}
message UpdatePluginResponse {
  Plugin plugin = 1;
}

message DeletePluginRequest {
  string id = 1;
}
message DeletePluginResponse {
  TrashItem trash = 1;
}

message AcquireLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
  // force takes the lock from its holder; it needs plugin.lock.override,
  // snapshots the holder's unsaved work and is audited (SRV-041).
  bool force = 4;
  // scope names a locale lock, "translations/<locale>"; empty is the draft
  // lock (I18N-008).
  string scope = 5;
}
message AcquireLockResponse {
  Lock lock = 1;
  // preserved_snapshot_id is set when force took the lock.
  string preserved_snapshot_id = 2;
}

message RenewLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
  // scope is as in AcquireLockRequest.
  string scope = 4;
}
message RenewLockResponse {
  Lock lock = 1;
}

message ReleaseLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
  // scope is as in AcquireLockRequest.
  string scope = 4;
}
message ReleaseLockResponse {}

message RequestLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  // scope is as in AcquireLockRequest.
  string scope = 3;
}
message RequestLockResponse {
  Lock lock = 1;
}

message GetLockRequest {
  string app_id = 1;
  string plugin_id = 2;
  // scope is as in AcquireLockRequest.
  string scope = 3;
}
message GetLockResponse {
  Lock lock = 1;
}

message ListPluginLimitsRequest {
  string plugin_id = 1;
}
message ListPluginLimitsResponse {
  repeated LimitUsage limits = 1;
}

message SetPluginLimitRequest {
  string plugin_id = 1;
  string key = 2;
  int64 value = 3;
}
message SetPluginLimitResponse {
  LimitUsage limit = 1;
}

message DuplicatePluginRequest {
  string id = 1;
  string key = 2;
  string name = 3;
  // session is the caller's editing session, which takes the new plugin's
  // lock while the copy is written and releases it.
  string session = 4;
}
message DuplicatePluginResponse {
  Plugin plugin = 1;
}

message ArchivePluginRequest {
  string id = 1;
  bool archived = 2;
}
message ArchivePluginResponse {
  Plugin plugin = 1;
}

message ListPluginSummariesRequest {
  string app_id = 1;
}
message ListPluginSummariesResponse {
  repeated PluginSummary summaries = 1;
}
