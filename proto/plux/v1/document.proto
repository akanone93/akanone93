syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// DocumentService reads and writes the documents of a draft: pages, action
// graphs, themes, translations and the rest of the document model. Writes
// use optimistic concurrency and accept JSON Patch (SRV-030); every accepted
// write appends a snapshot (SRV-031); writing requires the editing lock
// (SRV-040). Content travels as canonical JSON bytes, never as protobuf
// structures, so a document's hash is a property of the bytes (SCH-003).
service DocumentService {
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse) {}
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {}
  // PutDocument replaces a document. if_revision must match the stored
  // revision, or the call fails with a conflict.
  rpc PutDocument(PutDocumentRequest) returns (PutDocumentResponse) {}
  // PatchDocument applies an RFC 6902 patch, which is what Studio autosave
  // sends (SRV-030).
  rpc PatchDocument(PatchDocumentRequest) returns (PatchDocumentResponse) {}
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse) {}
  // ApplyChangeSet applies one change set: edits to documents of the app
  // and of several of its plugins, written in one transaction or not at
  // all (STU-055, STU-070, contracts #15). Each draft's revision is checked
  // and each draft's editing lock must be held by the session named for it;
  // every write is tagged with the same undo step, so one change set is one
  // undo step across plugins (STU-069).
  rpc ApplyChangeSet(ApplyChangeSetRequest) returns (ApplyChangeSetResponse) {}

  // ValidateDraft runs the compiler's checking stages over the whole draft.
  rpc ValidateDraft(ValidateDraftRequest) returns (ValidateDraftResponse) {}
  // ValidatePage checks one edited page as the user types (SCH-042); it
  // does not write anything.
  rpc ValidatePage(ValidatePageRequest) returns (ValidatePageResponse) {}

  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse) {}
  // ListEditorSessionEntries lists an editor session's writes to a draft,
  // newest first, with the inverse patch of each, for Studio's undo
  // rebuild after a reload (STU-069, ADR-0095).
  rpc ListEditorSessionEntries(ListEditorSessionEntriesRequest) returns (ListEditorSessionEntriesResponse) {}
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse) {}
  // CompareSnapshots returns the JSON Patch that turns one into the other.
  rpc CompareSnapshots(CompareSnapshotsRequest) returns (CompareSnapshotsResponse) {}
  // RestoreSnapshot writes an earlier snapshot forward as a new one; it
  // never rewrites history (SRV-031).
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse) {}

  // ExportDraft streams the draft in the Git layout (SCH-006).
  rpc ExportDraft(ExportDraftRequest) returns (stream ExportDraftResponse) {}
  // ImportDraft replaces the draft from the Git layout, reporting the
  // diagnostics of what it read.
  rpc ImportDraft(stream ImportDraftRequest) returns (ImportDraftResponse) {}
}

// Document is one file of a draft.
message Document {
  string app_id = 1;
  // plugin_id is empty for app-level documents.
  string plugin_id = 2;
  // path is the document's path in the Git layout (SCH-006).
  string path = 3;
  // kind is the document's "kind" field, such as "page" or "theme".
  string kind = 4;
  // content is the canonical JSON of the document (SCH-003).
  bytes content = 5;
  // sha256 is the hash of content, lower-case hex.
  string sha256 = 6;
  int64 revision = 7;
  Actor updated_by = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Snapshot is one entry of the append-only history (SRV-031).
message Snapshot {
  string id = 1;
  string app_id = 2;
  string plugin_id = 3;
  int64 revision = 4;
  // reason is "write", "lock_takeover", "publish" or "restore".
  string reason = 5;
  // paths lists the documents this snapshot recorded.
  repeated string paths = 6;
  Actor actor = 7;
  google.protobuf.Timestamp created_at = 8;
  // editor_session_id is the editor session of the write that made this
  // snapshot; empty for writes outside Studio (ADR-0095).
  string editor_session_id = 9;
}

message GetDocumentRequest {
  string app_id = 1;
  string plugin_id = 2;
  string path = 3;
}
message GetDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  string app_id = 1;
  string plugin_id = 2;
  Page page = 3;
  // content_included returns the bytes as well as the metadata.
  bool content_included = 4;
}
message ListDocumentsResponse {
  repeated Document documents = 1;
  PageResult page = 2;
}

message PutDocumentRequest {
  string app_id = 1;
  string plugin_id = 2;
  string path = 3;
  bytes content = 4;
  // if_revision is the revision the writer last read; zero creates.
  int64 if_revision = 5;
  string session = 6;
  // editor_session_id names the Studio tab's editor session; the write's
  // snapshot is tagged with it for the undo rebuild (ADR-0095, STU-069).
  string editor_session_id = 7;
  // step_id names the undo step the write belongs to, so the rebuild
  // regroups a step that spans writes and documents (STU-069).
  string step_id = 8;
}
message PutDocumentResponse {
  Document document = 1;
  string snapshot_id = 2;
  repeated Diagnostic diagnostics = 3;
}

message PatchDocumentRequest {
  string app_id = 1;
  string plugin_id = 2;
  string path = 3;
  repeated PatchOp patch = 4;
  int64 if_revision = 5;
  string session = 6;
  // editor_session_id and step_id are as in PutDocumentRequest.
  string editor_session_id = 7;
  string step_id = 8;
}
message PatchDocumentResponse {
  Document document = 1;
  string snapshot_id = 2;
  repeated Diagnostic diagnostics = 3;
}

message DeleteDocumentRequest {
  string app_id = 1;
  string plugin_id = 2;
  string path = 3;
  int64 if_revision = 4;
  string session = 5;
}
message DeleteDocumentResponse {
  string snapshot_id = 1;
}

// ChangeSetEdit is one document a change set writes: exactly one of a JSON
// Patch (which may hold "test" operations), whole content, or a deletion.
message ChangeSetEdit {
  string path = 1;
  repeated PatchOp patch = 2;
  bytes content = 3;
  bool delete = 4;
  // if_revision is the document's revision as read; 0 creates with content.
  int64 if_revision = 5;
}

// ChangeSetDraft is the part of a change set that falls on one draft.
message ChangeSetDraft {
  // plugin_id is empty for app-level documents.
  string plugin_id = 1;
  // session is the editing session that holds this draft's lock.
  string session = 2;
  // if_draft_revision, when positive, must be the draft's revision.
  int64 if_draft_revision = 3;
  repeated ChangeSetEdit edits = 4;
}

message ApplyChangeSetRequest {
  string app_id = 1;
  repeated ChangeSetDraft drafts = 2;
  // editor_session_id and step_id tag every write as in PutDocumentRequest.
  string editor_session_id = 3;
  string step_id = 4;
}

// ChangeSetDraftResult is what a change set wrote to one draft.
message ChangeSetDraftResult {
  string plugin_id = 1;
  string snapshot_id = 2;
  int64 revision = 3;
  repeated Document documents = 4;
}

message ApplyChangeSetResponse {
  repeated ChangeSetDraftResult drafts = 1;
  repeated Diagnostic diagnostics = 2;
}

message ValidateDraftRequest {
  string app_id = 1;
  // plugin_id limits validation to one plugin; empty checks the whole app.
  string plugin_id = 2;
}
message ValidateDraftResponse {
  repeated Diagnostic diagnostics = 1;
}

message ValidatePageRequest {
  string app_id = 1;
  string plugin_id = 2;
  string path = 3;
  // content is the unsaved page as the editor currently has it.
  bytes content = 4;
}
message ValidatePageResponse {
  repeated Diagnostic diagnostics = 1;
}

message ListSnapshotsRequest {
  string app_id = 1;
  string plugin_id = 2;
  Page page = 3;
}
message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
  PageResult page = 2;
}

message ListEditorSessionEntriesRequest {
  string app_id = 1;
  // plugin_id is empty for the app's own documents.
  string plugin_id = 2;
  string editor_session_id = 3;
  Page page = 4;
}
// EditorSessionEntry is one document a tagged write changed.
message EditorSessionEntry {
  string snapshot_id = 1;
  string path = 2;
  // revision is the draft revision the write produced.
  int64 revision = 3;
  // inverse turns the document the write produced back into the one it
  // replaced.
  repeated PatchOp inverse = 4;
  google.protobuf.Timestamp created_at = 5;
  // step_id is the undo step of the write; empty when none was given.
  string step_id = 6;
}
message ListEditorSessionEntriesResponse {
  repeated EditorSessionEntry entries = 1;
  PageResult page = 2;
}

message GetSnapshotRequest {
  string id = 1;
  // paths limits the response to these documents; empty returns all.
  repeated string paths = 2;
}
message GetSnapshotResponse {
  Snapshot snapshot = 1;
  repeated Document documents = 2;
}

message CompareSnapshotsRequest {
  string from_id = 1;
  string to_id = 2;
}
message CompareSnapshotsResponse {
  // changes maps each changed path to the patch that turns from into to.
  repeated DocumentChange changes = 1;
}

message DocumentChange {
  string path = 1;
  // change is "added", "removed" or "changed".
  string change = 2;
  repeated PatchOp patch = 3;
}

message RestoreSnapshotRequest {
  string id = 1;
  repeated string paths = 2;
  string session = 3;
}
message RestoreSnapshotResponse {
  string snapshot_id = 1;
  repeated Diagnostic diagnostics = 2;
}

message ExportDraftRequest {
  string app_id = 1;
  string plugin_id = 2;
}
message ExportDraftResponse {
  string path = 1;
  bytes content = 2;
}

message ImportDraftRequest {
  // The first message carries the target and no file.
  string app_id = 1;
  string plugin_id = 2;
  string session = 3;
  string path = 4;
  bytes content = 5;
}
message ImportDraftResponse {
  int64 revision = 1;
  string snapshot_id = 2;
  repeated Diagnostic diagnostics = 3;
}
