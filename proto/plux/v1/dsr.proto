syntax = "proto3";

package plux.v1;

import "google/protobuf/timestamp.proto";
import "plux/v1/common.proto";

option go_package = "github.com/nightCode42/plux3/backend/internal/pluxv1;pluxv1";

// DataSubjectService serves data subject requests (SEC-162): the export and
// the erasure of everything an organisation holds about a device or a
// pseudonymous user, and the map of where personal data is stored. Every
// call needs the dsr.manage permission.
service DataSubjectService {
  // ExportSubject returns a JSON archive of the subject's data, one section
  // per store. It is refused with PLX-1320 when the archive would exceed the
  // dsr.exportBytes limit, and with PLX-8501 when the subject has no data.
  rpc ExportSubject(ExportSubjectRequest) returns (ExportSubjectResponse) {}
  // EraseSubject erases the subject's data store by store, leaving
  // tombstones and an audit entry. Erasing again is a no-op that reports
  // the earlier erasure. PLX-8501 when the subject never had any data.
  rpc EraseSubject(EraseSubjectRequest) returns (EraseSubjectResponse) {}
  // GetRequest returns one completed request.
  rpc GetRequest(GetRequestRequest) returns (GetRequestResponse) {}
  // ListRequests lists the organisation's completed requests, newest first.
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse) {}
  // GetPersonalDataMap returns the stores that hold personal data, their
  // personal fields, retention and what erasure does to each.
  rpc GetPersonalDataMap(GetPersonalDataMapRequest) returns (GetPersonalDataMapResponse) {}
}

// SubjectKind says what a subject identifier names.
enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  // SUBJECT_KIND_DEVICE is a device identifier.
  SUBJECT_KIND_DEVICE = 1;
  // SUBJECT_KIND_USER is a pseudonymous user identifier.
  SUBJECT_KIND_USER = 2;
}

message ExportSubjectRequest {
  SubjectKind kind = 1;
  // subject_id is the device or user identifier (a UUID).
  string subject_id = 2;
}
message ExportSubjectResponse {
  string request_id = 1;
  // archive is the JSON document, one section per store.
  bytes archive = 2;
  int64 row_count = 3;
}

message EraseSubjectRequest {
  SubjectKind kind = 1;
  string subject_id = 2;
}
message EraseSubjectResponse {
  string request_id = 1;
  // erased lists the stores that lost rows in this call; empty when the
  // subject was already erased.
  repeated StoreCount erased = 2;
  // already_erased is true when an earlier erasure left tombstones and this
  // call found nothing more to remove.
  bool already_erased = 3;
}

// StoreCount is the number of rows a store held for a subject.
message StoreCount {
  string store = 1;
  int64 rows = 2;
}

// DataSubjectRequest is a completed export or erasure. The subject appears
// only as a hash.
message DataSubjectRequest {
  string id = 1;
  // action is "export" or "erase".
  string action = 2;
  SubjectKind kind = 3;
  // subject_hash is the lower-case hex SHA-256 the tombstones carry.
  string subject_hash = 4;
  string actor = 5;
  int64 row_count = 6;
  int64 archive_bytes = 7;
  google.protobuf.Timestamp requested_at = 8;
  // tombstones are the stores an erasure emptied.
  repeated StoreCount tombstones = 9;
}

message GetRequestRequest {
  string id = 1;
}
message GetRequestResponse {
  DataSubjectRequest request = 1;
}

message ListRequestsRequest {
  Page page = 1;
}
message ListRequestsResponse {
  repeated DataSubjectRequest requests = 1;
  PageResult page = 2;
}

message GetPersonalDataMapRequest {}
message GetPersonalDataMapResponse {
  repeated PersonalDataStore stores = 1;
}

// PersonalDataStore is one entry of the personal-data map.
message PersonalDataStore {
  // name is the store's stable name, such as "devices".
  string name = 1;
  string description = 2;
  // device_key and user_key name the columns that select a device or a user;
  // empty when the store is not keyed by that subject.
  string device_key = 3;
  string user_key = 4;
  repeated string personal_fields = 5;
  string retention = 6;
  // erase is "delete", "aggregate", "retained" or "account".
  string erase = 7;
  string note = 8;
}
