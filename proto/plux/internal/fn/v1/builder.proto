syntax = "proto3";

package plux.internal.fn.v1;

option go_package = "github.com/nightCode42/plux3/backend/internal/fnpb;fnpb";

// BuilderService is served by the builder role and called by the worker over
// mutual TLS (FN-016, ADR-0063, ADR-0064). It is internal: it is not part of
// the public API contract and carries no compatibility promise beyond the
// roles of one release. The builder holds no database credentials, no
// object-store credentials and no signing keys (L-4): the worker hands it the
// source archive and signs what it returns.
service BuilderService {
  // Build compiles one function's source archive into a module, reads its
  // schemas, runs the stored test cases of its document and returns the
  // module with its provenance. A source that does not build is a response
  // with error diagnostics and no module; only a failure of the builder
  // itself is an RPC error.
  rpc Build(BuildRequest) returns (BuildResponse) {}

  // Link compiles the source archives of several device-placed functions into
  // the one module a plugin carries (FN-051, plan P7 E5). It runs the same
  // pipeline as Build without the stored test cases and without the second,
  // verifying build: each function was built and tested on its own, and the
  // linked module is a pure function of the sources, so the same set always
  // yields the same bytes. A set that does not link is a response with error
  // diagnostics and no module; only a failure of the builder itself is an RPC
  // error.
  rpc Link(LinkRequest) returns (LinkResponse) {}

  // LanguageOpen starts one language-server sandbox for an editor session
  // (FN-033, ADR-0099) and streams its messages until the session ends:
  // the client cancels the call, the server process exits or the session
  // time of `lsp.sessionMinutes` passes. The first event is Opened. The
  // sandbox has no network, no build scripts and no procedural macros, and
  // the role holds no credential (L-4).
  rpc LanguageOpen(LanguageOpenRequest) returns (stream LanguageOpenResponse) {}

  // LanguageSend delivers one client message to the session's language
  // server. Messages carry a sequence number that rises by one from 1; an
  // out-of-order message is refused, so edits apply in the order typed.
  rpc LanguageSend(LanguageSendRequest) returns (LanguageSendResponse) {}

  // Test builds the source and runs its stored test cases in the build
  // sandbox and the function host (FN-034). Nothing is stored and no module
  // is returned.
  rpc Test(TestRequest) returns (TestResponse) {}
}

message BuildRequest {
  // build_id names the build in the builder's logs.
  string build_id = 1;
  // source is the whole gzip-compressed tar archive: Cargo.toml, Cargo.lock,
  // src/, vendor/ and function.json at its root. It travels in the request,
  // not as a pre-signed object-store URL, so that the builder needs no route
  // to the object store; the request is bounded by the registry maximum of
  // function.sourceArchiveSize.
  bytes source = 2;
  // source_sha256 is the hex SHA-256 of source, which the builder verifies.
  string source_sha256 = 3;
  // name is the function's dotted name; function.json must declare it
  // (PLX-7205).
  string name = 4;
  // placement is the placement asked for, or empty for the one function.json
  // declares (PLX-7205).
  string placement = 5;
  BuildLimits limits = 6;
}

// BuildLimits are the limits of the app in force for the build, resolved from
// the registry by the worker (LIM-001). The builder applies the smaller of
// each and its own ceiling.
message BuildLimits {
  uint32 timeout_ms = 1;
  uint64 memory_bytes = 2;
}

message BuildResponse {
  // module is the optimised module; empty when the build failed.
  bytes module = 1;
  int32 abi_version = 2;
  string placement = 3;
  repeated BuiltFunction functions = 4;
  BuildProvenance provenance = 5;
  // declaration is the canonical JSON of function.json.
  bytes declaration = 6;
  // diagnostics_json is a JSON array of diagnostics (ADR-0018), the same
  // encoding the server stores.
  bytes diagnostics_json = 7;
  repeated BuildTestResult test_results = 8;
}

message BuiltFunction {
  string name = 1;
  // input_schema and output_schema are canonical JSON (RFC 8785).
  string input_schema = 2;
  string output_schema = 3;
}

message BuildProvenance {
  string source_sha256 = 1;
  string sdk_sha256 = 2;
  repeated BuildDependency dependencies = 3;
  string toolchain = 4;
  string wasm_opt_version = 5;
  // build_time is RFC 3339, in UTC.
  string build_time = 6;
  string builder_identity = 7;
}

message BuildDependency {
  string name = 1;
  string version = 2;
  string checksum = 3;
}

message BuildTestResult {
  string name = 1;
  bool passed = 2;
  string message = 3;
}

message LinkRequest {
  // link_id names the link in the builder's logs.
  string link_id = 1;
  // sources are the archives to link, one per function. Their total size is
  // bounded by the registry maximum of function.sourceArchiveSize.
  repeated LinkSource sources = 2;
  BuildLimits limits = 3;
}

message LinkSource {
  // name is the function's dotted name; its function.json must declare it
  // with the device placement (PLX-7205).
  string name = 1;
  // source is the whole gzip-compressed tar archive, as in BuildRequest.
  bytes source = 2;
  // source_sha256 is the hex SHA-256 of source, which the builder verifies.
  string source_sha256 = 3;
}

message LinkResponse {
  // module is the linked module; empty when the link failed.
  bytes module = 1;
  int32 abi_version = 2;
  // functions lists the module's functions with the index each dispatch
  // export takes.
  repeated LinkedFunction functions = 3;
  BuildProvenance provenance = 4;
  // diagnostics_json is a JSON array of diagnostics (ADR-0018).
  bytes diagnostics_json = 5;
}

message LinkedFunction {
  string name = 1;
  uint32 index = 2;
}

// LanguageOpenRequest starts a language-server session on a source archive.
message LanguageOpenRequest {
  // source is the archive of the function crate, as for a build.
  bytes source = 1;
  // source_sha256 is the hex SHA-256 of source.
  string source_sha256 = 2;
  // name is the dotted function name.
  string name = 3;
  // placement is the placement asked for, or empty for the document's.
  string placement = 4;
  // session_minutes is the time the sandbox may run; the role uses the
  // smaller of it and the registry maximum of `lsp.sessionMinutes`.
  uint32 session_minutes = 5;
  // memory_bytes is the address space the language server may map; the role
  // uses the smaller of it and the registry maximum of
  // `function.buildMemory`.
  uint64 memory_bytes = 6;
}

// LanguageOpenResponse is one event of a session's server stream.
message LanguageOpenResponse {
  oneof event {
    // opened is the first event.
    LanguageOpened opened = 1;
    // message is one JSON-RPC message from the language server, without the
    // Content-Length framing.
    bytes message = 2;
    // closed is the last event.
    LanguageClosed closed = 3;
  }
}

// LanguageOpened announces a started session.
message LanguageOpened {
  // session_id names the session in LanguageSend.
  string session_id = 1;
  // root_uri is the workspace root a client addresses documents under; the
  // role maps it to the sandbox's directory.
  string root_uri = 2;
}

// LanguageClosed says why a session ended.
message LanguageClosed {
  // reason is one of "client", "time", "exited" and "failed".
  string reason = 1;
  // detail is a short diagnostic without host paths; empty for "client".
  string detail = 2;
}

// LanguageSendRequest carries one client message.
message LanguageSendRequest {
  string session_id = 1;
  // sequence starts at 1 and rises by one per message of a session.
  uint64 sequence = 2;
  // message is one JSON-RPC message without framing.
  bytes message = 3;
}

message LanguageSendResponse {}

// TestRequest is a BuildRequest whose result is only the test results.
message TestRequest {
  BuildRequest build = 1;
}

message TestResponse {
  repeated BuildTestResult test_results = 1;
  bytes diagnostics_json = 2;
}
