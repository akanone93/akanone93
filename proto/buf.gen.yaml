# Generation is driven by `make proto`, which removes the generated
# directories and then runs buf with locally built plugins, so no network
# access and no remote plugin is needed (CI-003). `clean` stays off because
# the output directories sit beside hand-written code.
version: v2
clean: false
managed:
  enabled: false
plugins:
  - local: protoc-gen-go
    out: ../backend/internal
    opt:
      - module=github.com/nightCode42/plux3/backend/internal
  - local: protoc-gen-connect-go
    out: ../backend/internal
    opt:
      - module=github.com/nightCode42/plux3/backend/internal
  - local: protoc-gen-connect-openapi
    out: ../docs/reference/api
    opt:
      - format=yaml
      - path=openapi.yaml
      - base=openapi.base.yaml
    # The internal helper protocol is not part of the public API
    # description (SEC-120).
    exclude_types:
      - plux.internal.pkcs11.v1
      - plux.internal.fn.v1
  - local: ["../studio/node_modules/.bin/protoc-gen-es"]
    out: ../studio/packages/api/src/gen
    opt:
      - target=ts
      - import_extension=ts
    # The internal protocols are not part of the browser API (SEC-120).
    exclude_types:
      - plux.internal.pkcs11.v1
      - plux.internal.fn.v1
