          title: id
        appId:
          type: string
          title: app_id
        versionId:
          type: string
          title: version_id
          description: |-
            version_id is the published version, the release identifier of the
             commit message.
        state:
          type: string
          title: state
          description: |-
            state is "pending", "pushed" or "failed" (the last attempt failed and
             is retried).
        commit:
          type: string
          title: commit
        attempts:
          type: integer
          title: attempts
          format: int32
        errorCode:
          type: integer
          title: error_code
          format: int32
          description: error_code is the PLX code of the last failure, or zero.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: GitExport
      additionalProperties: false
    plux.v1.GitSettings:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        enabled:
          type: boolean
          title: enabled
        remoteUrl:
          type: string
          title: remote_url
          description: remote_url is the HTTPS address of the repository.
        branch:
          type: string
          title: branch
        username:
          type: string
          title: username
          description: username is sent with the credential; empty uses "x-access-token".
        credentialEnvironmentId:
          type: string
          title: credential_environment_id
          description: |-
            credential_environment_id and credential_key name the environment
             secret that holds the token.
        credentialKey:
