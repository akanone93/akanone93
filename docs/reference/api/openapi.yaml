          title: environment_id
        function:
          type: string
          title: function
        alias:
          type: string
          title: alias
        verifier:
          type: string
          title: verifier
        secret:
          type: string
          title: secret
          description: |-
            secret is a provider's signing secret for a provider verifier; a
             Standard Webhooks hook gets a generated one.
      title: CreateHookRequest
      additionalProperties: false
    plux.v1.CreateHookResponse:
      type: object
      properties:
        hook:
          allOf:
            - $ref: '#/components/schemas/plux.v1.FunctionHook'
          title: hook
        secret:
          type: string
          title: secret
          description: secret is returned once.
      title: CreateHookResponse
      additionalProperties: false
    plux.v1.CreateIdentityProviderRequest:
      type: object
      properties:
        installationWide:
          type: boolean
          title: installation_wide
          description: |-
            installation_wide makes a provider of the whole installation; it needs
             an installation administrator. Otherwise the provider belongs to the
             organisation the call acts in.
        provider:
          allOf:
            - $ref: '#/components/schemas/plux.v1.IdentityProvider'
          title: provider
      title: CreateIdentityProviderRequest
      additionalProperties: false
    plux.v1.CreateIdentityProviderResponse:
      type: object
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/plux.v1.IdentityProvider'
          title: provider
      title: CreateIdentityProviderResponse
      additionalProperties: false
    plux.v1.CreateNotificationChannelRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        kind:
          type: string
          title: kind
        settings:
          type: object
          title: settings
          additionalProperties:
            type: string
            title: value
        secret:
          type: string
          title: secret
          description: |-
            secret is the SMTP password, the Slack or Teams webhook URL, or the
             Telegram bot token. It is stored encrypted.
      title: CreateNotificationChannelRequest
      additionalProperties: false
    plux.v1.CreateNotificationChannelResponse:
      type: object
      properties:
        channel:
          allOf:
            - $ref: '#/components/schemas/plux.v1.NotificationChannel'
          title: channel
      title: CreateNotificationChannelResponse
      additionalProperties: false
    plux.v1.CreateOrganizationRequest:
      type: object
      properties:
        key:
          type: string
          title: key
        name:
          type: string
          title: name
      title: CreateOrganizationRequest
      additionalProperties: false
    plux.v1.CreateOrganizationResponse:
      type: object
      properties:
        organization:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Organization'
          title: organization
      title: CreateOrganizationResponse
      additionalProperties: false
    plux.v1.CreatePluginRequest:
      type: object
      properties:
        appId:
