    plux.v1.DevBundleFrame:
      type: object
      properties:
        bundleSequence:
          type: string
          title: bundle_sequence
          format: int64
          description: |-
            bundle_sequence is the bundle's number in the session's own sequence
             space, which never meets the production store's.
        manifest:
          type: string
          title: manifest
          format: byte
        sections:
          type: object
          title: sections
          additionalProperties:
            type: string
            title: value
            format: byte
          description: sections are the section bytes by section ID.
        incompatibleScopes:
          type: object
          title: incompatible_scopes
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/plux.v1.DevScopeList'
            title: value
          description: |-
            incompatible_scopes lists, per page ID, the state scopes whose schema
             changed (the compiler's verdict); a page absent from the map keeps its
             state.
      title: DevBundleFrame
      additionalProperties: false
      description: |-
        DevBundleFrame carries a dev bundle: a manifest signed with the
         development key of the session's environment and the sections it names.
    plux.v1.DevCommandFrame:
      type: object
      properties:
        commandId:
          type: string
          title: command_id
          description: command_id is echoed in the device's CommandResultEvent.
        command:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSessionServiceSendCommandRequest'
          title: command
          description: |-
            command holds the command in its oneof; session_id and device_id are
             not set.
      title: DevCommandFrame
      additionalProperties: false
      description: DevCommandFrame carries one command to the device.
    plux.v1.DevCommandStatus:
      type: string
      title: DevCommandStatus
      enum:
        - DEV_COMMAND_STATUS_UNSPECIFIED
        - DEV_COMMAND_STATUS_OK
        - DEV_COMMAND_STATUS_FAILED
        - DEV_COMMAND_STATUS_UNSUPPORTED
        - DEV_COMMAND_STATUS_REFUSED
      description: DevCommandStatus is how a device answered a command.
    plux.v1.DevDevice:
      type: object
      properties:
        id:
          type: string
          title: id
          description: |-
            id is the device's identifier inside the session; it is what events
             and commands name.
        deviceId:
          type: string
          title: device_id
          description: device_id is the device's registered identifier (DeviceService).
        name:
          type: string
          title: name
          description: name is the name the device gave when it paired, such as its model.
        platform:
          type: string
          title: platform
          description: platform is "android" or "ios".
        runtimeVersion:
          type: string
          title: runtime_version
        pairedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: paired_at
        lastSeenAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_seen_at
        connected:
          type: boolean
          title: connected
          description: connected is true while the device's socket is open.
        lastSequence:
          type: string
          title: last_sequence
          format: int64
          description: |-
            last_sequence is the sequence number of the last event the server
             relayed from the device.
      title: DevDevice
      additionalProperties: false
      description: DevDevice is a device paired with a session.
    plux.v1.DevDeviceFrame:
      type: object
      anyOf:
        - type: object
          properties:
            event:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevEvent'
              title: event
              description: |-
                event is something that happened on the device. Its sequence is the
                 device's own, counted from 1 for the device's first event; the
                 server replaces it with the session's sequence when it relays it.
          title: event
        - type: object
          properties:
            hello:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevDeviceHello'
              title: hello
              description: hello is the first frame after every upgrade.
          title: hello
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - event
              - required:
                  - hello
          - not:
              oneOf:
                - required:
                    - event
                - required:
                    - hello
      title: DevDeviceFrame
      description: DevDeviceFrame is one frame a paired device sends.
    plux.v1.DevDeviceHello:
      type: object
      properties:
        lastServerSequence:
          type: string
          title: last_server_sequence
          format: int64
          description: |-
            last_server_sequence is the last server frame the device carried out;
             the server sends the frames after it that it still holds.
        lastAcknowledgedEvent:
          type: string
          title: last_acknowledged_event
          format: int64
          description: |-
            last_acknowledged_event is the last device event sequence the device
             saw acknowledged; it resends from the next one.
      title: DevDeviceHello
      additionalProperties: false
      description: DevDeviceHello resumes a device's stream after a reconnect (DEV-021).
    plux.v1.DevDocumentPatch:
      type: object
      properties:
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
          description: path is the document's path in the project layout.
        patch:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PatchOp'
          title: patch
        ifRevision:
          type: string
          title: if_revision
          format: int64
          description: |-
            if_revision is the revision the writer last read; zero skips the
             check.
      title: DevDocumentPatch
      additionalProperties: false
      description: DevDocumentPatch is a JSON Patch to one document of the session's draft.
    plux.v1.DevDropReason:
      type: string
      title: DevDropReason
      enum:
        - DEV_DROP_REASON_UNSPECIFIED
        - DEV_DROP_REASON_BUFFER_FULL
        - DEV_DROP_REASON_EVENT_TOO_LARGE
      description: DevDropReason says why events were dropped.
    plux.v1.DevError:
      type: object
      properties:
        code:
          type: string
          title: code
          description: code is the stable "PLX-NNNN" code.
        reason:
          type: string
          title: reason
          description: reason is the code's stable name.
        message:
          type: string
          title: message
          description: |-
            message is the redacted message; it never contains a sensitive value
             (SEC-092).
      title: DevError
      additionalProperties: false
      description: DevError is a failure as the stream carries it.
    plux.v1.DevEvent:
      type: object
      anyOf:
        - type: object
          properties:
            actionTrace:
              allOf:
                - $ref: '#/components/schemas/plux.v1.ActionTraceEvent'
              title: action_trace
          title: action_trace
        - type: object
          properties:
            commandResult:
              allOf:
                - $ref: '#/components/schemas/plux.v1.CommandResultEvent'
              title: command_result
          title: command_result
        - type: object
          properties:
            drop:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DropEvent'
              title: drop
          title: drop
        - type: object
          properties:
            error:
              allOf:
                - $ref: '#/components/schemas/plux.v1.ErrorEvent'
              title: error
          title: error
        - type: object
          properties:
            frameTiming:
              allOf:
                - $ref: '#/components/schemas/plux.v1.FrameTimingEvent'
              title: frame_timing
          title: frame_timing
        - type: object
          properties:
            functionCall:
              allOf:
                - $ref: '#/components/schemas/plux.v1.FunctionCallEvent'
              title: function_call
          title: function_call
        - type: object
          properties:
            hotApply:
              allOf:
                - $ref: '#/components/schemas/plux.v1.HotApplyEvent'
              title: hot_apply
          title: hot_apply
        - type: object
          properties:
            inspect:
              allOf:
                - $ref: '#/components/schemas/plux.v1.InspectEvent'
              title: inspect
          title: inspect
        - type: object
          properties:
            log:
              allOf:
                - $ref: '#/components/schemas/plux.v1.LogEvent'
              title: log
          title: log
        - type: object
          properties:
            networkCall:
              allOf:
                - $ref: '#/components/schemas/plux.v1.NetworkCallEvent'
              title: network_call
          title: network_call
        - type: object
          properties:
            screenshot:
              allOf:
                - $ref: '#/components/schemas/plux.v1.ScreenshotEvent'
              title: screenshot
          title: screenshot
        - type: object
          properties:
            securityDetection:
              allOf:
                - $ref: '#/components/schemas/plux.v1.SecurityDetectionEvent'
              title: security_detection
          title: security_detection
        - type: object
          properties:
            stateDiff:
              allOf:
                - $ref: '#/components/schemas/plux.v1.StateDiffEvent'
              title: state_diff
          title: state_diff
        - type: object
          properties:
            sync:
              allOf:
                - $ref: '#/components/schemas/plux.v1.SyncEvent'
              title: sync
          title: sync
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - actionTrace
              - required:
                  - commandResult
              - required:
                  - drop
              - required:
                  - error
              - required:
                  - frameTiming
              - required:
                  - functionCall
              - required:
                  - hotApply
              - required:
                  - inspect
              - required:
                  - log
              - required:
                  - networkCall
              - required:
                  - screenshot
              - required:
                  - securityDetection
              - required:
                  - stateDiff
              - required:
                  - sync
          - not:
              oneOf:
                - required:
                    - actionTrace
                - required:
                    - commandResult
                - required:
                    - drop
                - required:
                    - error
                - required:
                    - frameTiming
                - required:
                    - functionCall
                - required:
                    - hotApply
                - required:
                    - inspect
                - required:
                    - log
                - required:
                    - networkCall
                - required:
                    - screenshot
                - required:
                    - securityDetection
                - required:
                    - stateDiff
                - required:
                    - sync
      properties:
        sequence:
          type: string
          title: sequence
          format: int64
          description: |-
            sequence is the position of the event in the session's stream. It
             grows by one per event the session relays, across all its devices, so
             a watcher resumes with the last sequence it saw (DEV-021).
        deviceId:
          type: string
          title: device_id
          description: |-
            device_id is the session device that produced the event; empty for an
             event the server produced itself, such as a drop it counted.
        timeUnixMicros:
          type: string
          title: time_unix_micros
          format: int64
          description: |-
            time_unix_micros is the device's clock when the event happened, in
             microseconds since the Unix epoch. With a faked clock (FakeClockCommand)
             it is the real time, not the faked one.
        traceId:
          type: string
          title: trace_id
          description: |-
            trace_id joins the events of one causal chain: the action run, the
             network call and the function call it made, and the server-side log
             lines of that call (DEV-020, FN-036). Empty when the event belongs to
             no chain.
      title: DevEvent
      description: DevEvent is one event of a device's stream.
    plux.v1.DevEventAck:
      type: object
      properties:
        upTo:
          type: string
          title: up_to
          format: int64
      title: DevEventAck
      additionalProperties: false
      description: DevEventAck acknowledges a device's events.
    plux.v1.DevLifecycleEvent:
      type: string
      title: DevLifecycleEvent
      enum:
        - DEV_LIFECYCLE_EVENT_UNSPECIFIED
        - DEV_LIFECYCLE_EVENT_PAUSE
        - DEV_LIFECYCLE_EVENT_RESUME
        - DEV_LIFECYCLE_EVENT_INACTIVE
        - DEV_LIFECYCLE_EVENT_DETACHED
        - DEV_LIFECYCLE_EVENT_MEMORY_PRESSURE
      description: DevLifecycleEvent is a lifecycle event the device simulates.
    plux.v1.DevLogLevel:
      type: string
      title: DevLogLevel
      enum:
        - DEV_LOG_LEVEL_UNSPECIFIED
        - DEV_LOG_LEVEL_TRACE
        - DEV_LOG_LEVEL_DEBUG
        - DEV_LOG_LEVEL_INFO
        - DEV_LOG_LEVEL_WARNING
        - DEV_LOG_LEVEL_ERROR
      description: DevLogLevel is the level of a log line.
    plux.v1.DevLogLine:
      type: object
      properties:
        timeUnixMicros:
          type: string
          title: time_unix_micros
          format: int64
        level:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevLogLevel'
          title: level
        message:
          type: string
          title: message
      title: DevLogLine
      additionalProperties: false
      description: DevLogLine is a log line of a function, device-side or server-side.
    plux.v1.DevOverlay:
      type: string
      title: DevOverlay
      enum:
        - DEV_OVERLAY_UNSPECIFIED
        - DEV_OVERLAY_FRAME_CHART
        - DEV_OVERLAY_REBUILD_COUNTERS
        - DEV_OVERLAY_TOUCH_TARGETS
        - DEV_OVERLAY_CONTRAST
      description: DevOverlay is a debugging overlay.
    plux.v1.DevPairing:
      type: object
      properties:
        token:
          type: string
          title: token
          description: |-
            token is the compact signed pairing token. It is a credential: it is
             shown to the person who asked and to nobody else, and never logged.
        uri:
          type: string
          title: uri
          description: |-
            uri is the pairing link the QR code holds:
             `plux-dev://pair?server=<url>&token=<token>`.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: expires_at is when the token stops working.
        code:
          type: string
          title: code
          description: |-
            code is the short code a person may type on the device instead of
             opening the link: eight Crockford base32 characters shown as
             XXXX-XXXX. It is a credential like the token, single-use and with the
             token's expiry, and only pairs a device of the session's organisation,
             app and environment (DEV-002).
      title: DevPairing
      additionalProperties: false
      description: DevPairing is a pairing token with the ways to show it.
    plux.v1.DevPatchResult:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        status:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevPatchStatus'
          title: status
        pagesApplied:
          type: array
          items:
            type: string
          title: pages_applied
        scopesReset:
          type: array
          items:
            type: string
          title: scopes_reset
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
          description: error is why the device refused the bundle, such as PLX-9230.
      title: DevPatchResult
      additionalProperties: false
      description: DevPatchResult is what one device did with a pushed patch.
    plux.v1.DevPatchStatus:
      type: string
      title: DevPatchStatus
      enum:
        - DEV_PATCH_STATUS_UNSPECIFIED
        - DEV_PATCH_STATUS_APPLIED
        - DEV_PATCH_STATUS_APPLIED_WITH_RESET
        - DEV_PATCH_STATUS_REFUSED
        - DEV_PATCH_STATUS_OFFLINE
      description: DevPatchStatus is the outcome of a push for one device.
    plux.v1.DevRunStatus:
      type: string
      title: DevRunStatus
      enum:
        - DEV_RUN_STATUS_UNSPECIFIED
        - DEV_RUN_STATUS_RUNNING
        - DEV_RUN_STATUS_SUCCEEDED
        - DEV_RUN_STATUS_FAILED
        - DEV_RUN_STATUS_CANCELLED
        - DEV_RUN_STATUS_SKIPPED
      description: DevRunStatus is the state of an action run or one of its steps.
    plux.v1.DevScopeList:
      type: object
      properties:
        scopes:
          type: array
          items:
            type: string
          title: scopes
      title: DevScopeList
      additionalProperties: false
      description: DevScopeList is a list of state scope names.
    plux.v1.DevSecurityDetectionKind:
      type: string
      title: DevSecurityDetectionKind
      enum:
        - DEV_SECURITY_DETECTION_KIND_UNSPECIFIED
        - DEV_SECURITY_DETECTION_KIND_ROOT
        - DEV_SECURITY_DETECTION_KIND_HOOKING
        - DEV_SECURITY_DETECTION_KIND_DEBUGGER
        - DEV_SECURITY_DETECTION_KIND_EMULATOR
        - DEV_SECURITY_DETECTION_KIND_REPACKAGING
        - DEV_SECURITY_DETECTION_KIND_UNTRUSTED_INSTALLER
        - DEV_SECURITY_DETECTION_KIND_SCREEN_CAPTURE
        - DEV_SECURITY_DETECTION_KIND_OVERLAY
        - DEV_SECURITY_DETECTION_KIND_ACCESSIBILITY
      description: DevSecurityDetectionKind is a detection of `plux_security` (SEC-070).
    plux.v1.DevServerFrame:
      type: object
      anyOf:
        - type: object
          properties:
            ack:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevEventAck'
              title: ack
              description: ack acknowledges the device's events up to and including a sequence.
          title: ack
        - type: object
          properties:
            bundle:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevBundleFrame'
              title: bundle
              description: bundle is a dev bundle to verify and apply (DEV-010).
          title: bundle
        - type: object
          properties:
            command:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevCommandFrame'
              title: command
              description: command is a command to carry out (DEV-011, DEV-031).
          title: command
        - type: object
          properties:
            ended:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevSessionEnded'
              title: ended
              description: ended says the session ended; the server closes the socket after it.
          title: ended
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - ack
              - required:
                  - bundle
              - required:
                  - command
              - required:
                  - ended
          - not:
              oneOf:
                - required:
                    - ack
                - required:
                    - bundle
                - required:
                    - command
                - required:
                    - ended
      properties:
        sequence:
          type: string
          title: sequence
          format: int64
          description: sequence numbers the server's frames to the device, from 1.
      title: DevServerFrame
      description: DevServerFrame is one frame the server sends a paired device.
    plux.v1.DevSession:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        createdBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: |-
            expires_at is the end of the session's lifetime,
             `devSession.lifetimeMinutes` after it was created; the session also
             ends after `devSession.idleMinutes` without traffic (PLX-9200).
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ended_at
          description: ended_at is set once the session has ended.
      title: DevSession
      additionalProperties: false
      description: DevSession is a dev session.
    plux.v1.DevSessionEnded:
      type: object
      properties:
        code:
          type: string
          title: code
          description: code is the error code of the reason, such as PLX-9200.
      title: DevSessionEnded
      additionalProperties: false
      description: DevSessionEnded tells a device its session ended.
    plux.v1.DevSessionKind:
      type: string
      title: DevSessionKind
      enum:
        - DEV_SESSION_KIND_UNSPECIFIED
        - DEV_SESSION_KIND_STUDIO
        - DEV_SESSION_KIND_CLI
      description: |-
        DevSessionKind says who drives a dev session. A Studio session follows the
         stored draft: the server compiles and pushes each accepted write, and
         Studio never pushes a patch (contract #17). A CLI session pushes patches
         over the stored draft.
    plux.v1.DevSessionServiceCreateSessionRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        kind:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSessionKind'
          title: kind
          description: kind says who drives the session; unspecified is a CLI session.
      title: DevSessionServiceCreateSessionRequest
      additionalProperties: false
    plux.v1.DevSessionServiceCreateSessionResponse:
      type: object
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSession'
          title: session
        pairing:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevPairing'
          title: pairing
      title: DevSessionServiceCreateSessionResponse
      additionalProperties: false
    plux.v1.DevSessionServiceEndSessionRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: DevSessionServiceEndSessionRequest
      additionalProperties: false
    plux.v1.DevSessionServiceEndSessionResponse:
      type: object
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSession'
          title: session
      title: DevSessionServiceEndSessionResponse
      additionalProperties: false
    plux.v1.DevSessionServiceExportTraceRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        deviceIds:
          type: array
          items:
            type: string
          title: device_ids
          description: |-
            device_ids limits the export to these session devices; empty exports
             all of them.
      title: DevSessionServiceExportTraceRequest
      additionalProperties: false
    plux.v1.DevSessionServiceExportTraceResponse:
      type: object
      properties:
        trace:
          type: string
          title: trace
          format: byte
          description: |-
            trace is the trace file: a gzip-compressed stream of length-prefixed
             messages, a TraceFileHeader first and then DevEvent messages. The
             events are redacted like the live stream.
        eventCount:
          type: string
          title: event_count
          format: int64
          description: event_count is the number of events in the file.
      title: DevSessionServiceExportTraceResponse
      additionalProperties: false
    plux.v1.DevSessionServiceGetPairingRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: DevSessionServiceGetPairingRequest
      additionalProperties: false
    plux.v1.DevSessionServiceGetPairingResponse:
      type: object
      properties:
        pairing:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevPairing'
          title: pairing
      title: DevSessionServiceGetPairingResponse
      additionalProperties: false
    plux.v1.DevSessionServiceListDevicesRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
      title: DevSessionServiceListDevicesRequest
      additionalProperties: false
    plux.v1.DevSessionServiceListDevicesResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.DevDevice'
          title: devices
      title: DevSessionServiceListDevicesResponse
      additionalProperties: false
    plux.v1.DevSessionServicePairRequest:
      type: object
      properties:
        pairingToken:
          type: string
          title: pairing_token
          description: pairing_token is the token the device scanned.
        name:
          type: string
          title: name
          description: |-
            name, platform and runtime_version describe the device for the
             session's device list.
        platform:
          type: string
          title: platform
        runtimeVersion:
          type: string
          title: runtime_version
        attestation:
          type: string
          title: attestation
          format: byte
          description: |-
            attestation is the device's development attestation, where the
             platform gives one (DEV-002); empty otherwise.
        pairingCode:
          type: string
          title: pairing_code
          description: |-
            pairing_code is the short code the person typed, used when
             pairing_token is empty; case and dashes do not matter. Setting both is
             INVALID_ARGUMENT. A device that fails devSession.pairingCodeAttempts
             times in ten minutes is refused with RATE_LIMITED.
      title: DevSessionServicePairRequest
      additionalProperties: false
    plux.v1.DevSessionServicePairResponse:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        deviceId:
          type: string
          title: device_id
          description: device_id is the device's identifier inside the session.
        socketTicket:
          type: string
          title: socket_ticket
          description: |-
            socket_ticket is opaque. The device presents it once at the WebSocket
             upgrade; it is bound to the device's DPoP key and to the session
             (PLX-9205).
        socketTicketExpiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: socket_ticket_expires_at
          description: socket_ticket_expires_at is when the ticket stops being accepted.
      title: DevSessionServicePairResponse
      additionalProperties: false
    plux.v1.DevSessionServicePushPatchRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        patches:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.DevDocumentPatch'
          title: patches
          description: |-
            patches are applied in order, all or none. Their total size is at most
             `devSession.patchBytes`.
      title: DevSessionServicePushPatchRequest
      additionalProperties: false
    plux.v1.DevSessionServicePushPatchResponse:
      type: object
      properties:
        bundleSha256:
          type: string
          title: bundle_sha256
          description: |-
            bundle_sha256 is the hash of the development bundle that was pushed,
             lower-case hex.
        results:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.DevPatchResult'
          title: results
          description: results holds one entry per paired device.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
          description: |-
            diagnostics are the findings of validation and compilation, including
             warnings of an applied patch.
      title: DevSessionServicePushPatchResponse
      additionalProperties: false
    plux.v1.DevSessionServiceRenewSocketTicketRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        deviceId:
          type: string
          title: device_id
      title: DevSessionServiceRenewSocketTicketRequest
      additionalProperties: false
    plux.v1.DevSessionServiceRenewSocketTicketResponse:
      type: object
      properties:
        socketTicket:
          type: string
          title: socket_ticket
          description: socket_ticket is opaque and single-use, like Pair's (PLX-9205).
        socketTicketExpiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: socket_ticket_expires_at
      title: DevSessionServiceRenewSocketTicketResponse
      additionalProperties: false
    plux.v1.DevSessionServiceSendCommandRequest:
      type: object
      anyOf:
        - type: object
          properties:
            captureScreenshot:
              allOf:
                - $ref: '#/components/schemas/plux.v1.CaptureScreenshotCommand'
              title: capture_screenshot
          title: capture_screenshot
        - type: object
          properties:
            evaluatePxl:
              allOf:
                - $ref: '#/components/schemas/plux.v1.EvaluatePxlCommand'
              title: evaluate_pxl
          title: evaluate_pxl
        - type: object
          properties:
            fakeClock:
              allOf:
                - $ref: '#/components/schemas/plux.v1.FakeClockCommand'
              title: fake_clock
          title: fake_clock
        - type: object
          properties:
            inspectSelect:
              allOf:
                - $ref: '#/components/schemas/plux.v1.InspectSelectCommand'
              title: inspect_select
          title: inspect_select
        - type: object
          properties:
            lifecycle:
              allOf:
                - $ref: '#/components/schemas/plux.v1.LifecycleCommand'
              title: lifecycle
          title: lifecycle
        - type: object
          properties:
            networkProfile:
              allOf:
                - $ref: '#/components/schemas/plux.v1.NetworkProfileCommand'
              title: network_profile
          title: network_profile
        - type: object
          properties:
            openScreen:
              allOf:
                - $ref: '#/components/schemas/plux.v1.OpenScreenCommand'
              title: open_screen
          title: open_screen
        - type: object
          properties:
            setState:
              allOf:
                - $ref: '#/components/schemas/plux.v1.SetStateCommand'
              title: set_state
          title: set_state
        - type: object
          properties:
            simulateSecurityDetection:
              allOf:
                - $ref: '#/components/schemas/plux.v1.SimulateSecurityDetectionCommand'
              title: simulate_security_detection
          title: simulate_security_detection
        - type: object
          properties:
            switchMock:
              allOf:
                - $ref: '#/components/schemas/plux.v1.SwitchMockCommand'
              title: switch_mock
          title: switch_mock
        - type: object
          properties:
            toggleOverlay:
              allOf:
                - $ref: '#/components/schemas/plux.v1.ToggleOverlayCommand'
              title: toggle_overlay
          title: toggle_overlay
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - captureScreenshot
              - required:
                  - evaluatePxl
              - required:
                  - fakeClock
              - required:
                  - inspectSelect
              - required:
                  - lifecycle
              - required:
                  - networkProfile
              - required:
                  - openScreen
              - required:
                  - setState
              - required:
                  - simulateSecurityDetection
              - required:
                  - switchMock
              - required:
                  - toggleOverlay
          - not:
              oneOf:
                - required:
                    - captureScreenshot
                - required:
                    - evaluatePxl
                - required:
                    - fakeClock
                - required:
                    - inspectSelect
                - required:
                    - lifecycle
                - required:
                    - networkProfile
                - required:
                    - openScreen
                - required:
                    - setState
                - required:
                    - simulateSecurityDetection
                - required:
                    - switchMock
                - required:
                    - toggleOverlay
      properties:
        sessionId:
          type: string
          title: session_id
        deviceId:
          type: string
          title: device_id
          description: |-
            device_id is the session device to send to; empty sends to every
             device of the session.
      title: DevSessionServiceSendCommandRequest
    plux.v1.DevSessionServiceSendCommandResponse:
      type: object
      properties:
        commandId:
          type: string
          title: command_id
          description: |-
            command_id identifies the command in the CommandResultEvent of each
             device.
        deviceIds:
          type: array
          items:
            type: string
          title: device_ids
          description: device_ids are the session devices the command was sent to.
      title: DevSessionServiceSendCommandResponse
      additionalProperties: false
    plux.v1.DevSessionServiceWatchEventsRequest:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
        deviceIds:
          type: array
          items:
            type: string
          title: device_ids
          description: |-
            device_ids limits the stream to these session devices; empty watches
             all of them.
        afterSequence:
          type: string
          title: after_sequence
          format: int64
          description: |-
            after_sequence resumes the stream after that event; zero starts with
             the events the server still retains (DEV-021).
      title: DevSessionServiceWatchEventsRequest
      additionalProperties: false
    plux.v1.DevSessionServiceWatchEventsResponse:
      type: object
      properties:
        event:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevEvent'
          title: event
      title: DevSessionServiceWatchEventsResponse
      additionalProperties: false
    plux.v1.DevSyncPhase:
      type: string
      title: DevSyncPhase
      enum:
        - DEV_SYNC_PHASE_UNSPECIFIED
        - DEV_SYNC_PHASE_CHECK
        - DEV_SYNC_PHASE_DOWNLOAD
        - DEV_SYNC_PHASE_VERIFY
        - DEV_SYNC_PHASE_APPLY
        - DEV_SYNC_PHASE_STAGED
        - DEV_SYNC_PHASE_COMPLETE
        - DEV_SYNC_PHASE_FAILED
      description: DevSyncPhase is a stage of a sync.
    plux.v1.DevThemeMode:
      type: string
      title: DevThemeMode
      enum:
        - DEV_THEME_MODE_UNSPECIFIED
        - DEV_THEME_MODE_LIGHT
        - DEV_THEME_MODE_DARK
        - DEV_THEME_MODE_SYSTEM
      description: DevThemeMode is the theme a screen is opened with.
    plux.v1.DevelopmentEvidence:
      type: object
      properties:
        buildId:
          type: string
          title: build_id
          description: build_id identifies the development build.
      title: DevelopmentEvidence
      additionalProperties: false
      description: |-
        DevelopmentEvidence marks a development build. The server accepts it
         only where the environment's security configuration allows it, and
         the device's assurance stays the lowest (SEC-004).
    plux.v1.DevelopmentSession:
      type: object
      properties:
        sessionId:
          type: string
          title: session_id
          description: session_id is the dev session's identifier.
        sequenceSpace:
          type: string
          title: sequence_space
          format: int64
          description: |-
            sequence_space is the number of the development sequence the bundle
             belongs to. Development bundles are numbered inside the session, apart
             from the app's release sequence, so a dev bundle can never be mistaken
             for a release.
      title: DevelopmentSession
      additionalProperties: false
      description: |-
        DevelopmentSession names the dev session a development bundle belongs
         to. It is never present in a release manifest.
    plux.v1.Device:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        platform:
          type: string
          title: platform
        osVersion:
          type: string
          title: os_version
        runtimeVersion:
          type: string
          title: runtime_version
        hostBuild:
          type: string
          title: host_build
        assuranceLevel:
          type: string
          title: assurance_level
          description: assurance_level is "none" until attestation arrives in P6.
        installedSequence:
          type: string
          title: installed_sequence
          format: int64
        registeredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: registered_at
        lastSeenAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_seen_at
        keyStorage:
          allOf:
            - $ref: '#/components/schemas/plux.v1.KeyStorage'
          title: key_storage
          description: |-
            key_storage is where the device's DPoP private key lives, as the
             attestation proved it (SEC-002).
        attestation:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationSummary'
          title: attestation
          description: |-
            attestation summarises the last verified attestation (SEC-003); unset
             for a device registered without one.
        revokedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: revoked_at
          description: |-
            revoked_at is when the device was revoked; unset while it is trusted
             (SEC-006).
        dpopJkt:
          type: string
          title: dpop_jkt
          description: |-
            dpop_jkt is the RFC 7638 thumbprint of the device's DPoP public key,
             base64url-encoded; every token issued to the device is bound to it
             (SEC-020).
      title: Device
      additionalProperties: false
    plux.v1.DeviceTargeting:
      type: object
      properties:
        os:
          type: string
          title: os
        osVersion:
          type: string
          title: os_version
        runtimeVersion:
          type: string
          title: runtime_version
        deviceClass:
          type: string
          title: device_class
        locale:
          type: string
          title: locale
        region:
          type: string
          title: region
          description: region is the device's region setting, never derived from its address.
        userHash:
          type: string
          title: user_hash
          description: |-
            user_hash is the hex SHA-256 of the pseudonymous user identifier that
             setUserContext provided, empty if there is none. It places the device in
             a rollout's bucket in place of its own identifier.
        userAttributes:
          type: object
          title: user_attributes
          additionalProperties:
            type: string
            title: value
          description: |-
            user_attributes maps the name of a user-context attribute to the hex
             SHA-256 of the name, a zero byte and the value; plain values never leave
             the device.
      title: DeviceTargeting
      additionalProperties: false
      description: |-
        DeviceTargeting is what a device reports about itself so that the server
         can decide, when it fetches its manifest, which release a rollout offers it
         (REL-050, REL-051, ADR-0078). The host build and the channel are the
         server's own knowledge and are not repeated here.
    plux.v1.Diagnostic:
      type: object
      properties:
        code:
          type: string
          title: code
          description: code is the stable "PLX-NNNN" code.
        reason:
          type: string
          title: reason
          description: reason is the code's stable name.
        severity:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Severity'
          title: severity
        location:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Location'
          title: location
        message:
          type: string
          title: message
        cause:
          type: string
          title: cause
        fix:
          type: string
          title: fix
        patch:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PatchOp'
          title: patch
        docUrl:
          type: string
          title: doc_url
        related:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Location'
          title: related
      title: Diagnostic
      additionalProperties: false
      description: Diagnostic is a finding about a document (ADR-0018, Appendix F).
    plux.v1.DisplayedValue:
      type: object
      properties:
        label:
          type: string
          title: label
          description: label names the value for the user.
        value:
          type: string
          title: value
          description: value is its text form.
      title: DisplayedValue
      additionalProperties: false
      description: |-
        DisplayedValue is a server-held value of a transaction that the user
         sees before confirming it, such as the payee (DAT-093).
    plux.v1.Document:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id is empty for app-level documents.
        path:
          type: string
          title: path
          description: path is the document's path in the Git layout (SCH-006).
        kind:
          type: string
          title: kind
          description: kind is the document's "kind" field, such as "page" or "theme".
        content:
          type: string
          title: content
          format: byte
          description: content is the canonical JSON of the document (SCH-003).
        sha256:
          type: string
          title: sha256
          description: sha256 is the hash of content, lower-case hex.
        revision:
          type: string
          title: revision
          format: int64
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Document
      additionalProperties: false
      description: Document is one file of a draft.
    plux.v1.DocumentChange:
      type: object
      properties:
        path:
          type: string
          title: path
        change:
          type: string
          title: change
          description: change is "added", "removed" or "changed".
        patch:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PatchOp'
          title: patch
      title: DocumentChange
      additionalProperties: false
    plux.v1.DocumentChanged:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
        revision:
          type: string
          title: revision
          format: int64
        actor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: actor
      title: DocumentChanged
      additionalProperties: false
    plux.v1.DropEvent:
      type: object
      properties:
        dropped:
          type: string
          title: dropped
          format: int64
        reason:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevDropReason'
          title: reason
      title: DropEvent
      additionalProperties: false
      description: |-
        DropEvent says how many events were dropped before this point of the
         stream, so a watcher knows the gap is not a fault (DEV-021).
    plux.v1.EnrolScaKeyRequest:
      type: object
      properties:
        challenge:
          type: string
          title: challenge
          format: byte
          description: |-
            challenge is a fresh challenge from CreateRegistrationChallenge; the
             attestation of the key must be bound to it.
        scaPublicKeyJwk:
          type: string
          title: sca_public_key_jwk
          format: byte
          description: sca_public_key_jwk is the SCA public key as a JWK (RFC 7517).
        scaEvidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: sca_evidence
          description: |-
            sca_evidence is the attestation of the key: an Android Key Attestation
             chain of the SCA key, or an App Attest attestation bound to its
             thumbprint (SEC-027).
      title: EnrolScaKeyRequest
      additionalProperties: false
    plux.v1.EnrolScaKeyResponse:
      type: object
      properties:
        scaJkt:
          type: string
          title: sca_jkt
          description: sca_jkt is the RFC 7638 thumbprint of the stored key.
      title: EnrolScaKeyResponse
      additionalProperties: false
    plux.v1.EnrollTotpRequest:
      type: object
      properties:
        label:
          type: string
          title: label
      title: EnrollTotpRequest
      additionalProperties: false
    plux.v1.EnrollTotpResponse:
      type: object
      properties:
        factor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Factor'
          title: factor
        secret:
          type: string
          title: secret
          description: secret is the base32 TOTP secret; it is returned exactly once.
        otpauthUrl:
          type: string
          title: otpauth_url
      title: EnrollTotpResponse
      additionalProperties: false
    plux.v1.Environment:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        key:
          type: string
          title: key
          description: key is "development", "staging", "production" or a custom name.
        name:
          type: string
          title: name
        production:
          type: boolean
          title: production
          description: |-
            production marks an environment as production for retention and for
             the refusal of file-backed signing keys (SEC-056).
        signingKeyRef:
          type: string
          title: signing_key_ref
          description: signing_key_ref names the key in the signing backend (SEC-120).
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Environment
      additionalProperties: false
      description: |-
        Environment isolates variables, secrets, data-source URLs, signing keys
         and device registrations (GOV-010).
    plux.v1.EraseSubjectRequest:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/plux.v1.SubjectKind'
          title: kind
        subjectId:
          type: string
          title: subject_id
      title: EraseSubjectRequest
      additionalProperties: false
    plux.v1.EraseSubjectResponse:
      type: object
      properties:
        requestId:
          type: string
          title: request_id
        erased:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.StoreCount'
          title: erased
          description: |-
            erased lists the stores that lost rows in this call; empty when the
             subject was already erased.
        alreadyErased:
          type: boolean
          title: already_erased
          description: |-
            already_erased is true when an earlier erasure left tombstones and this
             call found nothing more to remove.
      title: EraseSubjectResponse
      additionalProperties: false
    plux.v1.ErrorDay:
      type: object
      properties:
        day:
          type: string
          title: day
          description: day is YYYY-MM-DD.
        events:
          type: string
          title: events
          format: int64
      title: ErrorDay
      additionalProperties: false
      description: ErrorDay is the events of a group on one UTC day.
    plux.v1.ErrorEvent:
      type: object
      properties:
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
        nodePath:
          type: string
          title: node_path
          description: |-
            node_path is the document location of the node or action, resolved
             through the source map (CMP-041).
        severity:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Severity'
          title: severity
        fatal:
          type: boolean
          title: fatal
          description: fatal is true when the error ended the screen's rendering or the app.
      title: ErrorEvent
      additionalProperties: false
      description: ErrorEvent is an error of the runtime with the node it belongs to.
    plux.v1.ErrorGroup:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        fingerprint:
          type: string
          title: fingerprint
        code:
          type: string
          title: code
          description: code is the error code, such as PLX-4101.
        pluginKey:
          type: string
          title: plugin_key
        route:
          type: string
          title: route
        nodePath:
          type: string
          title: node_path
          description: |-
            node_path is where the runtime reported the error; Studio opens the
             node by it (P11).
        jsonPath:
          type: string
          title: json_path
          description: |-
            json_path and source_file are the document location the retained source
             map gives for the node; empty when it cannot be resolved.
        sourceFile:
          type: string
          title: source_file
        frames:
          type: array
          items:
            type: string
          title: frames
          description: frames are the normalised top frames the fingerprint covers.
        fatal:
          type: boolean
          title: fatal
        firstSeen:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: first_seen
        lastSeen:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_seen
        events:
          type: string
          title: events
          format: int64
        devices:
          type: string
          title: devices
          format: int64
        trend:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ErrorDay'
          title: trend
          description: trend is the events per UTC day over the window asked for.
      title: ErrorGroup
      additionalProperties: false
      description: |-
        ErrorGroup is the errors with one fingerprint in one release of an app
         (ANL-040).
    plux.v1.ErrorSample:
      type: object
      properties:
        eventId:
          type: string
          title: event_id
        occurredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: occurred_at
        fieldsJson:
          type: string
          title: fields_json
          description: fields are the event's flat scalar fields as a JSON object.
      title: ErrorSample
      additionalProperties: false
      description: ErrorSample is one event of a group.
    plux.v1.EvaluatePxlCommand:
      type: object
      properties:
        expression:
          type: string
          title: expression
        program:
          type: string
          title: program
          format: byte
          description: |-
            program is the expression compiled to PXL bytecode. The server sets it
             when it relays the command and clears whatever a client sent: the device
             evaluates only what the server compiled.
        roots:
          type: array
          items:
            type: string
          title: roots
          description: |-
            roots are the state roots the expression may read; empty means every
             root the console offers.
      title: EvaluatePxlCommand
      additionalProperties: false
      description: |-
        EvaluatePxlCommand evaluates a PXL expression against the device's live
         state; the result arrives redacted in the CommandResultEvent (DEV-032).
    plux.v1.Event:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is one of the catalogued event names of Appendix G.2.
        time:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: time
        deviceId:
          type: string
          title: device_id
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        pluginKey:
          type: string
          title: plugin_key
        route:
          type: string
          title: route
        fields:
          type: string
          title: fields
          format: byte
          description: |-
            fields are the event's declared non-sensitive properties, as
             canonical JSON.
      title: Event
      additionalProperties: false
    plux.v1.EventTypeInfo:
      type: object
      properties:
        type:
          type: string
          title: type
          description: type is the dotted name, for example "release.published".
        description:
          type: string
          title: description
        severity:
          type: string
          title: severity
          description: severity is "info", "warning" or "critical".
      title: EventTypeInfo
      additionalProperties: false
      description: EventTypeInfo describes an event type.
    plux.v1.ExchangeUserTokenRequest:
      type: object
      properties:
        subjectToken:
          type: string
          title: subject_token
          description: subject_token is the end user's token (RFC 8693 `subject_token`).
        subjectTokenType:
          type: string
          title: subject_token_type
          description: subject_token_type is the RFC 8693 token type URN of subject_token.
        audience:
          type: string
          title: audience
          description: |-
            audience is what the new token is for (RFC 8693 `audience`): a gateway
             upstream, or `function:<name>` for a server function (SEC-026).
      title: ExchangeUserTokenRequest
      additionalProperties: false
    plux.v1.ExchangeUserTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        issuedTokenType:
          type: string
          title: issued_token_type
          description: issued_token_type is the RFC 8693 token type URN of access_token.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: ExchangeUserTokenResponse
      additionalProperties: false
    plux.v1.ExchangeWorkloadIdentityRequest:
      type: object
      properties:
        identityToken:
          type: string
          title: identity_token
          description: identity_token is the CI provider's OpenID Connect token.
        organizationId:
          type: string
          title: organization_id
      title: ExchangeWorkloadIdentityRequest
      additionalProperties: false
    plux.v1.ExchangeWorkloadIdentityResponse:
      type: object
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AccessToken'
          title: token
        secret:
          type: string
          title: secret
      title: ExchangeWorkloadIdentityResponse
      additionalProperties: false
    plux.v1.Experiment:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        key:
          type: string
          title: key
        state:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ExperimentState'
          title: state
        definitionJson:
          type: string
          title: definition_json
          description: definition_json is the experiment document it was made from.
        salt:
          type: string
          title: salt
        layerSharePercent:
          type: number
          title: layer_share_percent
          format: double
          description: |-
            layer_share_percent is the share of its layer it asked for when it
             started; layer_start and layer_end are the buckets (of 10000) it holds
             while it runs.
        layerStart:
          type: integer
          title: layer_start
        layerEnd:
          type: integer
          title: layer_end
        startedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: started_at
        stoppedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: stopped_at
        winner:
          type: string
          title: winner
        promoteJobId:
          type: string
          title: promote_job_id
        createdBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Experiment
      additionalProperties: false
    plux.v1.ExperimentAssignment:
      type: object
      properties:
        key:
          type: string
          title: key
        layer:
          type: string
          title: layer
        variant:
          type: string
          title: variant
      title: ExperimentAssignment
      additionalProperties: false
      description: ExperimentAssignment is one experiment's variant for this device.
    plux.v1.ExperimentState:
      type: string
      title: ExperimentState
      enum:
        - EXPERIMENT_STATE_UNSPECIFIED
        - EXPERIMENT_STATE_DRAFT
        - EXPERIMENT_STATE_RUNNING
        - EXPERIMENT_STATE_STOPPED
        - EXPERIMENT_STATE_CONCLUDED
      description: ExperimentState is where an experiment is in its life.
    plux.v1.ExplainAccessRequest:
      type: object
      anyOf:
        - type: object
          properties:
            proposedGrant:
              allOf:
                - $ref: '#/components/schemas/plux.v1.ProposedGrant'
              title: proposed_grant
          title: proposed_grant
        - type: object
          properties:
            proposedRestriction:
              allOf:
                - $ref: '#/components/schemas/plux.v1.CreateRestrictionRequest'
              title: proposed_restriction
          title: proposed_restriction
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - proposedGrant
              - required:
                  - proposedRestriction
          - not:
              oneOf:
                - required:
                    - proposedGrant
                - required:
                    - proposedRestriction
      properties:
        organizationId:
          type: string
          title: organization_id
        userId:
          type: string
          title: user_id
          description: user_id is the person; empty explains the caller's own access.
        permission:
          type: string
          title: permission
          description: permission is the catalogue permission asked about.
        appId:
          type: string
          title: app_id
          description: |-
            app_id and environment (the environment's key) name the scope; both
             empty asks about the whole organisation.
        environment:
          type: string
          title: environment
      title: ExplainAccessRequest
    plux.v1.ExplainAccessResponse:
      type: object
      properties:
        decision:
          type: string
          title: decision
          description: decision is "allow" or "deny".
        allowingGrantIds:
          type: array
          items:
            type: string
          title: allowing_grant_ids
          description: |-
            allowing_grant_ids are the grants, memberships and app access entries
             whose roles carry the permission in the scope; none means "no grant".
        removingRestrictionIds:
          type: array
          items:
            type: string
          title: removing_restriction_ids
          description: |-
            removing_restriction_ids are the restrictions that take it away in the
             scope.
        ownerFloor:
          type: boolean
          title: owner_floor
          description: |-
            owner_floor is set when a restriction names the permission and the
             person is an Owner, whose floor keeps it (GOV-006).
      title: ExplainAccessResponse
      additionalProperties: false
    plux.v1.Export:
      type: object
      properties:
        endpoint:
          type: string
          title: endpoint
          description: endpoint is the OTLP/HTTP metrics URL.
        enabled:
          type: boolean
          title: enabled
        exportedUntil:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: exported_until
          description: exported_until is the end of the last bucket sent.
        lastError:
          type: string
          title: last_error
          description: last_error says why the last attempt failed; empty when it did not.
        lastAttemptAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_attempt_at
      title: Export
      additionalProperties: false
      description: Export is the OTLP destination of an organisation.
    plux.v1.ExportDestination:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
          description: name is a lower-case key, unique in the organisation.
        kind:
          type: string
          title: kind
          description: kind is "syslog", "cef", "otlp" or "webhook".
        address:
          type: string
          title: address
          description: |-
            address is host:port for syslog and cef, and an https URL for otlp and
             webhook.
        enabled:
          type: boolean
          title: enabled
        allowPrivate:
          type: boolean
          title: allow_private
          description: |-
            allow_private is true when the destination may be a private or loopback
             address. It is for development; warnings says so.
        caPem:
          type: string
          title: ca_pem
          description: ca_pem pins the roots that verify the destination's certificate.
        credentialsHint:
          type: string
          title: credentials_hint
          description: |-
            credentials_hint names what is stored sealed, such as "client certificate"
             or "signing secret ...a1b2"; the credentials themselves are never
             returned.
        cursorSequence:
          type: string
          title: cursor_sequence
          format: int64
          description: |-
            cursor_sequence is the last entry of the chain the destination
             acknowledged; cursor_hash is that entry's hash.
        cursorHash:
          type: string
          title: cursor_hash
        exportedCount:
          type: string
          title: exported_count
          format: int64
        failures:
          type: integer
          title: failures
          format: int32
          description: |-
            failures counts consecutive failed attempts; last_error is the last
             failure, prefixed with its PLX code.
        lastError:
          type: string
          title: last_error
        lastErrorAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_error_at
        lastSuccessAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_success_at
        nextAttemptAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: next_attempt_at
          description: next_attempt_at is when the exporter will try again after a failure.
        version:
          type: string
          title: version
          format: int64
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        warnings:
          type: array
          items:
            type: string
          title: warnings
          description: |-
            warnings are unsafe settings of the destination, for example a private
             address allowed for development.
      title: ExportDestination
      additionalProperties: false
      description: ExportDestination is a SIEM destination and how far delivery has got.
    plux.v1.ExportDraftRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
      title: ExportDraftRequest
      additionalProperties: false
    plux.v1.ExportDraftResponse:
      type: object
      properties:
        path:
          type: string
          title: path
        content:
          type: string
          title: content
          format: byte
      title: ExportDraftResponse
      additionalProperties: false
    plux.v1.ExportPoliciesRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
      title: ExportPoliciesRequest
      additionalProperties: false
    plux.v1.ExportPoliciesResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PolicyFile'
          title: files
      title: ExportPoliciesResponse
      additionalProperties: false
    plux.v1.ExportSubjectRequest:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/plux.v1.SubjectKind'
          title: kind
        subjectId:
          type: string
          title: subject_id
          description: subject_id is the device or user identifier (a UUID).
      title: ExportSubjectRequest
      additionalProperties: false
    plux.v1.ExportSubjectResponse:
      type: object
      properties:
        requestId:
          type: string
          title: request_id
        archive:
          type: string
          title: archive
          format: byte
          description: archive is the JSON document, one section per store.
        rowCount:
          type: string
          title: row_count
          format: int64
      title: ExportSubjectResponse
      additionalProperties: false
    plux.v1.ExportTranslationsRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        locale:
          type: string
          title: locale
        format:
          type: string
          title: format
          description: format is "xliff", "arb", "json" or "csv".
      title: ExportTranslationsRequest
      additionalProperties: false
    plux.v1.ExportTranslationsResponse:
      type: object
      properties:
        content:
          type: string
          title: content
          format: byte
        sourceLocale:
          type: string
          title: source_locale
          description: |-
            source_locale is the locale the source texts are in: the app's default
             locale.
      title: ExportTranslationsResponse
      additionalProperties: false
    plux.v1.Factor:
      type: object
      properties:
        id:
          type: string
          title: id
        kind:
          type: string
          title: kind
          description: kind is "totp" or "webauthn".
        label:
          type: string
          title: label
        confirmed:
          type: boolean
          title: confirmed
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_used_at
      title: Factor
      additionalProperties: false
      description: Factor is an enrolled second factor (SEC-100).
    plux.v1.FakeClockCommand:
      type: object
      anyOf:
        - type: object
          properties:
            advanceMicros:
              type: string
              title: advance_micros
              format: int64
              description: advance_micros moves a faked clock forward.
          title: advance_micros
        - type: object
          properties:
            reset:
              type: boolean
              title: reset
              description: reset returns to the real clock when true.
          title: reset
        - type: object
          properties:
            setUnixMicros:
              type: string
              title: set_unix_micros
              format: int64
              description: set_unix_micros fixes the clock at an instant.
          title: set_unix_micros
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - advanceMicros
              - required:
                  - reset
              - required:
                  - setUnixMicros
          - not:
              oneOf:
                - required:
                    - advanceMicros
                - required:
                    - reset
                - required:
                    - setUnixMicros
      title: FakeClockCommand
      description: |-
        FakeClockCommand sets, advances or resets the clock the runtime's
         time-dependent actions and PXL functions read (DEV-031).
    plux.v1.FileExport:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/plux.v1.FileExportSettings'
          title: settings
        secretHint:
          type: string
          title: secret_hint
          description: |-
            secret_hint is the end of the webhook signing secret, which is never
             returned; empty when none is stored.
        exportedUntil:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: exported_until
          description: exported_until is the end of the last hour delivered.
        lastError:
          type: string
          title: last_error
          description: last_error says why the last attempt failed; empty when it did not.
        lastAttemptAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_attempt_at
      title: FileExport
      additionalProperties: false
      description: |-
        FileExport is the settings of the Parquet and webhook exports and the
         progress of their delivery.
    plux.v1.FileExportSettings:
      type: object
      properties:
        parquetEnabled:
          type: boolean
          title: parquet_enabled
        parquetEvents:
          type: boolean
          title: parquet_events
          description: parquet_events and parquet_rollups choose the kinds of Parquet file.
        parquetRollups:
          type: boolean
          title: parquet_rollups
        parquetGranularity:
          type: string
          title: parquet_granularity
          description: 'parquet_granularity is the width of the exported rollups: 5m, 1h or 1d.'
        webhookEnabled:
          type: boolean
          title: webhook_enabled
        webhookUrl:
          type: string
          title: webhook_url
          description: webhook_url is the https address of the receiver.
      title: FileExportSettings
      additionalProperties: false
      description: |-
        FileExportSettings is what an organisation exports as files and messages
         (ANL-011).
    plux.v1.FinishAssetUploadRequest:
      type: object
      properties:
        uploadId:
          type: string
          title: upload_id
      title: FinishAssetUploadRequest
      additionalProperties: false
    plux.v1.FinishAssetUploadResponse:
      type: object
      properties:
        asset:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Asset'
          title: asset
      title: FinishAssetUploadResponse
      additionalProperties: false
    plux.v1.FinishWebAuthnRegistrationRequest:
      type: object
      properties:
        factorId:
          type: string
          title: factor_id
        clientDataJson:
          type: string
          title: client_data_json
          format: byte
        attestationObject:
          type: string
          title: attestation_object
          format: byte
      title: FinishWebAuthnRegistrationRequest
      additionalProperties: false
    plux.v1.FinishWebAuthnRegistrationResponse:
      type: object
      properties:
        factor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Factor'
          title: factor
      title: FinishWebAuthnRegistrationResponse
      additionalProperties: false
    plux.v1.Flag:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        key:
          type: string
          title: key
        type:
          allOf:
            - $ref: '#/components/schemas/plux.v1.FlagType'
          title: type
        description:
          type: string
          title: description
        schemaJson:
          type: string
          title: schema_json
        defaultJson:
          type: string
          title: default_json
          description: default_json is canonical JSON.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.FlagSegmentValue'
          title: segments
        createdBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: created_by
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: updated_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Flag
      additionalProperties: false
    plux.v1.FlagSegmentValue:
      type: object
      properties:
        segment:
          type: string
          title: segment
        valueJson:
          type: string
          title: value_json
      title: FlagSegmentValue
      additionalProperties: false
      description: |-
        FlagSegmentValue is a flag's value for the devices of one segment. Values
         are JSON text.
    plux.v1.FlagSpec:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/plux.v1.FlagType'
          title: type
          description: type may be left unspecified on an update, but not changed.
        description:
          type: string
          title: description
        schemaJson:
          type: string
          title: schema_json
          description: |-
            schema_json is the JSON Schema of a json flag's values; empty on an
             update keeps the current one.
        defaultJson:
          type: string
          title: default_json
        segments:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.FlagSegmentValue'
          title: segments
          description: 'segments are in precedence order: the first a device belongs to wins.'
      title: FlagSpec
      additionalProperties: false
      description: FlagSpec is the content of a flag; all of it replaces the flag's content.
    plux.v1.FlagType:
      type: string
      title: FlagType
      enum:
        - FLAG_TYPE_UNSPECIFIED
        - FLAG_TYPE_BOOL
        - FLAG_TYPE_NUMBER
        - FLAG_TYPE_STRING
        - FLAG_TYPE_JSON
      description: FlagType is the type of a flag.
    plux.v1.FrameSample:
      type: object
      properties:
        buildMicros:
          type: string
          title: build_micros
          format: int64
          description: |-
            build_micros and raster_micros are the UI thread's and the raster
             thread's time for the frame.
        rasterMicros:
          type: string
          title: raster_micros
          format: int64
        janky:
          type: boolean
          title: janky
          description: janky is true when the frame missed its deadline.
      title: FrameSample
      additionalProperties: false
      description: FrameSample is the timing of one frame.
    plux.v1.FrameTimingEvent:
      type: object
      properties:
        windowMicros:
          type: string
          title: window_micros
          format: int64
          description: window_micros is the length of the window the samples cover.
        route:
          type: string
          title: route
          description: route is the route that was on screen.
        frames:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.FrameSample'
          title: frames
        rebuildCounts:
          type: object
          title: rebuild_counts
          additionalProperties:
            type: integer
            title: value
          description: |-
            rebuild_counts maps a node path to the number of times it rebuilt in
             the window; empty unless the rebuild-counter overlay is on (DEV-034).
      title: FrameTimingEvent
      additionalProperties: false
      description: FrameTimingEvent reports the frames of a short window (DEV-020).
    plux.v1.FunctionBusinessError:
      type: object
      properties:
        code:
          type: string
          title: code
          description: code is the function's own error code.
        messageKey:
          type: string
          title: message_key
          description: message_key is the localisable message key (FN-022).
        params:
          type: string
          title: params
          format: byte
          description: params is a UTF-8 JSON object of message parameters.
      title: FunctionBusinessError
      additionalProperties: false
      description: |-
        FunctionBusinessError is an outcome the function's own code declares,
         surfaced to the calling action graph (FN-022).
    plux.v1.FunctionCallEvent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
        function:
          type: string
          title: function
          description: |-
            function is the dotted function name; version is the version that
             ran.
        version:
          type: integer
          title: version
        placement:
          type: string
          title: placement
          description: placement is "server" or "device" (FN-008).
        startUnixMicros:
          type: string
          title: start_unix_micros
          format: int64
        durationMicros:
          type: string
          title: duration_micros
          format: int64
        input:
          type: string
          title: input
          format: byte
          description: |-
            input and output are the redacted UTF-8 JSON values; empty when
             withheld.
        output:
          type: string
          title: output
          format: byte
        businessErrorCode:
          type: string
          title: business_error_code
          description: |-
            business_error_code is the function's own error code when it declared
             a business error (FN-022).
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
          description: error is a system error of the call (FN-022).
        replayed:
          type: boolean
          title: replayed
          description: replayed is true when the idempotency record answered (FN-021).
        logs:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.DevLogLine'
          title: logs
          description: |-
            logs are the function's log lines. For a server function the server
             merges the lines of the run into the event by trace ID, for the
             session's own app and environment only; for a device function the
             device sends its own.
      title: FunctionCallEvent
      additionalProperties: false
      description: FunctionCallEvent is one invocation of a Plux Function (FN-036).
    plux.v1.FunctionHook:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        function:
          type: string
          title: function
        alias:
          type: string
          title: alias
        verifier:
          type: string
          title: verifier
          description: verifier is "standard-webhooks" or a registered provider's name.
        enabled:
          type: boolean
          title: enabled
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: FunctionHook
      additionalProperties: false
      description: FunctionHook is an inbound webhook of a function.
    plux.v1.FunctionLogLine:
      type: object
      properties:
        time:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: time
        version:
          type: integer
          title: version
        level:
          type: string
          title: level
          description: level is "debug", "info", "warn" or "error".
        message:
          type: string
          title: message
        traceId:
          type: string
          title: trace_id
          description: trace_id links the line to the calling request's trace (FN-032).
      title: FunctionLogLine
      additionalProperties: false
      description: FunctionLogLine is one retained log line of an invocation (FN-032).
    plux.v1.FunctionServiceInvokeRequest:
      type: object
      properties:
        function:
          type: string
          title: function
          description: function is the dotted function name (FN-006).
        version:
          type: integer
          title: version
          description: version is the function version the device's release pinned (FN-006).
        input:
          type: string
          title: input
          format: byte
          description: |-
            input is the UTF-8 JSON input, validated against the input schema
             (FN-004) and bounded by `function.inputSize` (FN-011).
        idempotencyKey:
          type: string
          title: idempotency_key
          description: |-
            idempotency_key lets a retry return the stored result without running
             the function again within `function.idempotencyWindow` (FN-021).
        transactionChallengeId:
          type: string
          title: transaction_challenge_id
          description: |-
            transaction_challenge_id names the challenge that transaction_signature
             answers; required when the function declares `sca` (FN-020, SEC-027).
        transactionSignature:
          type: string
          title: transaction_signature
          format: byte
          description: |-
            transaction_signature is the signature of the device's SCA key over the
             challenge followed by the transaction summary: ES256, 64 bytes, r then
             s (SEC-027).
        appAttestAssertion:
          type: string
          title: app_attest_assertion
          format: byte
          description: |-
            app_attest_assertion is an iOS device's App Attest assertion over
             SHA-256("plux-fn-invoke-v1" || function || "@" || uint32be(version) ||
             SHA-256(input) || jti), where jti is the identifier of the request's
             DPoP proof; required when the function declares `attestation` (FN-020,
             SEC-004).
        playIntegrityToken:
          type: string
          title: play_integrity_token
          description: |-
            play_integrity_token is an Android device's Play Integrity
             standard-request token whose requestHash is that value, base64url
             without padding; required when the function declares `attestation`
             (FN-020, SEC-003).
      title: FunctionServiceInvokeRequest
      additionalProperties: false
    plux.v1.FunctionServiceInvokeResponse:
      type: object
      anyOf:
        - type: object
          properties:
            businessError:
              allOf:
                - $ref: '#/components/schemas/plux.v1.FunctionBusinessError'
              title: business_error
              description: business_error is an error the function declared itself (FN-022).
          title: business_error
        - type: object
          properties:
            output:
              type: string
              title: output
              format: byte
              description: output is the UTF-8 JSON output of the function (FN-004).
          title: output
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - businessError
              - required:
                  - output
          - not:
              oneOf:
                - required:
                    - businessError
                - required:
                    - output
      properties:
        version:
          type: integer
          title: version
          description: version is the function version that ran (FN-006).
        replayed:
          type: boolean
          title: replayed
          description: |-
            replayed is true when the response came from the idempotency record
             and the function did not run again (FN-021).
      title: FunctionServiceInvokeResponse
    plux.v1.FunctionTestResult:
      type: object
      properties:
        name:
          type: string
          title: name
        passed:
          type: boolean
          title: passed
        message:
          type: string
          title: message
          description: message explains a failure.
      title: FunctionTestResult
      additionalProperties: false
      description: FunctionTestResult is the outcome of one stored test case (FN-031).
    plux.v1.FunctionTrigger:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        function:
          type: string
          title: function
        alias:
          type: string
          title: alias
        expression:
          type: string
          title: expression
          description: expression is five cron fields, or @hourly, @daily, @weekly, @monthly.
        timezone:
          type: string
          title: timezone
          description: timezone is "UTC" or an IANA zone name.
        input:
          type: string
          title: input
          format: byte
        enabled:
          type: boolean
          title: enabled
        nextFireAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: next_fire_at
        lastFireAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_fire_at
        lastResult:
          type: string
          title: last_result
          description: 'last_result is "ok", "business_error" or "failed: PLX-<code>".'
      title: FunctionTrigger
      additionalProperties: false
      description: FunctionTrigger is a cron schedule on a function alias.
    plux.v1.FunctionVersion:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        name:
          type: string
          title: name
          description: name is the dotted function name.
        version:
          type: integer
          title: version
          description: version is the integer assigned at deploy (FN-006).
        placement:
          type: string
          title: placement
          description: placement is "server" or "device" (FN-008).
        moduleSha256:
          type: string
          title: module_sha256
          description: module_sha256 is the hex SHA-256 of the module (FN-005).
        abiVersion:
          type: integer
          title: abi_version
          description: abi_version is the host ABI version the module targets (FN-015).
        inputSchema:
          type: string
          title: input_schema
          description: input_schema is the JSON Schema derived from the input type (FN-004).
        outputSchema:
          type: string
          title: output_schema
          description: output_schema is the JSON Schema derived from the output type (FN-004).
        provenance:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Provenance'
          title: provenance
          description: provenance records how the module was built (FN-005).
        signature:
          type: string
          title: signature
          format: byte
          description: |-
            signature is the signature over the artifact statement, made with the
             function-artifact key (FN-009).
        testsPassed:
          type: boolean
          title: tests_passed
          description: tests_passed is true when every stored test case passed (FN-031).
        createdBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: FunctionVersion
      additionalProperties: false
      description: FunctionVersion is one immutable version of a function (FN-006).
    plux.v1.GetAppRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: GetAppRequest
      additionalProperties: false
    plux.v1.GetAppResponse:
      type: object
      properties:
        app:
          allOf:
            - $ref: '#/components/schemas/plux.v1.App'
          title: app
      title: GetAppResponse
      additionalProperties: false
    plux.v1.GetApprovalRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        id:
          type: string
          title: id
      title: GetApprovalRequest
      additionalProperties: false
    plux.v1.GetApprovalResponse:
      type: object
      properties:
        approval:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ApprovalRequest'
          title: approval
      title: GetApprovalResponse
      additionalProperties: false
    plux.v1.GetApprovalReviewRequest:
      type: object
      properties:
