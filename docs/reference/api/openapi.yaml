          title: environment_id
        channelKey:
          type: string
          title: channel_key
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        messageKey:
          type: string
          title: message_key
      title: SetMandatoryUpdateRequest
      additionalProperties: false
    plux.v1.SetMandatoryUpdateResponse:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ControlDocument'
          title: document
      title: SetMandatoryUpdateResponse
      additionalProperties: false
    plux.v1.SetOrganizationLimitRequest:
      type: object
