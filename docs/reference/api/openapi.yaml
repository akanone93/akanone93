          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
          description: diagnostics carries PLX-8301 for a scheduled change.
      title: SetRetentionResponse
      additionalProperties: false
    plux.v1.SetSecretRequest:
      type: object
      properties:
        environmentId:
          type: string
          title: environment_id
        key:
