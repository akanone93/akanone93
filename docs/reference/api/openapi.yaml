          format: byte
          description: image_sha256 is the SHA-256 of the PNG.
        image:
          type: string
          title: image
          format: byte
          description: image is the PNG; empty when the case matches its baseline.
      title: GoldenCase
      additionalProperties: false
      description: |-
        GoldenCase is one rendered case: a page in a frame, locale, theme and text
         scale. The case ID names all of them and is stable across runs.
    plux.v1.GoldenDifference:
      type: object
