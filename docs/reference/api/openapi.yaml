          title: locale
        theme:
          type: string
          title: theme
        textScale:
          type: number
          title: text_scale
          format: double
        imageSha256:
          type: string
          title: image_sha256
          format: byte
        baselineSha256:
          type: string
          title: baseline_sha256
          format: byte
          description: baseline_sha256 is empty for a case with no baseline yet.
      title: GoldenDifference
      additionalProperties: false
    plux.v1.GrantAccessRequest:
      type: object
