      type: object
      properties:
        appAttestKeyId:
          type: string
          title: app_attest_key_id
          format: byte
          description: app_attest_key_id is the App Attest key identifier.
        attestationObject:
          type: string
          title: attestation_object
          format: byte
          description: |-
            attestation_object is the CBOR attestation object App Attest
             returned for the challenge.
        appAttestAssertion:
          type: string
          title: app_attest_assertion
          format: byte
          description: |-
            app_attest_assertion is set only when enrolling an SCA key later
             (EnrolScaKey): an assertion over the binding hash with the App Attest
             key stored at registration, in which case app_attest_key_id and
             attestation_object are empty.
      title: IosEvidence
      additionalProperties: false
      description: IosEvidence is the proof an iOS device offers (SEC-003).
