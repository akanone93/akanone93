          title: app_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
      title: CreatePluginRequest
      additionalProperties: false
    plux.v1.CreatePluginResponse:
      type: object
      properties:
        plugin:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Plugin'
          title: plugin
      title: CreatePluginResponse
      additionalProperties: false
    plux.v1.CreateRegistrationChallengeRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
      title: CreateRegistrationChallengeRequest
      additionalProperties: false
    plux.v1.CreateRegistrationChallengeResponse:
      type: object
      properties:
        challenge:
          type: string
          title: challenge
          format: byte
          description: challenge is random, single-use and bound to the app and environment.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: expires_at is when the challenge stops being accepted.
      title: CreateRegistrationChallengeResponse
      additionalProperties: false
    plux.v1.CreateReleaseRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        pluginVersions:
          type: object
          title: plugin_versions
          additionalProperties:
            type: string
            title: value
            format: int64
          description: |-
            plugin_versions maps each plugin key to the version to include; a
             plugin left out keeps the version of the environment's last release.
        notes:
          type: string
          title: notes
        confidential:
          type: boolean
          title: confidential
          description: |-
            confidential asks for a confidential release, whose bundles are
             delivered encrypted to eligible devices (SEC-053). The environment's
             confidentialBundles setting decides whether it may be asked for
             (optional) or is implied (required); under off it is refused.
      title: CreateReleaseRequest
      additionalProperties: false
    plux.v1.CreateReleaseResponse:
      type: object
      properties:
        release:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Release'
          title: release
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: CreateReleaseResponse
      additionalProperties: false
    plux.v1.CreateRestrictionRequest:
      type: object
      properties:
        subjectKind:
          type: string
          title: subject_kind
        subjectId:
          type: string
          title: subject_id
        patterns:
          type: array
          items:
            type: string
          title: patterns
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        reason:
          type: string
          title: reason
      title: CreateRestrictionRequest
      additionalProperties: false
    plux.v1.CreateRestrictionResponse:
      type: object
      properties:
        restriction:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Restriction'
          title: restriction
      title: CreateRestrictionResponse
      additionalProperties: false
    plux.v1.CreateRoleRequest:
      type: object
      properties:
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        permissions:
          type: array
          items:
            type: string
          title: permissions
      title: CreateRoleRequest
      additionalProperties: false
    plux.v1.CreateRoleResponse:
      type: object
      properties:
        role:
          allOf:
            - $ref: '#/components/schemas/plux.v1.RoleDefinition'
          title: role
      title: CreateRoleResponse
      additionalProperties: false
    plux.v1.CreateRolloutRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channel:
          type: string
          title: channel
          description: channel defaults to production.
        candidateSequence:
          type: string
          title: candidate_sequence
          format: int64
        stages:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Stage'
          title: stages
        startAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_at
          description: start_at defaults to now.
        endAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_at
          description: end_at, when set, reverts the rollout at that time (REL-052).
        rule:
          type: string
          title: rule
          format: byte
          description: rule is a segment rule as JSON that devices must satisfy.
        segments:
          type: array
          items:
            type: string
            format: byte
          title: segments
          description: segments are segment documents as JSON; devices must satisfy every one.
        allowDevices:
          type: array
          items:
            type: string
          title: allow_devices
        denyDevices:
          type: array
          items:
            type: string
          title: deny_devices
        health:
          allOf:
            - $ref: '#/components/schemas/plux.v1.HealthGate'
          title: health
      title: CreateRolloutRequest
      additionalProperties: false
    plux.v1.CreateRolloutResponse:
      type: object
      properties:
        rollout:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Rollout'
          title: rollout
      title: CreateRolloutResponse
      additionalProperties: false
    plux.v1.CreateScimTokenRequest:
      type: object
      properties:
        name:
          type: string
          title: name
      title: CreateScimTokenRequest
      additionalProperties: false
    plux.v1.CreateScimTokenResponse:
      type: object
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ScimToken'
          title: token
        secret:
          type: string
          title: secret
          description: secret is the bearer token; it is shown once.
      title: CreateScimTokenResponse
      additionalProperties: false
    plux.v1.CreateTeamRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
      title: CreateTeamRequest
      additionalProperties: false
    plux.v1.CreateTeamResponse:
      type: object
      properties:
        team:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Team'
          title: team
      title: CreateTeamResponse
      additionalProperties: false
    plux.v1.CreateTransactionChallengeRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        dataSource:
          type: string
          title: data_source
          description: data_source names the data source or upstream the transaction is for.
        operation:
          type: string
          title: operation
          description: operation names the operation to confirm.
        transactionSummaryJcs:
          type: string
          title: transaction_summary_jcs
          format: byte
          description: |-
            transaction_summary_jcs is the RFC 8785 canonical JSON of what the
             user confirms; the server binds the challenge to its hash, so the
             confirmed transaction cannot be swapped (SEC-028).
        function:
          type: string
          title: function
          description: |-
            function names a server function whose invocation the user confirms
             (FN-020, SEC-027). When set, data_source and operation are empty,
             function_version and input_sha256 are required, and
             transaction_summary_jcs is a canonical JSON object of strings the user
             is shown; the server adds the function, the version and the input hash
             to it, and returns the result for the device to sign.
        functionVersion:
          type: integer
          title: function_version
          description: function_version is the pinned version of the function.
        inputSha256:
          type: string
          title: input_sha256
          format: byte
          description: |-
            input_sha256 is the SHA-256 of the invocation's input; the invocation
             is refused unless its input has this hash (SEC-028).
      title: CreateTransactionChallengeRequest
      additionalProperties: false
    plux.v1.CreateTransactionChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
          title: challenge_id
          description: |-
            challenge_id is what CallRequest.transaction_challenge_id
             carries back.
        challenge:
          type: string
          title: challenge
          format: byte
          description: |-
            challenge is random and single-use; the SCA key signs it together
             with the summary hash (SEC-027).
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: expires_at is when the challenge stops being accepted.
        transactionSummaryJcs:
          type: string
          title: transaction_summary_jcs
          format: byte
          description: |-
            transaction_summary_jcs is the RFC 8785 canonical JSON the challenge
             is bound to: the device's summary with the server-held values of the
             operation's display bindings merged in. The SCA key signs the
             challenge followed by these bytes (DAT-093).
        displayed:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.DisplayedValue'
          title: displayed
          description: |-
            displayed are the server-held values the confirmation sheet shows
             beside the device's own summary (DAT-093).
      title: CreateTransactionChallengeResponse
      additionalProperties: false
