      title: CreateFlagResponse
      additionalProperties: false
    plux.v1.CreateGrantRequest:
      type: object
      properties:
        userId:
          type: string
          title: user_id
          description: Exactly one of user_id and team_id is set.
        teamId:
          type: string
          title: team_id
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
      title: CreateGrantRequest
      additionalProperties: false
    plux.v1.CreateGrantResponse:
      type: object
