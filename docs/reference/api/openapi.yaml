    plux.v1.GetRootKeysRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        sinceRootVersion:
          type: string
          title: since_root_version
          format: int64
          description: |-
            since_root_version is the version of the root the caller trusts; the
             response carries every later root (SEC-051). Zero asks for them all.
      title: GetRootKeysRequest
      additionalProperties: false
    plux.v1.GetRootKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PublicKey'
          title: keys
        roots:
          type: array
          items:
            type: string
            format: byte
          title: roots
          description: |-
            roots are the root metadata files after since_root_version, oldest
             first. Each is signed by the previous root's threshold and by its own
             (SEC-051, ADR-0054); the caller verifies the chain from the root it
             embeds.
      title: GetRootKeysResponse
      additionalProperties: false
