      title: UploadAssetChunkRequest
      additionalProperties: false
    plux.v1.UploadAssetChunkResponse:
      type: object
      properties:
        received:
          type: string
          title: received
          format: int64
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: UploadAssetChunkResponse
      additionalProperties: false
    plux.v1.UploadAssetRequest:
      type: object
