    plux.v1.GetLicenseStateRequest:
      type: object
      title: GetLicenseStateRequest
      additionalProperties: false
    plux.v1.GetLicenseStateResponse:
      type: object
      properties:
        state:
          type: string
          title: state
          description: |-
            state is "absent", "valid", "grace", "expired" or "invalid". In grace
             the enterprise features keep working and warn; once expired they are
             read-only; absent and invalid leave them off. Device traffic and
             security capabilities are unaffected in every state (GOV-032).
        licenseId:
          type: string
          title: license_id
          description: |-
            license_id and organization identify a verified licence; empty
             otherwise.
        organization:
          type: string
          title: organization
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: expires_at and grace_ends_at are unset without a verified licence.
        graceEndsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: grace_ends_at
        daysRemaining:
          type: integer
          title: days_remaining
          format: int32
          description: days_remaining is the whole days until expires_at, negative in grace.
        features:
          type: array
          items:
            type: string
          title: features
          description: features are the enterprise features the licence lists.
        limits:
          type: object
          title: limits
          additionalProperties:
            type: string
            title: value
            format: int64
          description: limits are the registry limits (LIM-001) the licence caps.
        message:
          type: string
          title: message
          description: message says in one line why the state is what it is.
      title: GetLicenseStateResponse
      additionalProperties: false
    plux.v1.GetLiveConfigRequest:
      type: object
      title: GetLiveConfigRequest
      additionalProperties: false
    plux.v1.GetLiveConfigResponse:
      type: object
      properties:
        version:
          type: string
          title: version
          format: int64
          description: |-
            version is the live-configuration version of this snapshot: the
             epoch at which a live value last changed. The device sends it in
             Plux-Config-Version with every gateway call (DAT-096).
        epoch:
          type: string
          title: epoch
          format: int64
          description: |-
            epoch is the environment's configuration epoch when the snapshot was
             read. A gateway response with a greater Plux-Config-Epoch tells the
             device to fetch again (DAT-095).
        values:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.LiveConfigValue'
          title: values
      title: GetLiveConfigResponse
      additionalProperties: false
