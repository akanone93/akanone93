components:
  schemas:
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    plux.v1.AbortRolloutRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        reason:
          type: string
          title: reason
      title: AbortRolloutRequest
      additionalProperties: false
    plux.v1.AbortRolloutResponse:
      type: object
      properties:
        rollout:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Rollout'
          title: rollout
      title: AbortRolloutResponse
      additionalProperties: false
    plux.v1.AcceptInvitationRequest:
      type: object
      properties:
        invitation:
          type: string
          title: invitation
        displayName:
          type: string
          title: display_name
        password:
          type: string
          title: password
      title: AcceptInvitationRequest
      additionalProperties: false
    plux.v1.AcceptInvitationResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/plux.v1.User'
          title: user
      title: AcceptInvitationResponse
      additionalProperties: false
    plux.v1.AccessGrant:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        teamId:
          type: string
          title: team_id
          description: Exactly one of team_id and user_id is set.
        userId:
          type: string
          title: user_id
        role:
          type: string
          title: role
        grantedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: granted_at
      title: AccessGrant
      additionalProperties: false
      description: AccessGrant is a role on one app held by a team or a user (GOV-001).
    plux.v1.AccessToken:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        userId:
          type: string
          title: user_id
          description: user_id is empty for a token exchanged from a CI identity.
        organizationId:
          type: string
          title: organization_id
        scopes:
          type: array
          items:
            type: string
          title: scopes
        prefix:
          type: string
          title: prefix
          description: prefix is the token's visible prefix, for recognising it in a list.
        source:
          type: string
          title: source
          description: source is "pat", "cli" or "ci".
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_used_at
        revokedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: revoked_at
      title: AccessToken
      additionalProperties: false
      description: AccessToken is a scoped, expiring, revocable credential (SRV-064).
    plux.v1.AcquireLockRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        session:
          type: string
          title: session
        force:
          type: boolean
          title: force
          description: |-
            force takes the lock from its holder; it needs plugin.lock.override,
             snapshots the holder's unsaved work and is audited (SRV-041).
        scope:
          type: string
          title: scope
          description: |-
            scope names a locale lock, "translations/<locale>"; empty is the draft
             lock (I18N-008).
      title: AcquireLockRequest
      additionalProperties: false
    plux.v1.AcquireLockResponse:
      type: object
      properties:
        lock:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Lock'
          title: lock
        preservedSnapshotId:
          type: string
          title: preserved_snapshot_id
          description: preserved_snapshot_id is set when force took the lock.
      title: AcquireLockResponse
      additionalProperties: false
    plux.v1.ActionStepTrace:
      type: object
      properties:
        stepId:
          type: string
          title: step_id
          description: step_id is the step's identifier in its graph.
        action:
          type: string
          title: action
          description: |-
            action is the action the step ran, such as "navigate" or a custom
             action's name.
        branch:
          type: string
          title: branch
          description: |-
            branch is the branch of the graph the step is on: "main", "then",
             "else", "case:<label>", "onError", "finally", or "parallel:<n>".
        status:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevRunStatus'
          title: status
        startUnixMicros:
          type: string
          title: start_unix_micros
          format: int64
        durationMicros:
          type: string
          title: duration_micros
          format: int64
        inputs:
          type: string
          title: inputs
          format: byte
          description: |-
            inputs and outputs are the UTF-8 JSON values of the step with every
             sensitive field replaced by a placeholder (ACT-031). Empty when the
             step has none or the size limit withheld them.
        outputs:
          type: string
          title: outputs
          format: byte
        truncated:
          type: boolean
          title: truncated
          description: |-
            truncated is true when inputs or outputs were cut to fit
             `devtools.eventBytes`.
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
      title: ActionStepTrace
      additionalProperties: false
      description: ActionStepTrace is one step of an action run.
    plux.v1.ActionTraceEvent:
      type: object
      properties:
        runId:
          type: string
          title: run_id
        graph:
          type: string
          title: graph
          description: graph names the action graph or the flow that ran.
        trigger:
          type: string
          title: trigger
          description: |-
            trigger is what started the run: an event name, "lifecycle", "timer",
             "deep_link" or "command".
        nodePath:
          type: string
          title: node_path
          description: node_path is the node whose event started the run, when one did.
        status:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevRunStatus'
          title: status
        startUnixMicros:
          type: string
          title: start_unix_micros
          format: int64
        endUnixMicros:
          type: string
          title: end_unix_micros
          format: int64
        steps:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ActionStepTrace'
          title: steps
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
          description: error is the failure that ended the run, when one did.
      title: ActionTraceEvent
      additionalProperties: false
      description: |-
        ActionTraceEvent is the trace of one action run: the process flow of
         ACT-030. A device sends it when the run ends, and may send earlier
         versions with status RUNNING while it is under way; a later event of the
         same run_id replaces an earlier one.
    plux.v1.Actor:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: kind is "user", "token", "device", "system" or "ci".
        id:
          type: string
          title: id
        display:
          type: string
          title: display
          description: display is a human-readable name; never an email address.
      title: Actor
      additionalProperties: false
      description: Actor is who performed an action.
    plux.v1.AddMemberRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
        teamId:
          type: string
          title: team_id
        email:
          type: string
          title: email
        role:
          type: string
          title: role
      title: AddMemberRequest
      additionalProperties: false
    plux.v1.AddMemberResponse:
      type: object
      properties:
        member:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Member'
          title: member
        invitation:
          type: string
          title: invitation
          description: |-
            invitation is set when the account was created; it is returned
             exactly once and expires after seven days.
      title: AddMemberResponse
      additionalProperties: false
    plux.v1.AlertRule:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        name:
          type: string
          title: name
        metric:
          type: string
          title: metric
          description: metric is an event name, such as render_perf or fatal_error.
        environment:
          type: string
          title: environment
          description: environment is an environment key; empty for all.
        filters:
          type: object
          title: filters
          additionalProperties:
            type: string
            title: value
          description: |-
            filters maps a rollup dimension (release, plugin, page, device_class,
             locale) to the value a series must have.
        aggregation:
          type: string
          title: aggregation
          description: aggregation is count, sum, avg, min, max, p50, p90 or p99.
        windowSeconds:
          type: integer
          title: window_seconds
          format: int32
        comparison:
          type: string
          title: comparison
          description: comparison is >, >=, < or <=.
        threshold:
          type: number
          title: threshold
          format: double
        forSeconds:
          type: integer
          title: for_seconds
          format: int32
        severity:
          type: string
          title: severity
          description: severity is info, warning or critical.
        disabled:
          type: boolean
          title: disabled
          description: disabled stops the rule being evaluated; its state is kept.
        revision:
          type: string
          title: revision
          format: int64
        updatedBy:
          type: string
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: AlertRule
      additionalProperties: false
      description: |-
        AlertRule is a condition on a rollup metric (ANL-030). The aggregation of
         the metric over the window is compared with the threshold; the rule fires
         when the comparison has held for for_seconds.
    plux.v1.AlertState:
      type: object
      properties:
        ruleId:
          type: string
          title: rule_id
        appId:
          type: string
          title: app_id
        ruleName:
          type: string
          title: rule_name
        state:
          type: string
          title: state
          description: state is ok, pending, firing or resolved.
        since:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: since
          description: since is when the state began.
        evaluatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: evaluated_at
        value:
          type:
            - number
            - "null"
          title: value
          format: double
          description: value is the aggregation at the last evaluation; unset without data.
        firedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: fired_at
        resolvedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: resolved_at
      title: AlertState
      additionalProperties: false
      description: AlertState is where a rule stands.
    plux.v1.Alias:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name matches `^[a-z][a-z0-9-]*$`.
        version:
          type: integer
          title: version
      title: Alias
      additionalProperties: false
      description: Alias points a name at a version of a function (FN-006).
    plux.v1.AndroidEvidence:
      type: object
      properties:
        keyAttestationChain:
          type: array
          items:
            type: string
            format: byte
          title: key_attestation_chain
          description: |-
            key_attestation_chain is the X.509 certificate chain of the Android
             Key Attestation for the DPoP key, leaf first, DER-encoded.
        playIntegrityToken:
          type: string
          title: play_integrity_token
          description: |-
            play_integrity_token is the Play Integrity verdict token, bound to
             the challenge.
      title: AndroidEvidence
      additionalProperties: false
      description: AndroidEvidence is the proof an Android device offers (SEC-003).
    plux.v1.App:
      type: object
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        defaultPluginKey:
          type: string
          title: default_plugin_key
          description: default_plugin_key is the plugin whose entry page the app opens.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: App
      additionalProperties: false
    plux.v1.ApprovalDecision:
      type: object
      properties:
        id:
          type: string
          title: id
        deciderId:
          type: string
          title: decider_id
        decider:
          type: string
          title: decider
        decision:
          type: string
          title: decision
          description: decision is "approve" or "reject".
        comment:
          type: string
          title: comment
        contentHash:
          type: string
          title: content_hash
        decidedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: decided_at
        payload:
          type: string
          title: payload
          format: byte
          description: payload is the canonical record the signature covers.
        keyId:
          type: string
          title: key_id
          description: key_id and signature are empty until the worker has signed the record.
        signature:
          type: string
          title: signature
          format: byte
        auditSequence:
          type: string
          title: audit_sequence
          format: int64
      title: ApprovalDecision
      additionalProperties: false
      description: ApprovalDecision is one signed record of a decision (GOV-023).
    plux.v1.ApprovalRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        resource:
          type: string
          title: resource
          description: resource is the kind of artifact, as in the policy schema.
        action:
          type: string
          title: action
        subject:
          type: string
          title: subject
          description: subject names what changes, for example "release:12".
        contentHash:
          type: string
          title: content_hash
          description: content_hash is what an approval is bound to (GOV-022), in hex.
        summary:
          type: string
          title: summary
        risk:
          type: array
          items:
            type: string
          title: risk
        status:
          type: string
          title: status
          description: |-
            status is "open", "approved", "rejected", "expired", "superseded" or
             "used".
        requestedBy:
          type: string
          title: requested_by
        policyKeys:
          type: array
          items:
            type: string
          title: policy_keys
        approvalsRequired:
          type: integer
          title: approvals_required
          format: int32
          description: approvals_required is the most approvals any matching policy asks for.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ApprovalDecision'
          title: decisions
      title: ApprovalRequest
      additionalProperties: false
      description: ApprovalRequest asks for the approval of one artifact.
    plux.v1.ApproveDeviceAuthorizationRequest:
      type: object
      properties:
        userCode:
          type: string
          title: user_code
        organizationId:
          type: string
          title: organization_id
      title: ApproveDeviceAuthorizationRequest
      additionalProperties: false
    plux.v1.ApproveDeviceAuthorizationResponse:
      type: object
      title: ApproveDeviceAuthorizationResponse
      additionalProperties: false
    plux.v1.ApproveRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        runId:
          type: string
          title: run_id
        caseIds:
          type: array
          items:
            type: string
          title: case_ids
          description: case_ids are the cases to approve; empty approves every difference.
      title: ApproveRequest
      additionalProperties: false
    plux.v1.ApproveResponse:
      type: object
      properties:
        approvedCaseIds:
          type: array
          items:
            type: string
          title: approved_case_ids
      title: ApproveResponse
      additionalProperties: false
    plux.v1.Artifact:
      type: object
      properties:
        sha256:
          type: string
          title: sha256
          description: sha256 is the hash of the artifact's bytes, lower-case hex.
        size:
          type: string
          title: size
          format: int64
        urls:
          type: array
          items:
            type: string
          title: urls
          description: urls are the locations to fetch it from, most preferred first.
        mediaType:
          type: string
          title: media_type
          description: media_type is the artifact's media type.
      title: Artifact
      additionalProperties: false
      description: Artifact is a stored, content-addressed object (SRV-023, REL-024).
    plux.v1.Asset:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id is empty for an app-level asset.
        name:
          type: string
          title: name
        mediaType:
          type: string
          title: media_type
          description: media_type is what sniffing determined, not what the caller claimed.
        size:
          type: string
          title: size
          format: int64
        sha256:
          type: string
          title: sha256
        width:
          type: integer
          title: width
          format: int32
          description: width and height are set for raster and vector images.
        height:
          type: integer
          title: height
          format: int32
        variants:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.AssetVariant'
          title: variants
          description: variants are the processed forms, such as WebP at 1x, 2x and 3x.
        processing:
          type: string
          title: processing
          description: processing is "pending", "ready" or "failed".
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
        uploadedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: uploaded_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Asset
      additionalProperties: false
    plux.v1.AssetVariant:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: kind is "webp", "avif", "png", "dotlottie", "original" or "vector".
        density:
          type: integer
          title: density
          format: int32
          description: density is 1, 2 or 3 for raster variants; zero otherwise.
        artifact:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Artifact'
          title: artifact
        width:
          type: integer
          title: width
          format: int32
        height:
          type: integer
          title: height
          format: int32
      title: AssetVariant
      additionalProperties: false
      description: AssetVariant is one processed form of an asset (CMP-030, CMP-033).
    plux.v1.AttestationEvidence:
      type: object
      anyOf:
        - type: object
          properties:
            android:
              allOf:
                - $ref: '#/components/schemas/plux.v1.AndroidEvidence'
              title: android
          title: android
        - type: object
          properties:
            development:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DevelopmentEvidence'
              title: development
          title: development
        - type: object
          properties:
            ios:
              allOf:
                - $ref: '#/components/schemas/plux.v1.IosEvidence'
              title: ios
          title: ios
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - android
              - required:
                  - development
              - required:
                  - ios
          - not:
              oneOf:
                - required:
                    - android
                - required:
                    - development
                - required:
                    - ios
      title: AttestationEvidence
      description: |-
        AttestationEvidence is the platform evidence for one key: exactly one
         of the provider forms (SEC-003, SEC-004).
    plux.v1.AttestationSummary:
      type: object
      properties:
        provider:
          type: string
          title: provider
          description: |-
            provider is "key_attestation", "play_integrity", "app_attest" or
             "development".
        verifiedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: verified_at
          description: verified_at is when the server last verified the evidence.
        verdicts:
          type: array
          items:
            type: string
          title: verdicts
          description: |-
            verdicts are the provider's verdicts the server accepted, such as
             "MEETS_STRONG_INTEGRITY".
        riskMetric:
          type: integer
          title: risk_metric
          format: int32
          description: |-
            risk_metric is the provider's risk figure, such as App Attest's
             receipt risk metric; zero when the provider reports none.
      title: AttestationSummary
      additionalProperties: false
      description: |-
        AttestationSummary is what the server keeps of a verified attestation
         (SEC-003). It carries verdicts, never the raw evidence.
    plux.v1.AuditCheckpoint:
      type: object
      properties:
        sequence:
          type: string
          title: sequence
          format: int64
          description: |-
            sequence is the sequence number of the last entry the checkpoint
             covers.
        entryHash:
          type: string
          title: entry_hash
          format: byte
          description: entry_hash is the chain hash at that entry.
        signature:
          type: string
          title: signature
          format: byte
          description: signature signs sequence and entry_hash.
        keyId:
          type: string
          title: key_id
          description: key_id identifies the audit signing key.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: AuditCheckpoint
      additionalProperties: false
      description: |-
        AuditCheckpoint is a signed point in the audit log's hash chain
         (SEC-141).
    plux.v1.AuditEntry:
      type: object
      properties:
        id:
          type: string
          title: id
        time:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: time
        actor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: actor
        action:
          type: string
          title: action
          description: action is the registered action name, such as "plugin.lock.override".
        targetKind:
          type: string
          title: target_kind
          description: target_kind and target_id identify what the action was performed on.
        targetId:
          type: string
          title: target_id
        sourceIp:
          type: string
          title: source_ip
        userAgent:
          type: string
          title: user_agent
        requestId:
          type: string
          title: request_id
        beforeHash:
          type: string
          title: before_hash
          description: before_hash and after_hash are SHA-256 of the affected content.
        afterHash:
          type: string
          title: after_hash
      title: AuditEntry
      additionalProperties: false
      description: AuditEntry is one record of the append-only audit log (SEC-140).
    plux.v1.BeginAssetUploadRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        name:
          type: string
          title: name
        session:
          type: string
          title: session
        size:
          type: string
          title: size
          format: int64
          description: size is the byte length of the whole file.
        sha256:
          type: string
          title: sha256
          format: byte
          description: sha256 is the digest of the whole file, 32 bytes.
      title: BeginAssetUploadRequest
      additionalProperties: false
    plux.v1.BeginAssetUploadResponse:
      type: object
      properties:
        uploadId:
          type: string
          title: upload_id
        chunkSize:
          type: string
          title: chunk_size
          format: int64
          description: chunk_size is the largest chunk the server accepts.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: BeginAssetUploadResponse
      additionalProperties: false
    plux.v1.BeginStepUpRequest:
      type: object
      properties:
        cliRequestId:
          type: string
          title: cli_request_id
          description: |-
            cli_request_id names a step-up the CLI asked for with
             POST /stepup/requests, which the caller's browser session performs
             for it (ADR-0075). Empty steps up the caller's own session.
      title: BeginStepUpRequest
      additionalProperties: false
    plux.v1.BeginStepUpResponse:
      type: object
      properties:
        requestId:
          type: string
          title: request_id
          description: request_id names the step-up for CompleteStepUp.
        optionsJson:
          type: string
          title: options_json
          description: |-
            options_json is PublicKeyCredentialRequestOptions in WebAuthn's JSON
             serialisation, with user verification required.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: BeginStepUpResponse
      additionalProperties: false
