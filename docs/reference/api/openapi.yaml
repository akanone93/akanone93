    plux.v1.SetForcedRollbackRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        breakGlass:
          type: boolean
          title: break_glass
          description: |-
            break_glass runs the change as an emergency action without the freeze
             and approval checks, and needs breakglass.invoke on the environment with
             a fresh step-up (GOV-024, SEC-103). justification is then required
             (PLX-8005); it is refused without break_glass.
        justification:
          type: string
          title: justification
      title: SetForcedRollbackRequest
      additionalProperties: false
    plux.v1.SetForcedRollbackResponse:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ControlDocument'
