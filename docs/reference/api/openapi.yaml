          title: key
        value:
          type: string
          title: value
      title: SetSecretRequest
      additionalProperties: false
    plux.v1.SetSecretResponse:
      type: object
      properties:
        secret:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Secret'
          title: secret
      title: SetSecretResponse
      additionalProperties: false
    plux.v1.SetSecurityConfigRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        profile:
          type: string
          title: profile
          description: profile names the security profile, such as "maximum" (SEC-180).
        overridesJson:
          type: string
          title: overrides_json
          format: byte
          description: |-
            overrides_json is a JSON object of settings that differ from the
             profile (SEC-181).
        expectedVersion:
          type: string
          title: expected_version
          format: int64
          description: |-
            expected_version is the version the caller read; zero for an
             environment with no configuration yet.
      title: SetSecurityConfigRequest
      additionalProperties: false
    plux.v1.SetSecurityConfigResponse:
      type: object
      properties:
        version:
          type: string
          title: version
          format: int64
          description: version is the new configuration version.
      title: SetSecurityConfigResponse
      additionalProperties: false
    plux.v1.SetStateCommand:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: scope is "app", "page:<route>" or "component:<node path>".
        path:
          type: string
          title: path
        value:
          type: string
          title: value
          format: byte
          description: value is the UTF-8 JSON value.
      title: SetStateCommand
      additionalProperties: false
      description: |-
        SetStateCommand sets a state value (DEV-031). The device refuses a path
         tagged sensitive (PLX-9206).
    plux.v1.SetStatesRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        locale:
          type: string
          title: locale
        states:
          type: object
          title: states
          additionalProperties:
            type: string
            title: value
          description: |-
            states maps a translation key identifier to a review state: "new",
             "translated", "reviewed" or "approved".
      title: SetStatesRequest
      additionalProperties: false
    plux.v1.SetStatesResponse:
      type: object
      properties:
        changedKeys:
          type: array
          items:
            type: string
          title: changed_keys
      title: SetStatesResponse
      additionalProperties: false
    plux.v1.SetUserIdentityProviderRequest:
      type: object
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/plux.v1.UserIdentityProvider'
          title: provider
      title: SetUserIdentityProviderRequest
      additionalProperties: false
    plux.v1.SetUserIdentityProviderResponse:
      type: object
      title: SetUserIdentityProviderResponse
      additionalProperties: false
    plux.v1.SetVariableRequest:
      type: object
      properties:
        environmentId:
          type: string
          title: environment_id
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: SetVariableRequest
      additionalProperties: false
    plux.v1.SetVariableResponse:
      type: object
      properties:
        variable:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Variable'
          title: variable
      title: SetVariableResponse
      additionalProperties: false
    plux.v1.Severity:
      type: string
      title: Severity
      enum:
        - SEVERITY_UNSPECIFIED
        - SEVERITY_INFO
        - SEVERITY_WARNING
        - SEVERITY_ERROR
      description: Severity of a diagnostic (ADR-0018).
    plux.v1.SignInProvider:
      type: object
      properties:
        id:
          type: string
          title: id
        key:
          type: string
          title: key
          description: key names the provider within its organisation or the installation.
        kind:
          type: string
          title: kind
          description: kind is "oidc" or "saml".
        name:
          type: string
          title: name
        organizationKey:
          type: string
          title: organization_key
          description: organization_key is empty for a provider of the installation.
      title: SignInProvider
      additionalProperties: false
      description: SignInProvider is a provider as the sign-in page shows it.
    plux.v1.Signature:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
          description: key_id identifies the public key.
        algorithm:
          type: string
          title: algorithm
          description: algorithm names the scheme, such as "ed25519" (SEC-122).
        signature:
          type: string
          title: signature
          format: byte
      title: Signature
      additionalProperties: false
      description: Signature is one signature over a signed document (ADR-0004).
    plux.v1.SimulateSecurityDetectionCommand:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSecurityDetectionKind'
          title: kind
      title: SimulateSecurityDetectionCommand
      additionalProperties: false
      description: |-
        SimulateSecurityDetectionCommand makes `plux_security` report a
         detection, to try the app's response to it (SEC-071).
    plux.v1.Snapshot:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        revision:
          type: string
          title: revision
          format: int64
        reason:
          type: string
          title: reason
          description: reason is "write", "lock_takeover", "publish" or "restore".
        paths:
          type: array
          items:
            type: string
          title: paths
          description: paths lists the documents this snapshot recorded.
        actor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: actor
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        editorSessionId:
          type: string
          title: editor_session_id
          description: |-
            editor_session_id is the editor session of the write that made this
             snapshot; empty for writes outside Studio (ADR-0095).
      title: Snapshot
      additionalProperties: false
      description: Snapshot is one entry of the append-only history (SRV-031).
    plux.v1.Stage:
      type: object
      properties:
        basisPoints:
          type: integer
          title: basis_points
          format: int32
          description: |-
            basis_points is the share of devices offered the candidate, in 1/10000;
             it never decreases from one stage to the next.
        durationSeconds:
          type: string
          title: duration_seconds
          format: int64
          description: |-
            duration_seconds is how long the stage lasts before the next begins. The
             last stage has none unless it is 10000: a full rollout soaks for its
             duration and is then promoted; a last stage below 10000 holds until the
             rollout ends.
      title: Stage
      additionalProperties: false
      description: Stage is one step of a rollout's schedule.
    plux.v1.StartDeviceAuthorizationRequest:
      type: object
      properties:
        client:
          type: string
          title: client
          description: client is the calling program, such as "plux-cli".
        scopes:
          type: array
          items:
            type: string
          title: scopes
          description: |-
            scopes are the permissions the token will carry; empty asks for the
             approving user's own.
      title: StartDeviceAuthorizationRequest
      additionalProperties: false
    plux.v1.StartDeviceAuthorizationResponse:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
        userCode:
          type: string
          title: user_code
        verificationUri:
          type: string
          title: verification_uri
        verificationUriComplete:
          type: string
          title: verification_uri_complete
        intervalSeconds:
          type: integer
          title: interval_seconds
          format: int32
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: StartDeviceAuthorizationResponse
      additionalProperties: false
    plux.v1.StartExperimentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        layerSharePercent:
          type: number
          title: layer_share_percent
          format: double
          description: |-
            layer_share_percent is the share of the experiment's layer to take, above
             0 and up to 100; zero takes the whole layer.
      title: StartExperimentRequest
      additionalProperties: false
    plux.v1.StartExperimentResponse:
      type: object
      properties:
        experiment:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Experiment'
          title: experiment
      title: StartExperimentResponse
      additionalProperties: false
    plux.v1.StartOidcLoginRequest:
      type: object
      properties:
        providerId:
          type: string
          title: provider_id
          description: |-
            provider_id is the provider the person chose from
             FederationService.ListSignInProviders. Empty selects the provider in
             the server's configuration file.
      title: StartOidcLoginRequest
      additionalProperties: false
    plux.v1.StartOidcLoginResponse:
      type: object
      properties:
        url:
          type: string
          title: url
          description: url is the provider's authorization URL.
        state:
          type: string
          title: state
          description: |-
            state is returned by the provider with the code; Studio keeps it
             until the callback.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: StartOidcLoginResponse
      additionalProperties: false
    plux.v1.StartPasswordLoginRequest:
      type: object
      properties:
        email:
          type: string
          title: email
        password:
          type: string
          title: password
      title: StartPasswordLoginRequest
      additionalProperties: false
    plux.v1.StartPasswordLoginResponse:
      type: object
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Session'
          title: session
        challenge:
          allOf:
            - $ref: '#/components/schemas/plux.v1.MfaChallenge'
          title: challenge
      title: StartPasswordLoginResponse
      additionalProperties: false
    plux.v1.StartSamlLoginRequest:
      type: object
      properties:
        providerId:
          type: string
          title: provider_id
      title: StartSamlLoginRequest
      additionalProperties: false
    plux.v1.StartSamlLoginResponse:
      type: object
      properties:
        url:
          type: string
          title: url
          description: url is where the browser goes to sign in.
        state:
          type: string
          title: state
          description: state is the relay state; Studio keeps it for the callback.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: StartSamlLoginResponse
      additionalProperties: false
    plux.v1.StateChange:
      type: object
      properties:
        path:
          type: string
          title: path
          description: path is the path inside the scope, in the notation of the state model.
        oldValue:
          type: string
          title: old_value
          format: byte
          description: |-
            old_value and new_value are UTF-8 JSON values. Both are empty when the
             path is sensitive or the diff was cut; `redacted` says which.
        newValue:
          type: string
          title: new_value
          format: byte
        redacted:
          type: boolean
          title: redacted
          description: |-
            redacted is true when the path is tagged sensitive and its values were
             withheld (SCH-012).
      title: StateChange
      additionalProperties: false
      description: StateChange is one changed path of a state scope.
    plux.v1.StateDiffEvent:
      type: object
      properties:
        scope:
          type: string
          title: scope
          description: scope is "app", "page:<route>", "component:<node path>" or "form:<id>".
        changes:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.StateChange'
          title: changes
        truncated:
          type: boolean
          title: truncated
          description: |-
            truncated is true when the diff exceeded `devtools.stateDiffBytes`:
             `changes` then names the changed paths and carries no values.
        runId:
          type: string
          title: run_id
          description: run_id is the action run that caused the change, when one did.
      title: StateDiffEvent
      additionalProperties: false
      description: StateDiffEvent reports a change of state in one scope.
    plux.v1.StopExperimentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: StopExperimentRequest
      additionalProperties: false
    plux.v1.StopExperimentResponse:
      type: object
      properties:
        experiment:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Experiment'
          title: experiment
      title: StopExperimentResponse
      additionalProperties: false
    plux.v1.StoreCount:
      type: object
      properties:
        store:
          type: string
          title: store
        rows:
          type: string
          title: rows
          format: int64
      title: StoreCount
      additionalProperties: false
      description: StoreCount is the number of rows a store held for a subject.
    plux.v1.StudioEventsServiceWatchRequest:
      type: object
      properties:
        cursor:
          type: string
          title: cursor
          description: cursor is the cursor of the last event the tab saw; empty starts now.
      title: StudioEventsServiceWatchRequest
      additionalProperties: false
    plux.v1.StudioEventsServiceWatchResponse:
      type: object
      anyOf:
        - type: object
          properties:
            document:
              allOf:
                - $ref: '#/components/schemas/plux.v1.DocumentChanged'
              title: document
          title: document
        - type: object
          properties:
            heartbeat:
              allOf:
                - $ref: '#/components/schemas/plux.v1.StudioHeartbeat'
              title: heartbeat
          title: heartbeat
        - type: object
          properties:
            inbox:
              allOf:
                - $ref: '#/components/schemas/plux.v1.InboxChanged'
              title: inbox
          title: inbox
        - type: object
          properties:
            lock:
              allOf:
                - $ref: '#/components/schemas/plux.v1.LockChanged'
              title: lock
          title: lock
        - type: object
          properties:
            reset:
              allOf:
                - $ref: '#/components/schemas/plux.v1.StudioReset'
              title: reset
          title: reset
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - document
              - required:
                  - heartbeat
              - required:
                  - inbox
              - required:
                  - lock
              - required:
                  - reset
          - not:
              oneOf:
                - required:
                    - document
                - required:
                    - heartbeat
                - required:
                    - inbox
                - required:
                    - lock
                - required:
                    - reset
      properties:
        cursor:
          type: string
          title: cursor
          description: cursor resumes the stream after this event.
      title: StudioEventsServiceWatchResponse
    plux.v1.StudioHeartbeat:
      type: object
      title: StudioHeartbeat
      additionalProperties: false
      description: StudioHeartbeat keeps an idle stream alive.
    plux.v1.StudioReset:
      type: object
      title: StudioReset
      additionalProperties: false
      description: |-
        StudioReset: events after the cursor were trimmed; reload state, then
         resume from cursor.
    plux.v1.SubjectKind:
      type: string
      title: SubjectKind
      enum:
        - SUBJECT_KIND_UNSPECIFIED
        - SUBJECT_KIND_DEVICE
        - SUBJECT_KIND_USER
      description: SubjectKind says what a subject identifier names.
    plux.v1.SubscribeRequest:
      type: object
      properties:
        subscription:
          allOf:
            - $ref: '#/components/schemas/plux.v1.NotificationSubscription'
          title: subscription
      title: SubscribeRequest
      additionalProperties: false
    plux.v1.SubscribeResponse:
      type: object
      properties:
        subscription:
          allOf:
            - $ref: '#/components/schemas/plux.v1.NotificationSubscription'
          title: subscription
      title: SubscribeResponse
      additionalProperties: false
    plux.v1.SwitchMockCommand:
      type: object
      properties:
        source:
          type: string
          title: source
        state:
          type: string
          title: state
      title: SwitchMockCommand
      additionalProperties: false
      description: SwitchMockCommand switches a data-source mock and its state (DAT-080).
    plux.v1.SyncEvent:
      type: object
      properties:
        phase:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSyncPhase'
          title: phase
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
          description: release_sequence is the release the sync is about; zero when unknown.
        plugin:
          type: string
          title: plugin
          description: plugin is the plugin key the stage is about; empty for the whole sync.
        delta:
          type: boolean
          title: delta
          description: delta is true when a binary delta is used instead of a full bundle.
        bytesTransferred:
          type: string
          title: bytes_transferred
          format: int64
        durationMicros:
          type: string
          title: duration_micros
          format: int64
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
      title: SyncEvent
      additionalProperties: false
      description: SyncEvent reports a stage of a sync (SYN-010).
    plux.v1.SyncStep:
      type: object
      properties:
        action:
          type: string
          title: action
          description: action is "keep", "delta" or "full".
        from:
          type: string
          title: from
          description: from is the installed bundle hash the delta applies to.
        url:
          type: string
          title: url
          description: url is the delta or full bundle to fetch.
        size:
          type: string
          title: size
          format: int64
          description: size is what the device downloads.
      title: SyncStep
      additionalProperties: false
      description: SyncStep tells the device how to obtain one bundle (REL-032).
    plux.v1.Team:
      type: object
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Team
      additionalProperties: false
    plux.v1.Template:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
          description: app_id is empty for a template built into the installation.
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        kind:
          type: string
          title: kind
          description: kind is "page" or "flow".
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.TemplateParameter'
          title: parameters
          description: parameters the template asks for when instantiated.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Template
      additionalProperties: false
    plux.v1.TemplateParameter:
      type: object
      properties:
        name:
          type: string
          title: name
        type:
          type: string
          title: type
          description: type is a document-model type string, such as "string" or "int".
        required:
          type: boolean
          title: required
        description:
          type: string
          title: description
      title: TemplateParameter
      additionalProperties: false
