          title: role
        scope:
          type: string
          title: scope
          description: scope is "organization", "app" or "environment".
        app:
          type: string
          title: app
          description: app and environment are keys.
        environment:
          type: string
          title: environment
      title: GrantRule
      additionalProperties: false
      description: GrantRule is one grant a mapping rule gives.
    plux.v1.GroupMapping:
      type: object
      properties:
        groupsClaim:
          type: string
          title: groups_claim
          description: |-
            groups_claim is the claim (OpenID Connect) or attribute (SAML) that
             carries the groups; empty selects "groups".
        rules:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.MappingRule'
          title: rules
      title: GroupMapping
      additionalProperties: false
      description: GroupMapping is a provider's mapping document.
    plux.v1.HealthAction:
      type: string
      title: HealthAction
      enum:
        - HEALTH_ACTION_UNSPECIFIED
        - HEALTH_ACTION_PAUSE
        - HEALTH_ACTION_ROLLBACK
      description: HealthAction says what a failed health gate does.
    plux.v1.HealthGate:
      type: object
      properties:
        minSample:
          type: string
          title: min_sample
          format: int64
          description: |-
            min_sample is the fewest sessions both releases need in the window
             before a verdict is made; zero is the server's default.
        windowSeconds:
          type: string
          title: window_seconds
          format: int64
          description: window_seconds is how far back the comparison reaches; zero is six hours.
        maxCrashFreeDropBasisPoints:
          type: integer
          title: max_crash_free_drop_basis_points
          format: int32
        maxErrorRateIncreaseBasisPoints:
          type: integer
          title: max_error_rate_increase_basis_points
          format: int32
        maxActionErrorRateIncreaseBasisPoints:
          type: integer
          title: max_action_error_rate_increase_basis_points
          format: int32
        maxFunctionErrorRateIncreaseBasisPoints:
          type: integer
          title: max_function_error_rate_increase_basis_points
          format: int32
        custom:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.CustomMetricGate'
          title: custom
        action:
          allOf:
            - $ref: '#/components/schemas/plux.v1.HealthAction'
          title: action
          description: action is what a failed gate does; unspecified is pause.
      title: HealthGate
      additionalProperties: false
      description: |-
        HealthGate compares the candidate with the previous release (REL-053). A
         threshold of zero switches its check off; every drop and increase is
         absolute, in basis points (1/10000) of the rate.
    plux.v1.HostBuild:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        hostBuild:
          type: string
          title: host_build
          description: |-
            host_build is the string the build's devices report as
             PluxConfig.hostBuild, such as "1.4.0+52".
        sha256:
          type: string
          title: sha256
          description: sha256 is the hex SHA-256 of the canonical catalogue (RFC 8785).
        uploadedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: uploaded_by
        uploadedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: uploaded_at
        devices:
          type: string
          title: devices
          format: int64
          description: devices is how many registered devices report this build.
      title: HostBuild
      additionalProperties: false
      description: HostBuild is one build of the host app with its native catalogue.
    plux.v1.HotApplyEvent:
      type: object
      properties:
        bundleSha256:
          type: string
          title: bundle_sha256
          description: |-
            bundle_sha256 is the hash of the development bundle that was applied,
             lower-case hex.
        pagesApplied:
          type: array
          items:
            type: string
          title: pages_applied
          description: pages_applied are the pages (routes) that were replaced.
        scopesReset:
          type: array
          items:
            type: string
          title: scopes_reset
          description: |-
            scopes_reset are the state scopes that were reset because the new
             state schema was incompatible (PLX-9231); the others were kept.
        applyMicros:
          type: string
          title: apply_micros
          format: int64
          description: |-
            apply_micros is the time from the device's receipt of the bundle until
             the new tree was on screen.
      title: HotApplyEvent
      additionalProperties: false
      description: HotApplyEvent reports a hot apply of a pushed patch (DEV-010).
    plux.v1.IdentityProvider:
      type: object
      anyOf:
        - type: object
          properties:
            oidc:
              allOf:
                - $ref: '#/components/schemas/plux.v1.OidcProviderConfig'
              title: oidc
          title: oidc
        - type: object
          properties:
            saml:
              allOf:
                - $ref: '#/components/schemas/plux.v1.SamlProviderConfig'
              title: saml
          title: saml
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - oidc
              - required:
                  - saml
          - not:
              oneOf:
                - required:
                    - oidc
                - required:
                    - saml
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
          description: organization_id is empty for a provider of the whole installation.
        key:
          type: string
          title: key
        kind:
          type: string
          title: kind
          description: kind is "oidc" or "saml".
        name:
          type: string
          title: name
        enabled:
          type: boolean
          title: enabled
        jitProvisioning:
          type: boolean
          title: jit_provisioning
          description: |-
            jit_provisioning creates an account for a person the provider vouches
             for and no account exists for; off by default.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: IdentityProvider
      description: IdentityProvider is a configured provider.
    plux.v1.ImportDraftRequest:
