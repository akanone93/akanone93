    plux.v1.ConfigBinding:
      type: object
      anyOf:
        - type: object
          properties:
            header:
              type: string
              title: header
              description: header is the name of a request header.
          title: header
        - type: object
          properties:
            jsonPointer:
              type: string
              title: json_pointer
              description: json_pointer (RFC 6901) addresses a member of a JSON request body.
          title: json_pointer
        - type: object
          properties:
            pathParam:
              type: string
              title: path_param
              description: |-
                path_param names a path segment the gateway inserts directly after
                 the operation's path prefix, in the order of the bindings.
          title: path_param
        - type: object
          properties:
            queryParam:
              type: string
              title: query_param
              description: query_param is the name of a query parameter.
          title: query_param
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - header
              - required:
                  - jsonPointer
              - required:
                  - pathParam
              - required:
                  - queryParam
          - not:
              oneOf:
                - required:
                    - header
                - required:
                    - jsonPointer
                - required:
                    - pathParam
                - required:
                    - queryParam
      properties:
        key:
          type: string
          title: key
          description: key is the configuration value; its tier must be server-bound.
        display:
          type: boolean
          title: display
          description: |-
            display marks a value of a transaction the user must see before they
             confirm it: the gateway resolves it when the challenge is created,
             returns it for the confirmation sheet and binds it into the signed
             summary (DAT-093). It needs a json_pointer location that the
             operation's transaction maps.
        label:
          type: string
          title: label
          description: |-
            label is what the confirmation sheet calls a displayed value; empty
             means key.
      title: ConfigBinding
      description: |-
        ConfigBinding binds one server-held configuration value into the
         outgoing request of an operation (DAT-091). The device never sends,
         chooses or sees a bound value, and a request that sets the bound
         location is refused.
    plux.v1.ConfigTier:
      type: string
      title: ConfigTier
      enum:
        - CONFIG_TIER_UNSPECIFIED
        - CONFIG_TIER_SERVER_BOUND
        - CONFIG_TIER_LIVE
      description: |-
        ConfigTier says how a configuration value reaches the code that uses it
         (DAT-090).
    plux.v1.ConfigType:
      type: string
      title: ConfigType
      enum:
        - CONFIG_TYPE_UNSPECIFIED
        - CONFIG_TYPE_STRING
        - CONFIG_TYPE_INTEGER
        - CONFIG_TYPE_DECIMAL
        - CONFIG_TYPE_BOOLEAN
      description: |-
        ConfigType is the type of a configuration value, which is carried as
         text.
    plux.v1.ConfigValue:
      type: object
      properties:
        key:
          type: string
          title: key
          description: |-
            key names the value: a letter followed by letters, digits and
             underscores.
        tier:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ConfigTier'
          title: tier
        sensitive:
          type: boolean
          title: sensitive
          description: |-
            sensitive values are sealed at rest and never returned (SEC-106);
             only server-bound values may be sensitive.
        strict:
          type: boolean
          title: strict
          description: |-
            strict marks a live value whose change refuses a gateway call made
             with an older live-configuration version (DAT-096, DAT-097).
        type:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ConfigType'
          title: type
        value:
          type: string
          title: value
          description: |-
            value is the text form of the value; it is omitted when the value is
             sensitive and the message is a response.
        version:
          type: string
          title: version
          format: int64
          description: version rises with every change of the value.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: ConfigValue
      additionalProperties: false
      description: |-
        ConfigValue is one server-held configuration value of an environment
         (DAT-090).
    plux.v1.ConfigureExportRequest:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/plux.v1.GitSettings'
          title: settings
      title: ConfigureExportRequest
      additionalProperties: false
    plux.v1.ConfigureExportResponse:
      type: object
      properties:
        settings:
          allOf:
            - $ref: '#/components/schemas/plux.v1.GitSettings'
          title: settings
      title: ConfigureExportResponse
      additionalProperties: false
    plux.v1.ConfirmFactorRequest:
      type: object
      properties:
        factorId:
          type: string
          title: factor_id
        code:
          type: string
          title: code
      title: ConfirmFactorRequest
      additionalProperties: false
    plux.v1.ConfirmFactorResponse:
      type: object
      properties:
        factor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Factor'
          title: factor
      title: ConfirmFactorResponse
      additionalProperties: false
    plux.v1.Consent:
      type: object
      properties:
        analytics:
          type: boolean
          title: analytics
        experiments:
          type: boolean
          title: experiments
      title: Consent
      additionalProperties: false
      description: |-
        Consent is what the host app's user agreed to (SEC-161). Operational
         events need none.
    plux.v1.ContentKey:
      type: object
      properties:
        ephemeralPublicKey:
          type: string
          title: ephemeral_public_key
          format: byte
          description: |-
            ephemeral_public_key is the server's one-time P-256 key, an
             uncompressed SEC1 point of 65 bytes.
        wrappedKey:
          type: string
          title: wrapped_key
          format: byte
          description: wrapped_key is the AES-KW output, 40 bytes.
      title: ContentKey
      additionalProperties: false
      description: |-
        ContentKey is a confidential release's content key wrapped to one
         device's key-agreement key with ECDH-ES (P-256), HKDF-SHA-256 and AES-KW
         (SEC-053, ADR-0055).
    plux.v1.Control:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
        killSwitchPlugins:
          type: array
          items:
            type: string
          title: kill_switch_plugins
        appKillSwitch:
          type: boolean
          title: app_kill_switch
        mandatoryUpdate:
          type: boolean
          title: mandatory_update
        message:
          type: string
          title: message
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Control
      additionalProperties: false
      description: Control is the current set of switches for one channel.
    plux.v1.ControlDocument:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
        version:
          type: string
          title: version
          format: int64
          description: |-
            version is the newest version, signed or not; zero for a channel with
             no control document yet.
        killSwitches:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.KillSwitchEntry'
          title: kill_switches
        mandatoryUpdate:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ControlRelease'
          title: mandatory_update
        forcedRollback:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ControlRelease'
          title: forced_rollback
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: updated_by
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        signedVersion:
          type: string
          title: signed_version
          format: int64
          description: |-
            signed_version is the newest signed version, which devices are served;
             zero when none is signed yet.
        issuedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: issued_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: ControlDocument
      additionalProperties: false
      description: ControlDocument is a channel's control document as an operator sees it.
    plux.v1.ControlFlags:
      type: object
      properties:
        killSwitchPlugins:
          type: array
          items:
            type: string
          title: kill_switch_plugins
          description: kill_switch_plugins lists plugin keys the device must not render.
        mandatory:
          type: boolean
          title: mandatory
          description: |-
            mandatory requires the device to activate this release before it
             shows another Plux page.
        message:
          type: string
          title: message
          description: message is shown to the user when a switch is on.
      title: ControlFlags
      additionalProperties: false
      description: ControlFlags are the switches a device obeys (REL-030).
    plux.v1.ControlRelease:
      type: object
      properties:
        releaseId:
          type: string
          title: release_id
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        messageKey:
          type: string
          title: message_key
          description: |-
            message_key is the localisation key of the update screen's message;
             only a mandatory update has one.
      title: ControlRelease
      additionalProperties: false
      description: |-
        ControlRelease names the release a mandatory update or a forced rollback
         points to.
    plux.v1.CreateAccessTokenRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        organizationId:
          type: string
          title: organization_id
        scopes:
          type: array
          items:
            type: string
          title: scopes
        ttlSeconds:
          type: string
          title: ttl_seconds
          format: int64
          description: ttl_seconds must be positive; tokens never last for ever.
      title: CreateAccessTokenRequest
      additionalProperties: false
    plux.v1.CreateAccessTokenResponse:
      type: object
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AccessToken'
          title: token
        secret:
          type: string
          title: secret
          description: secret is returned exactly once and stored only as a hash.
      title: CreateAccessTokenResponse
      additionalProperties: false
    plux.v1.CreateAlertRuleRequest:
