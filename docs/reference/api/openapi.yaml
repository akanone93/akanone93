          type: string
          title: key
        spec:
          allOf:
            - $ref: '#/components/schemas/plux.v1.FlagSpec'
          title: spec
      title: CreateFlagRequest
      additionalProperties: false
    plux.v1.CreateFlagResponse:
      type: object
      properties:
        flag:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Flag'
