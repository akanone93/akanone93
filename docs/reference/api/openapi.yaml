      title: CreateAppResponse
      additionalProperties: false
    plux.v1.CreateChannelRequest:
      type: object
      properties:
        environmentId:
          type: string
          title: environment_id
        key:
          type: string
          title: key
      title: CreateChannelRequest
      additionalProperties: false
    plux.v1.CreateChannelResponse:
      type: object
      properties:
        channel:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Channel'
          title: channel
      title: CreateChannelResponse
      additionalProperties: false
    plux.v1.CreateComplianceReportRequest:
      type: object
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: from
          description: from is inclusive and to exclusive.
        to:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: to
      title: CreateComplianceReportRequest
