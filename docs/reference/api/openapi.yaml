          title: environment_id
        percent:
          type: number
          title: percent
          format: double
      title: SetHoldoutResponse
      additionalProperties: false
    plux.v1.SetKillSwitchRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
        killSwitch:
          allOf:
            - $ref: '#/components/schemas/plux.v1.KillSwitchEntry'
