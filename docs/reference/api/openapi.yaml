          title: overlay
        enabled:
          type: boolean
          title: enabled
      title: ToggleOverlayCommand
      additionalProperties: false
      description: ToggleOverlayCommand switches an overlay on or off (DEV-034).
    plux.v1.TraceFileHeader:
      type: object
      properties:
        formatVersion:
          type: integer
          title: format_version
          description: format_version is 1. A reader refuses a larger version (PLX-9233).
        sessionId:
          type: string
          title: session_id
        appId:
          type: string
          title: app_id
          description: |-
            app_id and app_key identify the app; environment_id and
             environment_key the environment.
        appKey:
          type: string
          title: app_key
        environmentId:
          type: string
          title: environment_id
        environmentKey:
          type: string
          title: environment_key
        exportedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: exported_at
        serverVersion:
          type: string
          title: server_version
          description: server_version is the version of the server that wrote the file.
      title: TraceFileHeader
      additionalProperties: false
      description: |-
        TraceFileHeader is the first message of an exported trace file (D-2.2).
         A trace file is a gzip-compressed stream of length-prefixed protobuf
         messages: this header, then DevEvent messages in sequence order. Each
         message is preceded by its length as an unsigned base-128 varint. The
         events are redacted like the live stream.
    plux.v1.TrashItem:
      type: object
      properties:
        id:
          type: string
          title: id
        kind:
          type: string
          title: kind
          description: kind is "app", "plugin" or "page".
        name:
          type: string
          title: name
        deletedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: deleted_by
        deletedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: deleted_at
        purgeAfter:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: purge_after
      title: TrashItem
      additionalProperties: false
      description: TrashItem is a deleted app, plugin or page awaiting restore (GOV-031).
