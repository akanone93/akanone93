      title: SetOrganizationLimitResponse
      additionalProperties: false
    plux.v1.SetPluginLimitRequest:
      type: object
      properties:
        pluginId:
          type: string
          title: plugin_id
        key:
          type: string
          title: key
        value:
          type: string
          title: value
          format: int64
      title: SetPluginLimitRequest
      additionalProperties: false
    plux.v1.SetPluginLimitResponse:
      type: object
