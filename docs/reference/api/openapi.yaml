          format: int64
        errorsByKind:
          type: object
          title: errors_by_kind
          additionalProperties:
            type: string
            title: value
            format: int64
          description: errors_by_kind maps a reason, such as FUNCTION_TIMEOUT, to its count.
        latencyP50Micros:
          type: string
          title: latency_p50_micros
          format: int64
          description: |-
            latency_p50_micros, latency_p95_micros and latency_p99_micros are
             latency percentiles in microseconds.
        latencyP95Micros:
          type: string
          title: latency_p95_micros
          format: int64
        latencyP99Micros:
          type: string
          title: latency_p99_micros
          format: int64
        memoryPeakBytes:
          type: string
          title: memory_peak_bytes
          format: int64
          description: memory_peak_bytes is the highest linear memory any invocation used.
        cacheHits:
          type: string
          title: cache_hits
          format: int64
          description: |-
            cache_hits counts results served from the pure-function cache
             (FN-014).
      title: GetMetricsResponse
      additionalProperties: false
