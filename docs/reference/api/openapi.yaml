        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        name:
          type: string
          title: name
        session:
          type: string
          title: session
        chunk:
          type: string
          title: chunk
          format: byte
      title: UploadAssetRequest
      additionalProperties: false
    plux.v1.UploadAssetResponse:
