        appId:
          type: string
          title: app_id
        hostBuild:
          type: string
          title: host_build
        catalogue:
          type: string
          title: catalogue
          format: byte
          description: |-
            catalogue is the native catalogue document, plux.catalogue.json, as
             JSON.
      title: UploadNativeCatalogueRequest
      additionalProperties: false
    plux.v1.UploadNativeCatalogueResponse:
      type: object
      properties:
        hostBuild:
          allOf:
            - $ref: '#/components/schemas/plux.v1.HostBuild'
          title: host_build
        created:
          type: boolean
          title: created
          description: |-
            created is false when the build's catalogue was already stored, with
             the same content.
      title: UploadNativeCatalogueResponse
      additionalProperties: false
    plux.v1.UploadRunRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginKey:
          type: string
          title: plugin_key
          description: plugin_key is the plugin's key, or empty for the app bundle.
        bundleSha256:
          type: string
          title: bundle_sha256
          format: byte
          description: |-
            bundle_sha256 is the hash of the bundle under test and app_sha256 the
             hash of the app bundle it was rendered with (BND-005).
        appSha256:
          type: string
          title: app_sha256
          format: byte
        canonical:
          type: boolean
          title: canonical
          description: |-
            canonical is true when the run was rendered on Linux, the canonical
             renderer; other systems compare with a tolerance and the gate never
             accepts their runs.
        renderer:
          type: string
          title: renderer
          description: renderer names the system that rendered the run.
        cases:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.GoldenCase'
          title: cases
      title: UploadRunRequest
      additionalProperties: false
    plux.v1.UploadRunResponse:
      type: object
      properties:
        runId:
          type: string
          title: run_id
        differences:
          type: integer
          title: differences
          format: int32
          description: differences is the number of cases that differ from the baselines.
      title: UploadRunResponse
      additionalProperties: false
    plux.v1.UploadSourceRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        name:
          type: string
          title: name
          description: name is the dotted function name the archive builds (FN-006).
        session:
          type: string
          title: session
        chunk:
          type: string
          title: chunk
          format: byte
          description: |-
            chunk is a part of the archive of the crate and its `vendor/`
             directory (FN-016).
      title: UploadSourceRequest
      additionalProperties: false
    plux.v1.UploadSourceResponse:
      type: object
      properties:
        sourceId:
          type: string
          title: source_id
          description: source_id identifies the stored archive.
        sourceSha256:
          type: string
          title: source_sha256
          description: source_sha256 is the hex SHA-256 of the archive (FN-005).
      title: UploadSourceResponse
      additionalProperties: false
    plux.v1.Upstream:
      type: object
      anyOf:
        - type: object
          properties:
            apiKey:
              allOf:
                - $ref: '#/components/schemas/plux.v1.UpstreamApiKey'
              title: api_key
          title: api_key
        - type: object
          properties:
            mtls:
              allOf:
                - $ref: '#/components/schemas/plux.v1.UpstreamMtls'
              title: mtls
          title: mtls
        - type: object
          properties:
            oauthClientCredentials:
              allOf:
                - $ref: '#/components/schemas/plux.v1.UpstreamOAuthClientCredentials'
              title: oauth_client_credentials
          title: oauth_client_credentials
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - apiKey
              - required:
                  - mtls
              - required:
                  - oauthClientCredentials
          - not:
              oneOf:
                - required:
                    - apiKey
                - required:
                    - mtls
                - required:
                    - oauthClientCredentials
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        name:
          type: string
          title: name
          description: name is what GatewayCallRequest.upstream refers to.
        baseUrl:
          type: string
          title: base_url
          description: base_url is the upstream's base URL.
        allowPrivateAddresses:
          type: boolean
          title: allow_private_addresses
          description: |-
            allow_private_addresses lets the upstream resolve to a private or
             loopback address. It is off by default, because the gateway would
             otherwise reach the server's own network (SEC-105).
        timeoutMs:
          type: integer
          title: timeout_ms
          format: int32
          description: |-
            timeout_ms bounds one call to the upstream; zero uses the registry's
             default (LIM-001).
        allowedMethods:
          type: array
          items:
            type: string
          title: allowed_methods
          description: |-
            allowed_methods are the HTTP methods the gateway forwards to the
             upstream; at least one is required (SEC-031).
        requiresAssurance:
          type: string
          title: requires_assurance
          description: |-
            requires_assurance is the lowest assurance level ("AL0" to "AL3") any
             call to the upstream needs; empty means "AL0". An operation may ask
             for more, never less (SEC-007).
        operations:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.UpstreamOperation'
          title: operations
          description: |-
            operations are the named operations devices may call. When the list
             is not empty a call must name one of them; each narrows the upstream's
             methods and paths and carries the policy the gateway enforces for it
             (SEC-028, SEC-030).
        audience:
          type: string
          title: audience
          description: |-
            audience is the `aud` of the Plux assertion sent to the upstream;
             empty means base_url (SEC-031).
      title: Upstream
      description: |-
        Upstream is an API the gateway may reach for an environment's devices
         (SEC-030).
    plux.v1.UpstreamApiKey:
      type: object
      properties:
        header:
          type: string
          title: header
          description: header is the header that carries the key.
        secretRef:
          type: string
          title: secret_ref
          description: secret_ref names the secret that holds the key.
      title: UpstreamApiKey
      additionalProperties: false
      description: UpstreamApiKey authenticates with a static key in a header.
    plux.v1.UpstreamMtls:
      type: object
      properties:
        clientCertSecretRef:
          type: string
          title: client_cert_secret_ref
          description: |-
            client_cert_secret_ref names the secret that holds the certificate
             and key.
      title: UpstreamMtls
      additionalProperties: false
      description: UpstreamMtls authenticates with a client certificate.
    plux.v1.UpstreamOAuthClientCredentials:
      type: object
      properties:
        tokenUrl:
          type: string
          title: token_url
        clientId:
          type: string
          title: client_id
        clientSecretRef:
          type: string
          title: client_secret_ref
          description: client_secret_ref names the secret that holds the client secret.
        scopes:
          type: array
          items:
            type: string
          title: scopes
      title: UpstreamOAuthClientCredentials
      additionalProperties: false
      description: |-
        UpstreamOAuthClientCredentials authenticates with the OAuth 2.0 client
         credentials grant (RFC 6749 §4.4).
    plux.v1.UpstreamOperation:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is what CallRequest.operation names.
        methods:
          type: array
          items:
            type: string
          title: methods
          description: |-
            methods narrow the upstream's allowed methods; empty means all of
             them.
        pathPrefix:
          type: string
          title: path_prefix
          description: |-
            path_prefix is the path every call must start with, in segments;
             empty means any path under the base URL.
        requiresAssurance:
          type: string
          title: requires_assurance
          description: |-
            requires_assurance is the lowest assurance level this operation
             needs; empty means the upstream's (SEC-007).
        transaction:
          allOf:
            - $ref: '#/components/schemas/plux.v1.UpstreamTransaction'
          title: transaction
          description: |-
            transaction, when set, makes the operation a transaction that needs
             strong customer authentication: the gateway refuses a call without a
             valid signature over the fields it names (SEC-028, SEC-032).
        plugins:
          type: array
          items:
            type: string
          title: plugins
          description: |-
            plugins limits the operation to the plugins that declare the
             capability to call it (SEC-080); empty means any plugin of the app.
        bindings:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ConfigBinding'
          title: bindings
          description: |-
            bindings put server-held configuration values into the request the
             gateway forwards, at locations only this definition names (DAT-091).
      title: UpstreamOperation
      additionalProperties: false
      description: |-
        UpstreamOperation is one operation of an upstream and the policy the
         gateway enforces before it forwards a call to it.
    plux.v1.UpstreamTransaction:
      type: object
      properties:
        amount:
          type: string
          title: amount
        currency:
          type: string
          title: currency
        payee:
          type: string
          title: payee
        summary:
          type: string
          title: summary
          description: 'summary is optional: a human-readable summary the user also confirmed.'
      title: UpstreamTransaction
      additionalProperties: false
      description: |-
        UpstreamTransaction maps the fields that dynamic linking signs to
         positions in the request body, which must be JSON (SEC-028). Each is a
         JSON Pointer (RFC 6901).
    plux.v1.Usage:
      type: object
      properties:
        pluginKey:
          type: string
          title: plugin_key
          description: plugin_key is empty when the use site is an app-level document.
        location:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Location'
          title: location
        kind:
          type: string
          title: kind
          description: kind names what the use site is, such as "node" or "slot".
      title: Usage
      additionalProperties: false
      description: Usage is one reference to an entity, from the reference graph (SCH-041).
    plux.v1.User:
      type: object
      properties:
        id:
          type: string
          title: id
        displayName:
          type: string
          title: display_name
        email:
          type: string
          title: email
          description: |-
            email is returned only to the user themselves and to administrators
             of an organisation they belong to.
        mfaEnrolled:
          type: boolean
          title: mfa_enrolled
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_login_at
      title: User
      additionalProperties: false
    plux.v1.UserIdentityProvider:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        issuer:
          type: string
          title: issuer
          description: issuer is the `iss` the provider's tokens carry.
        jwksUrl:
          type: string
          title: jwks_url
          description: |-
            jwks_url is where the provider publishes its signing keys. It is
             fetched through the SSRF-safe client and must be HTTPS.
        audiences:
          type: array
          items:
            type: string
          title: audiences
          description: audiences are the `aud` values accepted; a token must carry one.
        forwardClaims:
          type: array
          items:
            type: string
          title: forward_claims
          description: |-
            forward_claims are the claims of the user token the gateway passes to
             upstreams in the Plux assertion; `sub` always is.
      title: UserIdentityProvider
      additionalProperties: false
      description: |-
        UserIdentityProvider is the customer identity provider an environment's
         user tokens come from (SEC-026).
    plux.v1.ValidateDraftRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id limits validation to one plugin; empty checks the whole app.
      title: ValidateDraftRequest
      additionalProperties: false
    plux.v1.ValidateDraftResponse:
      type: object
      properties:
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: ValidateDraftResponse
      additionalProperties: false
    plux.v1.ValidatePageRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
        content:
          type: string
          title: content
          format: byte
          description: content is the unsaved page as the editor currently has it.
      title: ValidatePageRequest
      additionalProperties: false
    plux.v1.ValidatePageResponse:
      type: object
      properties:
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: ValidatePageResponse
      additionalProperties: false
    plux.v1.Variable:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
      title: Variable
      additionalProperties: false
    plux.v1.VariantCount:
      type: object
      properties:
        name:
          type: string
          title: name
        control:
          type: boolean
          title: control
        subjects:
          type: string
          title: subjects
          format: int64
        share:
          type: number
          title: share
          format: double
          description: share is the fraction of exposed subjects the allocation promises.
      title: VariantCount
      additionalProperties: false
      description: VariantCount is the subjects of a variant against the share promised.
    plux.v1.VariantMean:
      type: object
      properties:
        variant:
          type: string
          title: variant
        subjects:
          type: string
          title: subjects
          format: int64
        mean:
          type: number
          title: mean
          format: double
      title: VariantMean
      additionalProperties: false
      description: VariantMean is the mean outcome of a variant.
    plux.v1.VerifySecondFactorRequest:
      type: object
      properties:
        code:
          type: string
          title: code
      title: VerifySecondFactorRequest
      additionalProperties: false
    plux.v1.VerifySecondFactorResponse:
      type: object
      properties:
        session:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Session'
          title: session
      title: VerifySecondFactorResponse
      additionalProperties: false
    plux.v1.WatchPermissionsRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
      title: WatchPermissionsRequest
      additionalProperties: false
    plux.v1.WatchPermissionsResponse:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
        version:
          type: string
          title: version
          format: int64
          description: |-
            version is the organisation's new permissions version; a client that
             holds an older one refetches.
      title: WatchPermissionsResponse
      additionalProperties: false
    plux.v1.WatchPublishRequest:
      type: object
      properties:
        jobId:
          type: string
          title: job_id
      title: WatchPublishRequest
      additionalProperties: false
    plux.v1.WatchPublishResponse:
      type: object
      properties:
        job:
          allOf:
            - $ref: '#/components/schemas/plux.v1.PublishJob'
          title: job
        newDiagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: new_diagnostics
          description: new_diagnostics are those reported since the previous message.
      title: WatchPublishResponse
      additionalProperties: false
    plux.v1.WorkloadIdentity:
      type: object
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
        issuer:
          type: string
          title: issuer
          description: issuer must be one the installation trusts.
        audience:
          type: string
          title: audience
        subjectPattern:
          type: string
          title: subject_pattern
          description: |-
            subject_pattern is a glob over the token's subject, such as
             "repo:acme/app:ref:refs/heads/main".
        scopes:
          type: array
          items:
            type: string
          title: scopes
          description: scopes are the permissions an exchanged token carries.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: WorkloadIdentity
      additionalProperties: false
      description: WorkloadIdentity binds CI workloads to an organisation (SRV-064).
security: []
tags:
  - name: plux.v1.AnalyticsService
    description: |-
      AnalyticsService queries the rollups of runtime events, manages how long
       events, rollups and the production audit log are kept, and configures the
       OTLP export (ANL-010, ANL-011, ADR-0080, maintainer decision Q17).
  - name: plux.v1.AppService
    description: |-
      AppService manages apps, their environments and channels (GOV-010), and
       the trash that deleted apps, plugins and pages go to (GOV-031).
  - name: plux.v1.AssetService
    description: |-
      AssetService stores the images, animations, fonts and other files a draft
       uses. Uploads are size-limited, sniffed rather than trusted by extension,
       stripped of metadata and deduplicated by hash (SRV-060, AST-003).
  - name: plux.v1.AuditService
    description: |-
      AuditService serves the audit log's outward faces (ADR-0082): the export
       of an organisation's chain to a SIEM (SEC-143), and, in later milestones
       of the same ADR, the reconstruction of what a user saw (SEC-142) and the
       data-subject requests (SEC-162). Reading the chain itself is not here.
  - name: plux.v1.ComponentService
    description: |-
      ComponentService lists the components of an app and of its plugins and
       reports where each is used, so that changing one shows its blast radius.
       Component documents themselves are written through DocumentService.
  - name: plux.v1.SecurityAdminService
    description: |-
      SecurityAdminService is the administrators' side of device security: an
       environment's security configuration, the upstreams its gateway
       reaches, and the signed audit checkpoints. Devices never call it.
  - name: plux.v1.ConfigService
    description: |-
      ConfigService delivers the live server-held configuration of a device's
       app and environment over the device's DPoP-bound channel (DAT-094).
  - name: plux.v1.ControlService
    description: |-
      ControlService sets the switches that reach devices with the next
       manifest: kill switches for a plugin or a whole app, and the mandatory
       update flag (REL-030). Staged rollouts, targeting and health-based
       auto-pause build on this in P9.
  - name: plux.v1.DeviceService
    description: |-
      DeviceService registers devices and reports what they have installed, so
       that compatibility gating (REL-080) and retention (REL-007) have real
       numbers. Hardware-backed keys, platform attestation and assurance levels
       arrive in P6; in P2 a registration is an identity and a declared runtime,
       and its assurance level is always the lowest.
  - name: plux.v1.DevSessionService
    description: |-
      DevSessionService lets a developer pair devices with a non-production
       environment, push draft changes to them, drive them with commands and
       watch what they report (DEV-001 to DEV-041). A person calls every RPC
       except Pair, which the paired device calls with its access token and a
       DPoP proof (SEC-021). The events themselves travel over a WebSocket the
       device opens with the ticket Pair returns; this service carries the
       control plane and the CLI's view of the stream.

       A session exists only for an environment whose kind is not production
       (DEV-003, PLX-9203). Creating a session, getting a pairing token,
       pushing patches and sending commands need `devsession.create`; watching,
       listing devices and exporting a trace need `devsession.observe`.
  - name: plux.v1.DocumentService
    description: |-
      DocumentService reads and writes the documents of a draft: pages, action
       graphs, themes, translations and the rest of the document model. Writes
       use optimistic concurrency and accept JSON Patch (SRV-030); every accepted
       write appends a snapshot (SRV-031); writing requires the editing lock
       (SRV-040). Content travels as canonical JSON bytes, never as protobuf
       structures, so a document's hash is a property of the bytes (SCH-003).
  - name: plux.v1.DataSubjectService
    description: |-
      DataSubjectService serves data subject requests (SEC-162): the export and
       the erasure of everything an organisation holds about a device or a
       pseudonymous user, and the map of where personal data is stored. Every
       call needs the dsr.manage permission.
  - name: plux.v1.FlagService
    description: |-
      FlagService administers the feature flags of an environment (ABT-006): a
       flag's type, default and per-segment values, which reach devices through the
       control document of every channel of the environment without a release.
       Writes need flags.manage on the environment; reads need app.read.
  - name: plux.v1.ExperimentService
    description: |-
      ExperimentService administers and analyses experiments (ABT-001, ABT-003,
       ABT-004, ABT-005). Changes need experiments.manage on the app, results need
       analytics.read and the rest app.read.
  - name: plux.v1.OrgService
    description: |-
      OrgService manages the Installation → Organization → Teams hierarchy
       (GOV-001). Apps are owned by an organization; access is granted to teams
       or to users per app.
  - name: plux.v1.IdentityService
    description: |-
      IdentityService authenticates people and machines: built-in accounts
       with Argon2id passwords or an OpenID Connect provider, and a second
       factor — TOTP or a WebAuthn security key — mandatory for sensitive
       capabilities (SEC-100), browser sessions for the Studio
       backend-for-frontend (SEC-101), personal access tokens and CI
       workload-identity federation (SRV-064), and the OAuth 2.0 device
       authorization grant `plux login` uses (CLI-002). SAML, provisioning
       and group mapping arrive with GOV-004, and WebAuthn step-up with
       SEC-103, both in P9.
  - name: plux.v1.FederationService
    description: |-
      FederationService manages identity federation (GOV-004, ADR-0074):
       the OpenID Connect and SAML providers people sign in with, the mapping
       from the groups a provider asserts to roles and teams, and the bearer
       tokens of an organisation's SCIM client. Signing in with an OpenID
       Connect provider is IdentityService.StartOidcLogin; the SAML sign-in is
       here, beside the public list of providers a sign-in page offers.
  - name: plux.v1.FunctionService
    description: |-
      FunctionService lets an attested device invoke a server-placed Plux
       Function (FN-020). Business errors the function declares travel in the
       response as FunctionBusinessError; system errors (timeouts, limits,
       capability denials, unknown functions) travel as Connect errors that
       carry a PLX code from the error catalogue (FN-022).
  - name: plux.v1.FunctionAdminService
    description: |-
      FunctionAdminService manages function sources, builds and versions for
       the CLI and Studio. Deploying to production goes through the approval
       engine (FN-007).
  - name: plux.v1.GatewayService
    description: |-
      GatewayService lets an attested device reach an upstream API through the
       server, which holds the upstream's credentials and applies the
       environment's security configuration (SEC-030–SEC-032). Call is the
       typed form for bodies that fit in one message; a request or response
       body that must stream uses the equivalent HTTP route, because a unary
       message is bounded by the request size limit (LIM-001).
  - name: plux.v1.ScaService
    description: |-
      ScaService issues the challenges behind strong customer authentication:
       the user confirms the exact transaction on the device and its SCA key
       signs it (SEC-027).
  - name: plux.v1.GitExportService
    description: |-
      GitExportService exports an app to a Git repository on every publish
       (GOV-011, ADR-0082). The export is off until configured. The credential
       is a secret of an environment, held under envelope encryption; it is never
       returned. Every call needs git.export on the app.
  - name: plux.v1.GoldenService
    description: |-
      GoldenService holds the baselines of golden (visual regression) tests and
       the runs compared with them (TST-003, ADR-0070). The CLI renders the
       cases with the real runtime and uploads a run; the server compares the
       images with the approved baselines, promotes images on approval and gates
       publishing on them.
  - name: plux.v1.GovernanceService
    description: |-
      GovernanceService manages who may do what (GOV-002, GOV-003, ADR-0073):
       the permission catalogue, the predefined and custom roles, and the grants
       that bind a role to a user or a team at a scope. Teams and their members
       are managed by OrgService.
  - name: plux.v1.ApprovalService
    description: |-
      ApprovalService is the approval engine (GOV-020 to GOV-023, ADR-0076):
       the policies that say which changes need approval, and the requests the
       engine opens when a guarded change is refused for want of one. A request
       is opened by the refusal itself, never by a call here, and names the
       artifact by its content hash.
  - name: plux.v1.BreakGlassService
    description: |-
      BreakGlassService lists and reviews the emergency actions taken without
       prior approval (GOV-024, ADR-0076). The actions themselves are taken with
       the break_glass field of the kill-switch, forced-rollback and rollback
       calls; each opens a post-hoc review here, due within
       governance.breakGlassReviewHours (24 hours by default) and escalated when
       overdue (PLX-8006).
  - name: plux.v1.FreezeService
    description: |-
      FreezeService manages change-freeze windows (GOV-025, ADR-0076), an
       enterprise feature (PLX-8600 without the licence). Inside a window,
       changes to a production environment are refused with PLX-8010, except
       through break-glass.
  - name: plux.v1.ComplianceService
    description: |-
      ComplianceService produces compliance reports (GOV-026, ADR-0076), an
       enterprise feature (PLX-8600 without the licence): every production
       change of a period with author, approvers, timestamps, content hashes and
       evidence, as a DSSE envelope signed with the audit key, and as a PDF.
  - name: plux.v1.LicenseService
    description: |-
      LicenseService reports the installation's enterprise licence (GOV-030,
       ADR-0084). The open-source core answers "absent": it has no enterprise
       features to enable. The service only reads; the licence file is placed by
       the operator and verified offline by the server, never uploaded through
       the API.
  - name: plux.v1.LocalisationService
    description: |-
      LocalisationService exchanges an app's translations with translation tools
       and reports their progress (I18N-008, I18N-009, ADR-0068). Every write
       goes through the document service under the lock of the locale
       (translations/<locale>), so the review rules of I18N-008 apply to it.
  - name: plux.v1.ManifestService
    description: |-
      ManifestService serves the signed manifest a device syncs against
       (REL-030–REL-033). The manifest is also served over plain HTTP with an
       ETag, so an unchanged manifest costs one conditional request and a 304
       (REL-031); this service is the typed form of the same document.
  - name: plux.v1.NativeCatalogueService
    description: |-
      NativeCatalogueService stores the native catalogue of each build of the
       host app: the native routes, slots and custom actions it registers for
       plugins (CLI-006, WGT-032, ADR-0041). Publishing checks the release's
       plugins against every build's catalogue, and devices of a build that
       cannot run a release keep the newest one they can (REL-080).
  - name: plux.v1.NotificationService
    description: |-
      NotificationService delivers what happens in an organisation to the people
       who follow it (SRV-062, ADR-0081): an in-app inbox, subscriptions of users
       and teams to event types, and the channels beyond the inbox — SMTP, Slack,
       Microsoft Teams and Telegram. A channel's credential is stored encrypted
       and is never returned.
  - name: plux.v1.WebhookService
    description: |-
      WebhookService manages outbound webhooks (SRV-063, ADR-0081): HTTPS
       endpoints that receive events as Standard Webhooks messages. A message that
       cannot be delivered is retried with exponential backoff for up to 24 hours,
       then given up on with PLX-8401.
  - name: plux.v1.FunctionTriggerService
    description: |-
      FunctionTriggerService schedules functions and opens them to signed
       inbound webhooks (FN-025, ADR-0081). A trigger runs the version an alias
       points at, on the server, at the lowest assurance, with no credentials.
  - name: plux.v1.PluginService
    description: |-
      PluginService manages plugins and their editing locks (SRV-040–SRV-042).
       App-level documents share one lock of their own, addressed by app_id with
       an empty plugin_id.
  - name: plux.v1.PreferencesService
    description: |-
      PreferencesService keeps each signed-in user's Studio preferences, one
       set per organisation (STU-014, STU-058), and reports the onboarding steps
       of the organisation (STU-015). Every RPC is about the caller and needs no
       permission beyond being signed in.
  - name: plux.v1.PublishService
    description: |-
      PublishService turns a plugin draft into an immutable plugin version.
       Publishing is an idempotent, durable job that freezes the draft at a
       revision and streams its progress (SRV-050). It fails without side
       effects when any diagnostic is an error (SRV-051).
  - name: plux.v1.ReleaseService
    description: |-
      ReleaseService manages immutable plugin versions and app releases, their
       promotion between environments and their rollback (ADR-0020).
  - name: plux.v1.RolloutService
    description: |-
      RolloutService serves staged rollouts of a release to a share of a
       channel's devices (REL-050 to REL-053, ADR-0078). Every call needs the
       rollout.manage permission on the app, and on the environment for calls that
       name one.
  - name: plux.v1.SearchService
    description: SearchService searches the apps the caller may read (SRV-061, ADR-0082).
  - name: plux.v1.StudioEventsService
    description: |-
      StudioEventsService carries one resumable server stream per Studio tab:
       lock changes, document revision changes and the inbox unread count
       (STU-075, SRV-062, ADR-0096). Anyone signed in may watch; events about
       apps the caller cannot read are left out.
  - name: plux.v1.TelemetryService
    description: |-
      TelemetryService ingests the runtime's batched events (Appendix G.2).
       P2 provides the endpoint, validation and bounded storage; dashboards,
       rollups and export arrive with the analytics requirements in P9. Events
       never carry payloads, and fields tagged sensitive are refused rather
       than stored (SCH-012, ANL-003).
  - name: plux.v1.TemplateService
    description: |-
      TemplateService lists page and flow templates and instantiates them into
       a draft with fresh identifiers (SCH-031).
  - name: plux.v1.TokenService
    description: |-
      TokenService issues the short-lived access tokens devices use. In P2 a
       device proves itself with the credential it received at registration;
       from P6 that credential is replaced by a hardware-bound key, tokens
       are sender-constrained with DPoP (SEC-020) and refresh needs fresh
       attestation (SEC-025). There is deliberately no long-lived refresh
       token.
