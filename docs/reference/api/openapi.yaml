      title: CreateEnvironmentRequest
      additionalProperties: false
    plux.v1.CreateEnvironmentResponse:
      type: object
      properties:
        environment:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Environment'
          title: environment
      title: CreateEnvironmentResponse
      additionalProperties: false
    plux.v1.CreateExperimentRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        document:
          type: string
          title: document
          format: byte
          description: document is the experiment document (experiments/<key>.experiment.json).
      title: CreateExperimentRequest
      additionalProperties: false
    plux.v1.CreateExperimentResponse:
      type: object
      properties:
        experiment:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Experiment'
          title: experiment
      title: CreateExperimentResponse
      additionalProperties: false
    plux.v1.CreateExportDestinationRequest:
      type: object
      properties:
        name:
          type: string
          title: name
        kind:
          type: string
          title: kind
        address:
          type: string
          title: address
        allowPrivate:
          type: boolean
          title: allow_private
        caPem:
          type: string
          title: ca_pem
          description: |-
            ca_pem pins the roots that verify the destination's certificate; empty
             uses the system roots.
        clientCertificatePem:
          type: string
          title: client_certificate_pem
          description: |-
            client_certificate_pem and client_key_pem are the client certificate for
             mutual TLS; both or neither.
        clientKeyPem:
          type: string
          title: client_key_pem
        signingSecret:
          type: string
          title: signing_secret
          description: |-
            signing_secret is the signing secret of a webhook destination
             ("whsec_" and base64).
        startAfterSequence:
          type: string
          title: start_after_sequence
          format: int64
          description: |-
            start_after_sequence is the last entry the destination already has;
             zero delivers the chain from its first entry.
      title: CreateExportDestinationRequest
      additionalProperties: false
    plux.v1.CreateExportDestinationResponse:
      type: object
      properties:
        destination:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ExportDestination'
          title: destination
      title: CreateExportDestinationResponse
      additionalProperties: false
    plux.v1.CreateFlagRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
