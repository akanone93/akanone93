      type: object
      properties:
        unread:
          type: string
          title: unread
          format: int64
      title: InboxChanged
      additionalProperties: false
    plux.v1.InboxItem:
      type: object
      properties:
        id:
          type: string
          title: id
        eventType:
          type: string
          title: event_type
        appId:
          type: string
          title: app_id
        title:
          type: string
          title: title
        body:
          type: string
          title: body
        link:
          type: string
          title: link
          description: link is an https URL or a path in Studio.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        read:
          type: boolean
          title: read
        params:
          type: object
          title: params
          additionalProperties:
            type: string
            title: value
          description: |-
            params are the typed values of the event, keyed by name, which Studio
             formats in the reader's language from the event type's message (O-18);
             title and body keep the server-rendered text for the other channels.
        groupKey:
          type: string
          title: group_key
          description: |-
            group_key is equal for repeats of one event (same type, app and
             subject); group_count is how many items the group holds (F16).
        groupCount:
          type: integer
          title: group_count
          format: int32
      title: InboxItem
      additionalProperties: false
      description: InboxItem is a stored notification.
    plux.v1.IncompatibleHostBuild:
      type: object
      properties:
        hostBuild:
          type: string
          title: host_build
        devices:
          type: string
          title: devices
          format: int64
          description: devices is how many registered devices report the build.
        fallbackSequence:
          type: string
          title: fallback_sequence
          format: int64
          description: |-
            fallback_sequence is the newest earlier release the build can run,
             which its devices receive instead; zero when none.
        missing:
          type: array
          items:
            type: string
          title: missing
          description: |-
            missing names each native entry the build lacks or declares
             differently, as "route profile", "slot MapCard" or "action scan".
      title: IncompatibleHostBuild
      additionalProperties: false
      description: IncompatibleHostBuild is a host build that cannot run a release.
    plux.v1.IngestEventsRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        events:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Event'
          title: events
        consent:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Consent'
          title: consent
          description: |-
            consent is the consent the runtime had when it recorded the events.
             When present the server refuses events of a category the user did not
             agree to, and drops the locale without analytics consent; when absent
             the events are taken as the device gated them (ANL-003, SEC-161).
        installed:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ReportInstalledRequest'
          title: installed
          description: |-
            installed, when present, is the device's report of the release it
             activated (SEC-142), recorded as DeviceService.ReportInstalled records
             it. It rides on the telemetry upload that follows a sync, so an update
             costs no request of its own (QA-007); the batch may then hold no events.
      title: IngestEventsRequest
      additionalProperties: false
    plux.v1.IngestEventsResponse:
      type: object
      properties:
        accepted:
          type: integer
          title: accepted
          format: int32
        rejected:
          type: integer
          title: rejected
          format: int32
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: IngestEventsResponse
      additionalProperties: false
    plux.v1.InspectEvent:
      type: object
