          title: provider_id
        mapping:
          allOf:
            - $ref: '#/components/schemas/plux.v1.GroupMapping'
          title: mapping
      title: SetGroupMappingRequest
      additionalProperties: false
    plux.v1.SetGroupMappingResponse:
      type: object
      properties:
        mapping:
          allOf:
            - $ref: '#/components/schemas/plux.v1.GroupMapping'
          title: mapping
      title: SetGroupMappingResponse
      additionalProperties: false
    plux.v1.SetHoldoutRequest:
      type: object
