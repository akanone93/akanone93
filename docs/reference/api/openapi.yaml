openapi: 3.1.0
info:
  title: Plux Server API
  version: v1
  description: >-
    The Plux Server API (SRV-002). Every operation is generated from the Protocol Buffers contract in proto/plux/v1 and is served by ConnectRPC over gRPC, gRPC-Web and Connect; this description covers the plain HTTP/JSON form for integrators who do not use a generated client.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
paths:
  /plux.v1.AnalyticsService/CancelRetentionChange:
    post:
      tags:
        - plux.v1.AnalyticsService
      summary: CancelRetentionChange
      description: |-
        CancelRetentionChange withdraws a scheduled change. It needs
         retention.manage and is audited.
      operationId: plux.v1.AnalyticsService.CancelRetentionChange
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/plux.v1.CancelRetentionChangeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/plux.v1.CancelRetentionChangeResponse'
