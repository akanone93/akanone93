      title: BundleDescriptor
      additionalProperties: false
    plux.v1.CallRequest:
      type: object
      properties:
        upstream:
          type: string
          title: upstream
          description: |-
            upstream names a configured upstream of the device's app and
             environment: the data source's name (SEC-030). The end user's token,
             when the call acts for one, travels in the Plux-User-Token request
             header (SEC-026).
        operation:
          type: string
          title: operation
          description: |-
            operation names the allowed operation, so the server can apply its
             policy and require a transaction confirmation where one is set
             (SEC-031). It is empty for a data source's load; the server then
             finds the operation by the method and path, and a path that belongs
             to a transaction still needs its confirmation.
        method:
          type: string
          title: method
          description: method is the HTTP method.
        path:
          type: string
          title: path
          description: |-
            path is the request path and query, relative to the upstream's base
             URL.
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
          description: |-
            headers are the request headers the upstream may receive; the server
             drops any it does not allow (SEC-031).
        body:
          type: string
          title: body
          format: byte
          description: body is the request body.
        transactionChallengeId:
          type: string
          title: transaction_challenge_id
          description: |-
            transaction_challenge_id names the challenge from
             ScaService.CreateTransactionChallenge that transaction_signature
             answers; empty for an operation that needs no confirmation
             (SEC-032).
        transactionSignature:
          type: string
          title: transaction_signature
          format: byte
          description: |-
            transaction_signature is the signature of the device's SCA key over
             the challenge followed by the transaction summary: ES256, 64 bytes,
             r then s (SEC-032).
        plugin:
          type: string
          title: plugin
          description: |-
            plugin is the key of the plugin that makes the call, for the
             operation's plugin capability (SEC-080); empty when the operation
             names none.
      title: CallRequest
      additionalProperties: false
    plux.v1.CallResponse:
      type: object
      properties:
        status:
          type: integer
          title: status
          format: int32
          description: status is the upstream's HTTP status code.
        headers:
          type: object
          title: headers
          additionalProperties:
            type: string
            title: value
          description: headers are the response headers the server passes on.
        body:
          type: string
          title: body
          format: byte
          description: body is the upstream's response body.
      title: CallResponse
      additionalProperties: false
