          title: page
      title: ListWorkloadIdentitiesResponse
      additionalProperties: false
    plux.v1.LiveConfigValue:
      type: object
      properties:
        key:
          type: string
          title: key
        type:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ConfigType'
          title: type
        strict:
          type: boolean
          title: strict
          description: strict values fail closed while they cannot be refreshed (DAT-097).
        value:
          type: string
          title: value
          description: value is the text form of the value.
        version:
          type: string
          title: version
          format: int64
          description: version is the value's own version.
      title: LiveConfigValue
      additionalProperties: false
      description: |-
        LiveConfigValue is a live value as a device receives it. Devices hold
         it in memory only (DAT-094).
    plux.v1.LocaleStatus:
      type: object
      properties:
        locale:
          type: string
          title: locale
        total:
          type: integer
          title: total
          format: int32
        new:
          type: integer
          title: new
          format: int32
        translated:
          type: integer
          title: translated
          format: int32
        reviewed:
          type: integer
          title: reviewed
          format: int32
        approved:
          type: integer
          title: approved
          format: int32
        missing:
          type: integer
          title: missing
          format: int32
      title: LocaleStatus
      additionalProperties: false
      description: |-
        LocaleStatus counts the translation keys of one locale by state. Missing
         keys have no message; the other counts are of keys that have one, so
         total = new + translated + reviewed + approved + missing.
    plux.v1.Location:
      type: object
      properties:
        file:
          type: string
          title: file
          description: file is the document's path in the project layout, with forward slashes.
        path:
          type: string
          title: path
          description: path is a JSON Pointer (RFC 6901) into the document.
        range:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Range'
          title: range
          description: range narrows the location to characters inside a PXL expression.
      title: Location
      additionalProperties: false
      description: Location identifies a value inside a project.
    plux.v1.Lock:
      type: object
      properties:
        pluginId:
          type: string
          title: plugin_id
          description: plugin_id is empty for the app-level lock (SRV-042).
        appId:
          type: string
          title: app_id
        holder:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: holder
        session:
          type: string
          title: session
          description: session identifies the holder's editing session.
        acquiredAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: acquired_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        requestedBy:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Actor'
          title: requested_by
          description: requested_by lists users who asked for the lock since it was taken.
        scope:
          type: string
          title: scope
          description: |-
            scope is empty for the draft's own lock and "translations/<locale>" for
             the lock of one locale's translations document (I18N-008).
        lastEditAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_edit_at
          description: |-
            last_edit_at is the time of the holder's last accepted write under
             this lock (ADR-0095).
        takeoverAllowedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: takeover_allowed_at
          description: |-
            takeover_allowed_at is the earliest time another user may take the
             lock over: studio.lockTakeoverIdleMinutes after last_edit_at, or at
             once when the lease has lapsed. The server enforces it (L-1, SRV-041).
      title: Lock
      additionalProperties: false
      description: Lock is an exclusive editing lock (SRV-040, ADR-0015).
    plux.v1.LockChanged:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        scope:
          type: string
          title: scope
        lock:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Lock'
          title: lock
          description: lock is unset when the lock was released.
      title: LockChanged
      additionalProperties: false
    plux.v1.LogEvent:
      type: object
      properties:
        level:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevLogLevel'
          title: level
        source:
          type: string
          title: source
          description: |-
            source names what logged: "runtime", "action", "pxl", "host" or a
             plugin key.
        message:
          type: string
          title: message
          description: message is the redacted text of the line.
        nodePath:
          type: string
          title: node_path
          description: |-
            node_path is the document location the line belongs to, when it has
             one; resolved through the development bundle's source map (CMP-041).
      title: LogEvent
      additionalProperties: false
      description: LogEvent is one runtime log line.
    plux.v1.LogoutRequest:
      type: object
      title: LogoutRequest
      additionalProperties: false
    plux.v1.LogoutResponse:
      type: object
      title: LogoutResponse
      additionalProperties: false
    plux.v1.Manifest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        channel:
          type: string
          title: channel
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        issuedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: issued_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        appBundle:
          allOf:
            - $ref: '#/components/schemas/plux.v1.BundleDescriptor'
          title: app_bundle
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PluginDescriptor'
          title: plugins
        control:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ControlFlags'
          title: control
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ExperimentAssignment'
          title: experiments
          description: |-
            experiments are the variant assignments the device needs; empty
             until experiments arrive (ABT-001).
        signed:
          type: string
          title: signed
          format: byte
          description: signed is the canonical JSON the signatures cover.
        signatures:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Signature'
          title: signatures
          description: |-
            signatures sign `signed`. There may be several, so that keys can be
             rotated and thresholds applied (ADR-0004).
        config:
          allOf:
            - $ref: '#/components/schemas/plux.v1.SecurityConfigRef'
          title: config
          description: |-
            config is the security configuration this release requires; it is
             part of the signed document (SEC-182).
        metadata:
          allOf:
            - $ref: '#/components/schemas/plux.v1.UpdateMetadataRef'
          title: metadata
          description: |-
            metadata names the update-metadata versions the manifest belongs to,
             for rollback and freeze checks; part of the signed document
             (SEC-050).
        developmentSession:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevelopmentSession'
          title: development_session
          description: |-
            development_session is present only in the manifest of a dev session's
             development bundle (DEV-003, ADR-0087). A release manifest never
             carries it, and a release runtime refuses a manifest that does.
      title: Manifest
      additionalProperties: false
      description: |-
        Manifest describes one release as a device sees it (REL-030,
         Appendix B.3). The signatures cover `signed`, the RFC 8785 canonical
         JSON of the document's signed part, not this message: a device
         verifies the bytes it received rather than a re-encoding.
    plux.v1.MappingRule:
      type: object
      properties:
        group:
          type: string
          title: group
          description: group is the value of the groups claim, compared exactly.
        organization:
          type: string
          title: organization
          description: |-
            organization is the key of the organisation the rule acts in; required
             for a provider of the installation, absent for an organisation's.
        grants:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.GrantRule'
          title: grants
        teams:
          type: array
          items:
            type: string
          title: teams
          description: teams are team keys.
      title: MappingRule
      additionalProperties: false
      description: MappingRule gives the members of one group their grants and teams.
    plux.v1.MarkReadRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          title: ids
      title: MarkReadRequest
      additionalProperties: false
    plux.v1.MarkReadResponse:
      type: object
      properties:
        marked:
          type: string
          title: marked
          format: int64
      title: MarkReadResponse
      additionalProperties: false
    plux.v1.Member:
      type: object
      properties:
        userId:
          type: string
          title: user_id
        organizationId:
          type: string
          title: organization_id
        teamId:
          type: string
          title: team_id
          description: team_id is empty for a direct organization membership.
        role:
          type: string
          title: role
          description: |-
            role is "owner", "admin", "developer", "translator" or "viewer" for a direct
             membership (SEC-102), and "member" for a team membership: a team's
             members hold the roles the team is granted on apps (GOV-001).
        addedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: added_at
        displayName:
          type: string
          title: display_name
        email:
          type: string
          title: email
      title: Member
      additionalProperties: false
      description: Member binds a user to an organization or a team with a role.
    plux.v1.MetricResult:
      type: object
      properties:
        event:
          type: string
          title: event
        property:
          type: string
          title: property
        kind:
          type: string
          title: kind
        direction:
          type: string
          title: direction
        means:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.VariantMean'
          title: means
        comparisons:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Comparison'
          title: comparisons
      title: MetricResult
      additionalProperties: false
    plux.v1.MfaChallenge:
      type: object
      properties:
        id:
          type: string
          title: id
        kinds:
          type: array
          items:
            type: string
          title: kinds
          description: kinds lists the factor kinds the user may answer with.
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
      title: MfaChallenge
      additionalProperties: false
      description: MfaChallenge is a sign-in waiting for its second factor.
    plux.v1.MockSelection:
      type: object
      properties:
        source:
          type: string
          title: source
        state:
          type: string
          title: state
      title: MockSelection
      additionalProperties: false
      description: MockSelection selects the state of one data-source mock (DAT-080).
    plux.v1.NetworkCallEvent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
        method:
          type: string
          title: method
        urlTemplate:
          type: string
          title: url_template
          description: |-
            url_template is the URL with path and query values replaced by their
             placeholders, so identifiers and tokens in a URL never leave the
             device.
        status:
          type: integer
          title: status
          format: int32
          description: status is the HTTP status; zero when no response arrived.
        startUnixMicros:
          type: string
          title: start_unix_micros
          format: int64
        connectMicros:
          type: string
          title: connect_micros
          format: int64
          description: |-
            timings, in microseconds from the start of the call; zero when the
             phase did not happen or was not measured.
        firstByteMicros:
          type: string
          title: first_byte_micros
          format: int64
        totalMicros:
          type: string
          title: total_micros
          format: int64
        requestBytes:
          type: string
          title: request_bytes
          format: int64
        responseBytes:
          type: string
          title: response_bytes
          format: int64
        headersRedacted:
          type: boolean
          title: headers_redacted
          description: |-
            headers_redacted, request_body_redacted and response_body_redacted
             are true when the device withheld the headers or the body, which is
             the default. Only when a developer turned redaction down for the
             session are they false and the fields below filled; sensitive values
             stay withheld even then (SCH-012).
        requestBodyRedacted:
          type: boolean
          title: request_body_redacted
        responseBodyRedacted:
          type: boolean
          title: response_body_redacted
        requestHeaders:
          type: object
          title: request_headers
          additionalProperties:
            type: string
            title: value
        responseHeaders:
          type: object
          title: response_headers
          additionalProperties:
            type: string
            title: value
        requestBody:
          type: string
          title: request_body
          format: byte
        responseBody:
          type: string
          title: response_body
          format: byte
        error:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevError'
          title: error
          description: error is the failure of a call that got no usable response.
      title: NetworkCallEvent
      additionalProperties: false
      description: NetworkCallEvent is one HTTP call the runtime made (DEV-020).
    plux.v1.NetworkProfileCommand:
      type: object
      properties:
        profileId:
          type: string
          title: profile_id
          description: |-
            profile_id is the profile's identifier, such as "offline" or "3g";
             "good_wifi" removes the simulation.
      title: NetworkProfileCommand
      additionalProperties: false
      description: |-
        NetworkProfileCommand applies a network profile of
         schema/devtools/network-profiles.json (DEV-031).
    plux.v1.NotificationChannel:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        kind:
          type: string
          title: kind
          description: kind is "smtp", "slack", "teams" or "telegram".
        settings:
          type: object
          title: settings
          additionalProperties:
            type: string
            title: value
          description: |-
            settings are the non-secret settings: for SMTP host, port, from,
             username and tls (starttls, implicit or none); for Telegram chat_id.
        hint:
          type: string
          title: hint
        enabled:
          type: boolean
          title: enabled
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: NotificationChannel
      additionalProperties: false
      description: |-
        NotificationChannel is a configured destination. The credential is never
         returned; hint is its last characters, to tell channels apart.
    plux.v1.NotificationSubscription:
      type: object
      properties:
        id:
          type: string
          title: id
        subjectKind:
          type: string
          title: subject_kind
          description: subject_kind is "user" or "team"; empty on a request means the caller.
        subjectId:
          type: string
          title: subject_id
        eventType:
          type: string
          title: event_type
        channelId:
          type: string
          title: channel_id
          description: channel_id is empty for the in-app inbox.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: NotificationSubscription
      additionalProperties: false
      description: NotificationSubscription says who follows an event type, and where it goes.
    plux.v1.OidcProviderConfig:
      type: object
      properties:
        issuer:
          type: string
          title: issuer
        clientId:
          type: string
          title: client_id
        clientSecret:
          type: string
          title: client_secret
          description: |-
            client_secret is write-only: it is sealed on create and update when
             set, and never returned.
        redirectUrl:
          type: string
          title: redirect_url
          description: redirect_url is Studio's callback, registered with the provider.
        hasClientSecret:
          type: boolean
          title: has_client_secret
      title: OidcProviderConfig
      additionalProperties: false
      description: OidcProviderConfig configures an OpenID Connect provider.
    plux.v1.OnboardingStep:
      type: object
      properties:
        key:
          type: string
          title: key
        done:
          type: boolean
          title: done
      title: OnboardingStep
      additionalProperties: false
      description: |-
        OnboardingStep is one step: "create_app", "edit_screen", "pair_device",
         "publish_release" or "invite_member".
    plux.v1.OpenScreenCommand:
      type: object
      properties:
        route:
          type: string
          title: route
        params:
          type: object
          title: params
          additionalProperties:
            type: string
            title: value
        locale:
          type: string
          title: locale
          description: locale is a BCP 47 tag; empty keeps the device's.
        theme:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevThemeMode'
          title: theme
        textScale:
          type: number
          title: text_scale
          format: double
          description: text_scale is the text scale factor; zero keeps the device's.
        mocks:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.MockSelection'
          title: mocks
      title: OpenScreenCommand
      additionalProperties: false
      description: OpenScreenCommand opens a screen on the device (DEV-011).
    plux.v1.Organization:
      type: object
      properties:
        id:
          type: string
          title: id
        key:
          type: string
          title: key
          description: key is the stable, URL-safe identifier, unique per installation.
        name:
          type: string
          title: name
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Organization
      additionalProperties: false
    plux.v1.OutboundWebhook:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        url:
          type: string
          title: url
        eventTypes:
          type: array
          items:
            type: string
          title: event_types
          description: event_types narrows the events sent; empty is all.
        enabled:
          type: boolean
          title: enabled
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        secretHint:
          type: string
          title: secret_hint
          description: secret_hint is the end of the newest secret.
      title: OutboundWebhook
      additionalProperties: false
      description: OutboundWebhook is an endpoint that receives events.
    plux.v1.Page:
      type: object
      properties:
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: page_size is the maximum number of items to return.
        pageToken:
          type: string
          title: page_token
          description: |-
            page_token continues an earlier call. Tokens are opaque and
             integrity-protected; they are bound to the filter and ordering they
             were issued for and are rejected by any other query.
        filter:
          type: string
          title: filter
          description: filter selects items with the documented filter syntax of the endpoint.
        orderBy:
          type: string
          title: order_by
          description: order_by names fields to sort by, each optionally followed by " desc".
        readMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: read_mask
          description: |-
            read_mask limits each returned item to the named fields; an empty
             mask returns whole items.
      title: Page
      additionalProperties: false
      description: |-
        Page asks for one page of a list endpoint (SRV-004). No list endpoint
         returns an unbounded result: an unset page_size uses the server default
         and any value above the maximum is clamped to it.
    plux.v1.PageResult:
      type: object
      properties:
        nextPageToken:
          type: string
          title: next_page_token
          description: next_page_token is empty on the last page.
        totalSize:
          type: integer
          title: total_size
          format: int32
          description: |-
            total_size is the number of items matching the filter, when the
             endpoint can count them cheaply; zero otherwise.
      title: PageResult
      additionalProperties: false
      description: PageResult carries the continuation of a list response.
    plux.v1.PatchDocumentRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
        patch:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.PatchOp'
          title: patch
        ifRevision:
          type: string
          title: if_revision
          format: int64
        session:
          type: string
          title: session
        editorSessionId:
          type: string
          title: editor_session_id
          description: editor_session_id is as in PutDocumentRequest.
      title: PatchDocumentRequest
      additionalProperties: false
    plux.v1.PatchDocumentResponse:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Document'
          title: document
        snapshotId:
          type: string
          title: snapshot_id
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: PatchDocumentResponse
      additionalProperties: false
    plux.v1.PatchOp:
      type: object
      properties:
        op:
          type: string
          title: op
          description: op is "add", "remove", "replace", "move", "copy" or "test".
        path:
          type: string
          title: path
        from:
          type: string
          title: from
        value:
          type: string
          title: value
          format: byte
          description: |-
            value is the JSON value of "add", "replace" and "test", as bytes, so
             that it keeps the canonical form the document model defines.
      title: PatchOp
      additionalProperties: false
      description: PatchOp is one JSON Patch (RFC 6902) operation.
    plux.v1.PauseRolloutRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        reason:
          type: string
          title: reason
      title: PauseRolloutRequest
      additionalProperties: false
    plux.v1.PauseRolloutResponse:
      type: object
      properties:
        rollout:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Rollout'
          title: rollout
      title: PauseRolloutResponse
      additionalProperties: false
    plux.v1.PermissionEntry:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the dotted permission name, for example "release.publish".
        description:
          type: string
          title: description
        risk:
          type: string
          title: risk
          description: risk is "low", "medium" or "high".
        stepUp:
          type: boolean
          title: step_up
          description: |-
            step_up is true when the permission needs a second factor in the
             session (SEC-100, SEC-103).
        scope:
          type: string
          title: scope
          description: |-
            scope is the narrowest scope the permission can be granted at:
             "organization", "app" or "environment".
        readOnly:
          type: boolean
          title: read_only
          description: read_only is true when the permission changes nothing.
      title: PermissionEntry
      additionalProperties: false
      description: PermissionEntry is one permission of the catalogue.
    plux.v1.PersonalDataStore:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the store's stable name, such as "devices".
        description:
          type: string
          title: description
        deviceKey:
          type: string
          title: device_key
          description: |-
            device_key and user_key name the columns that select a device or a user;
             empty when the store is not keyed by that subject.
        userKey:
          type: string
          title: user_key
        personalFields:
          type: array
          items:
            type: string
          title: personal_fields
        retention:
          type: string
          title: retention
        erase:
          type: string
          title: erase
          description: erase is "delete", "aggregate", "retained" or "account".
        note:
          type: string
          title: note
      title: PersonalDataStore
      additionalProperties: false
      description: PersonalDataStore is one entry of the personal-data map.
    plux.v1.Plugin:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        key:
          type: string
          title: key
        name:
          type: string
          title: name
        latestVersion:
          type: string
          title: latest_version
          format: int64
          description: latest_version is the highest published version, zero when none.
        draftRevision:
          type: string
          title: draft_revision
          format: int64
          description: draft_revision is the plugin draft's current revision (SRV-030).
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: Plugin
      additionalProperties: false
    plux.v1.PluginDescriptor:
      type: object
      properties:
        key:
          type: string
          title: key
        version:
          type: string
          title: version
          format: int64
        bundle:
          allOf:
            - $ref: '#/components/schemas/plux.v1.BundleDescriptor'
          title: bundle
      title: PluginDescriptor
      additionalProperties: false
    plux.v1.PluginVersion:
      type: object
      properties:
        id:
          type: string
          title: id
        pluginId:
          type: string
          title: plugin_id
        pluginKey:
          type: string
          title: plugin_key
        version:
          type: string
          title: version
          format: int64
        label:
          type: string
          title: label
        notes:
          type: string
          title: notes
        bundleSha256:
          type: string
          title: bundle_sha256
          description: bundle_sha256 is the bundle hash the signature covers (BND-005).
        bundleSize:
          type: string
          title: bundle_size
          format: int64
        requiredFeatures:
          type: array
          items:
            type: string
          title: required_features
        minRuntime:
          type: string
          title: min_runtime
        signature:
          type: string
          title: signature
          format: byte
          description: signature and key_id record how the version was signed (SRV-052).
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        sourceSnapshotId:
          type: string
          title: source_snapshot_id
          description: source_snapshot_id is the draft snapshot this was compiled from.
        publishedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: published_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: PluginVersion
      additionalProperties: false
      description: PluginVersion is an immutable published plugin (REL-001).
    plux.v1.PolicyFile:
      type: object
      properties:
        path:
          type: string
          title: path
        content:
          type: string
          title: content
          format: byte
      title: PolicyFile
      additionalProperties: false
      description: PolicyFile is one file of an export.
    plux.v1.PolicyRecord:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        key:
          type: string
          title: key
        version:
          type: integer
          title: version
          format: int32
        document:
          type: string
          title: document
          format: byte
          description: document is the policy document as JSON.
        documentHash:
          type: string
          title: document_hash
          description: |-
            document_hash is the SHA-256 of the canonical document, in hex: what
             an approval of a policy change binds to.
        deleted:
          type: boolean
          title: deleted
        createdBy:
          type: string
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: PolicyRecord
      additionalProperties: false
      description: PolicyRecord is one version of a policy document.
    plux.v1.PollDeviceAuthorizationRequest:
      type: object
      properties:
        deviceCode:
          type: string
          title: device_code
      title: PollDeviceAuthorizationRequest
      additionalProperties: false
    plux.v1.PollDeviceAuthorizationResponse:
      type: object
      properties:
        status:
          type: string
          title: status
          description: status is "pending", "slow_down", "approved" or "denied".
        token:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AccessToken'
          title: token
        secret:
          type: string
          title: secret
          description: |-
            secret is the token's value, returned exactly once, on the first
             poll after approval.
      title: PollDeviceAuthorizationResponse
      additionalProperties: false
    plux.v1.Preferences:
      type: object
      properties:
        theme:
          type: string
          title: theme
          description: theme is "system", "light", "dark" or "contrast"; empty reads as "system".
        language:
          type: string
          title: language
          description: language is a BCP 47 tag; empty follows the browser.
        density:
          type: string
          title: density
          description: density is "comfortable" or "compact"; empty reads as "comfortable".
        shortcuts:
          type: object
          title: shortcuts
          additionalProperties:
            type: string
            title: value
          description: shortcuts maps a command ID to its key binding.
        favouriteAppIds:
          type: array
          items:
            type: string
          title: favourite_app_ids
        pinned:
          type: array
          items:
            type: string
          title: pinned
          description: pinned holds the Studio paths pinned in the shell.
        preview:
          type: object
          title: preview
          additionalProperties:
            allOf:
              - $ref: '#/components/schemas/plux.v1.PreviewSwitches'
            title: value
          description: preview maps an app ID to its preview switches (STU-058).
        onboardingDismissed:
          type: boolean
          title: onboarding_dismissed
      title: Preferences
      additionalProperties: false
    plux.v1.PreviewSwitches:
      type: object
      properties:
        deviceFrame:
          type: string
          title: device_frame
        theme:
          type: string
          title: theme
        brandOverlay:
          type: string
          title: brand_overlay
        locale:
          type: string
          title: locale
        textScale:
          type: number
          title: text_scale
          format: double
        platform:
          type: string
          title: platform
          description: platform is "material" or "cupertino"; empty follows the device frame.
        mockStates:
          type: object
          title: mock_states
          additionalProperties:
            type: string
            title: value
          description: mock_states maps a data source to its mock state.
      title: PreviewSwitches
      additionalProperties: false
      description: PreviewSwitches are the switches of an app's live preview (STU-058).
    plux.v1.PromoteExperimentRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        variant:
          type: string
          title: variant
        environmentId:
          type: string
          title: environment_id
          description: environment_id is the environment the release is made for.
        label:
          type: string
          title: label
        notes:
          type: string
          title: notes
      title: PromoteExperimentRequest
      additionalProperties: false
    plux.v1.PromoteExperimentResponse:
      type: object
      properties:
        experiment:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Experiment'
          title: experiment
        publishJobId:
          type: string
          title: publish_job_id
          description: publish_job_id is the publish job that makes the release.
      title: PromoteExperimentResponse
      additionalProperties: false
    plux.v1.PromoteFunctionRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        fromEnvironmentId:
          type: string
          title: from_environment_id
          description: from_environment_id is the environment that holds the version.
        toEnvironmentId:
          type: string
          title: to_environment_id
          description: to_environment_id is the environment that receives the copy.
        name:
          type: string
          title: name
        version:
          type: integer
          title: version
        alias:
          type: string
          title: alias
          description: alias, when set, is pointed at the version in the target (FN-006).
        session:
          type: string
          title: session
      title: PromoteFunctionRequest
      additionalProperties: false
    plux.v1.PromoteFunctionResponse:
      type: object
      properties:
        version:
          allOf:
            - $ref: '#/components/schemas/plux.v1.FunctionVersion'
          title: version
          description: version is the version as the target environment holds it.
      title: PromoteFunctionResponse
      additionalProperties: false
    plux.v1.PromoteReleaseRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        sequence:
          type: string
          title: sequence
          format: int64
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
      title: PromoteReleaseRequest
      additionalProperties: false
    plux.v1.PromoteReleaseResponse:
      type: object
      properties:
        release:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Release'
          title: release
      title: PromoteReleaseResponse
      additionalProperties: false
    plux.v1.ProposedGrant:
      type: object
      properties:
        userId:
          type: string
          title: user_id
          description: Exactly one of user_id and team_id is set.
        teamId:
          type: string
          title: team_id
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
          description: scope is "organization", "app" or "environment".
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
          description: environment is the key of the environment, for the scope "environment".
      title: ProposedGrant
      additionalProperties: false
      description: ProposedGrant is a grant ExplainAccess evaluates without saving it.
    plux.v1.Provenance:
      type: object
      properties:
        sourceSha256:
          type: string
          title: source_sha256
          description: source_sha256 is the hex SHA-256 of the source archive.
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Dependency'
          title: dependencies
          description: dependencies are the vendored crates the build used.
        toolchain:
          type: string
          title: toolchain
          description: toolchain is the pinned compiler version (FN-016).
        wasmOptVersion:
          type: string
          title: wasm_opt_version
          description: wasm_opt_version is the pinned optimiser version (FN-016).
        buildTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: build_time
          description: |-
            build_time is the time the build ran; it is recorded, never embedded
             in the module (FN-019).
        builderIdentity:
          type: string
          title: builder_identity
          description: builder_identity names the builder instance (FN-005, FN-009).
        sdkSha256:
          type: string
          title: sdk_sha256
          description: |-
            sdk_sha256 is the SHA-256 of the pinned SDK the module was linked
             with; the SDK is a path crate, so the lock file does not record it
             (FN-005).
      title: Provenance
      additionalProperties: false
      description: Provenance is the build record signed with the artifact (FN-005).
    plux.v1.PublicKey:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        publicKey:
          type: string
          title: public_key
          format: byte
          description: public_key is the raw key; an Ed25519 key is 32 bytes.
        role:
          type: string
          title: role
          description: role is the update-metadata role this key holds (ADR-0004).
        environmentType:
          type: string
          title: environment_type
          description: |-
            environment_type is "production" or "development"; a production
             runtime refuses metadata signed by a development key (SEC-056).
      title: PublicKey
      additionalProperties: false
    plux.v1.PublishJob:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        environmentId:
          type: string
          title: environment_id
        revision:
          type: string
          title: revision
          format: int64
          description: revision is the draft revision the job froze.
        state:
          type: string
          title: state
          description: state is "queued", "running", "succeeded", "failed" or "cancelled".
        stage:
          type: string
          title: stage
          description: stage is the pipeline stage currently running (CMP-003).
        percent:
          type: integer
          title: percent
          format: int32
        version:
          type: string
          title: version
          format: int64
          description: version is the plugin version created, once the job succeeds.
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
        actor:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: actor
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: finished_at
      title: PublishJob
      additionalProperties: false
    plux.v1.PublishRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        environmentId:
          type: string
          title: environment_id
        revision:
          type: string
          title: revision
          format: int64
          description: revision freezes a specific draft revision; zero uses the current one.
        label:
          type: string
          title: label
        notes:
          type: string
          title: notes
        acknowledgeWarnings:
          type: boolean
          title: acknowledge_warnings
          description: |-
            acknowledge_warnings publishes despite warnings; without it a warning
             that policy does not allow stops the publish (SRV-051).
      title: PublishRequest
      additionalProperties: false
    plux.v1.PublishResponse:
      type: object
      properties:
        job:
          allOf:
            - $ref: '#/components/schemas/plux.v1.PublishJob'
          title: job
      title: PublishResponse
      additionalProperties: false
    plux.v1.PurgeFromTrashRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: PurgeFromTrashRequest
      additionalProperties: false
    plux.v1.PurgeFromTrashResponse:
      type: object
      title: PurgeFromTrashResponse
      additionalProperties: false
    plux.v1.PushProvider:
      type: string
      title: PushProvider
      enum:
        - PUSH_PROVIDER_UNSPECIFIED
        - PUSH_PROVIDER_FCM
        - PUSH_PROVIDER_APNS
      description: PushProvider is the push service a token belongs to.
    plux.v1.PutDocumentRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        path:
          type: string
          title: path
        content:
          type: string
          title: content
          format: byte
        ifRevision:
          type: string
          title: if_revision
          format: int64
          description: if_revision is the revision the writer last read; zero creates.
        session:
          type: string
          title: session
        editorSessionId:
          type: string
          title: editor_session_id
          description: |-
            editor_session_id names the Studio tab's editor session; the write's
             snapshot is tagged with it for the undo rebuild (ADR-0095, STU-069).
      title: PutDocumentRequest
      additionalProperties: false
    plux.v1.PutDocumentResponse:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Document'
          title: document
        snapshotId:
          type: string
          title: snapshot_id
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: PutDocumentResponse
      additionalProperties: false
    plux.v1.PutFreezeRequest:
      type: object
      properties:
        freeze:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ChangeFreeze'
          title: freeze
      title: PutFreezeRequest
      additionalProperties: false
    plux.v1.PutFreezeResponse:
      type: object
      properties:
        freeze:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ChangeFreeze'
          title: freeze
      title: PutFreezeResponse
      additionalProperties: false
    plux.v1.PutPolicyRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        document:
          type: string
          title: document
          format: byte
          description: document is the policy document as JSON.
      title: PutPolicyRequest
      additionalProperties: false
    plux.v1.PutPolicyResponse:
      type: object
      properties:
        policy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.PolicyRecord'
          title: policy
      title: PutPolicyResponse
      additionalProperties: false
    plux.v1.QueryRollupsRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
          description: environment restricts the query to one environment key; empty for all.
        metric:
          type: string
          title: metric
          description: metric is the event name, such as render_perf.
        granularity:
          type: string
          title: granularity
          description: granularity is 5m, 1h or 1d.
        from:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: from
        to:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: to
        groupBy:
          type: array
          items:
            type: string
          title: group_by
          description: |-
            group_by names dimensions to keep apart: environment, release, plugin,
             page, device_class, locale.
        limit:
          type: integer
          title: limit
          format: int32
          description: limit is the most points to return, up to api.pageSize.
        pageToken:
          type: string
          title: page_token
          description: |-
            page_token continues a result cut off by the limit: the
             next_page_token of the previous response, with the same other fields.
      title: QueryRollupsRequest
      additionalProperties: false
    plux.v1.QueryRollupsResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.RollupPoint'
          title: points
        nextPageToken:
          type: string
          title: next_page_token
          description: |-
            next_page_token is set when the limit was reached; it is empty on the
             last page.
      title: QueryRollupsResponse
      additionalProperties: false
    plux.v1.Range:
      type: object
      properties:
        start:
          type: integer
          title: start
          format: int32
        end:
          type: integer
          title: end
          format: int32
      title: Range
      additionalProperties: false
      description: Range is a half-open range of Unicode code points inside an expression.
    plux.v1.ReattestDeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        challenge:
          type: string
          title: challenge
          format: byte
          description: challenge is a fresh challenge from CreateRegistrationChallenge.
        evidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: evidence
          description: |-
            evidence is the new attestation of the device's existing DPoP key
             (SEC-006).
      title: ReattestDeviceRequest
      additionalProperties: false
    plux.v1.ReattestDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
      title: ReattestDeviceResponse
      additionalProperties: false
    plux.v1.ReconstructRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        deviceId:
          type: string
          title: device_id
          description: |-
            device_id or user_ref, exactly one: the device to reconstruct, or the
             host's pseudonymous user identifier (HST-011) whose device at the moment
             is.
        userRef:
          type: string
          title: user_ref
        at:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: at
          description: at is the moment to reconstruct.
      title: ReconstructRequest
      additionalProperties: false
    plux.v1.ReconstructResponse:
      type: object
      properties:
        reconstruction:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Reconstruction'
          title: reconstruction
      title: ReconstructResponse
      additionalProperties: false
    plux.v1.Reconstruction:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is the release identifier; the viewer opens the release by it.
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        deviceId:
          type: string
          title: device_id
          description: device_id is the device the moment was resolved on.
        userRef:
          type: string
          title: user_ref
          description: |-
            user_ref is the pseudonymous user the request named; empty when it named
             a device.
        moment:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: moment
          description: moment is the point in time that was reconstructed.
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
          description: release_sequence is the release the device ran at the moment.
        state:
          type: string
          title: state
          description: |-
            state is "pending" until the worker has signed the release, then
             "signed". A pending release cannot be opened.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        signedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: signed_at
        createdBy:
          type: string
          title: created_by
          description: created_by names who asked for it.
        openUri:
          type: string
          title: open_uri
          description: |-
            open_uri is what opens the release in the viewer host:
             plux-viewer://reconstruction/<id>?server=<server URL>. The viewer
             authenticates as the auditor and calls GetReconstruction.
      title: Reconstruction
      additionalProperties: false
      description: |-
        Reconstruction is a reconstruction release: the state of one device at one
         moment, packaged for the viewer host (SEC-142).
    plux.v1.ReconstructionBundle:
      type: object
      properties:
        key:
          type: string
          title: key
          description: key is the plugin key, empty for the app bundle.
        sha256:
          type: string
          title: sha256
          description: sha256 is "sha256:<hex>" of the bundle, as the manifest names it.
        size:
          type: string
          title: size
          format: int64
        url:
          type: string
          title: url
          description: url is where the bundle is downloaded from.
      title: ReconstructionBundle
      additionalProperties: false
      description: |-
        ReconstructionBundle is one bundle of a reconstruction release, exactly as
         it was shipped.
    plux.v1.ReconstructionSignature:
      type: object
      properties:
        keyId:
          type: string
          title: key_id
        algorithm:
          type: string
          title: algorithm
        signature:
          type: string
          title: signature
          description: signature is base64 of the signature.
      title: ReconstructionSignature
      additionalProperties: false
      description: ReconstructionSignature is one signature over the manifest.
    plux.v1.RefreshDeviceTokenRequest:
      type: object
      anyOf:
        - type: object
          properties:
            appAttestAssertion:
              type: string
              title: app_attest_assertion
              format: byte
              description: app_attest_assertion is the App Attest assertion over the request.
          title: app_attest_assertion
        - type: object
          properties:
            playIntegrityToken:
              type: string
              title: play_integrity_token
              description: play_integrity_token is a Play Integrity verdict token.
          title: play_integrity_token
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - appAttestAssertion
              - required:
                  - playIntegrityToken
          - not:
              oneOf:
                - required:
                    - appAttestAssertion
                - required:
                    - playIntegrityToken
      properties:
        deviceId:
          type: string
          title: device_id
      title: RefreshDeviceTokenRequest
    plux.v1.RefreshDeviceTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          title: access_token
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        tokenType:
          type: string
          title: token_type
          description: token_type is "DPoP" (SEC-020).
        assuranceLevel:
          type: string
          title: assurance_level
          description: |-
            assurance_level is the device's assurance level, "AL0" to "AL3": the
             value of the token's `al` claim, which the server computed from the
             device's verified evidence (SEC-007). The runtime enforces pages,
             routes and data sources against it.
      title: RefreshDeviceTokenResponse
      additionalProperties: false
      description: |-
        RefreshDeviceTokenResponse carries the new token; it has the same
         fields as IssueDeviceTokenResponse (SEC-025).
    plux.v1.RegisterAttestedDeviceRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        platform:
          type: string
          title: platform
        osVersion:
          type: string
          title: os_version
        runtimeVersion:
          type: string
          title: runtime_version
        hostBuild:
          type: string
          title: host_build
        challenge:
          type: string
          title: challenge
          format: byte
          description: |-
            challenge is the value CreateRegistrationChallenge returned; the
             attestation must be bound to it (SEC-005).
        dpopPublicKeyJwk:
          type: string
          title: dpop_public_key_jwk
          format: byte
          description: |-
            dpop_public_key_jwk is the device's DPoP public key as a JSON Web Key
             (RFC 7517) (SEC-001).
        keyStorage:
          allOf:
            - $ref: '#/components/schemas/plux.v1.KeyStorage'
          title: key_storage
          description: |-
            key_storage is where the device claims the key lives; the attestation
             must prove at least that (SEC-002).
        evidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: evidence
          description: evidence is the attestation of the DPoP key (SEC-003).
        keyAgreementPublicKeyJwk:
          type: string
          title: key_agreement_public_key_jwk
          format: byte
          description: |-
            key_agreement_public_key_jwk is the device's key-agreement public key
             for sealed payloads, as a JWK; empty when the device has none
             (SEC-053).
        scaPublicKeyJwk:
          type: string
          title: sca_public_key_jwk
          format: byte
          description: |-
            sca_public_key_jwk is the public key that signs transaction
             confirmations, as a JWK; empty when the device has none (SEC-027).
        scaEvidence:
          allOf:
            - $ref: '#/components/schemas/plux.v1.AttestationEvidence'
          title: sca_evidence
          description: |-
            sca_evidence is the attestation of the SCA key, in the same forms as
             evidence; set when sca_public_key_jwk is (SEC-027).
        keyAgreementKeyAttestationChain:
          type: array
          items:
            type: string
            format: byte
          title: key_agreement_key_attestation_chain
          description: |-
            key_agreement_key_attestation_chain is the Android Key Attestation
             chain of the key-agreement key, leaf first, DER-encoded, created with
             the registration challenge; empty on other platforms and when the
             device has no such key. The binding hash covers the thumbprints of
             the DPoP, key-agreement and SCA keys (SEC-004, ADR-0012).
      title: RegisterAttestedDeviceRequest
      additionalProperties: false
    plux.v1.RegisterAttestedDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
      title: RegisterAttestedDeviceResponse
      additionalProperties: false
    plux.v1.RegisterDeviceRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environment:
          type: string
          title: environment
        platform:
          type: string
          title: platform
        osVersion:
          type: string
          title: os_version
        runtimeVersion:
          type: string
          title: runtime_version
        hostBuild:
          type: string
          title: host_build
      title: RegisterDeviceRequest
      additionalProperties: false
    plux.v1.RegisterDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
        deviceSecret:
          type: string
          title: device_secret
          description: |-
            device_secret is the device's credential for IssueDeviceToken. It is
             returned exactly once and stored only as a hash.
      title: RegisterDeviceResponse
      additionalProperties: false
    plux.v1.RegisterPushTokenRequest:
      type: object
      properties:
        provider:
          allOf:
            - $ref: '#/components/schemas/plux.v1.PushProvider'
          title: provider
        token:
          type: string
          title: token
      title: RegisterPushTokenRequest
      additionalProperties: false
    plux.v1.RegisterPushTokenResponse:
      type: object
      title: RegisterPushTokenResponse
      additionalProperties: false
    plux.v1.Release:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        sequence:
          type: string
          title: sequence
          format: int64
        pluginVersionIds:
          type: array
          items:
            type: string
          title: plugin_version_ids
          description: plugin_version_ids are the versions in this release.
        appBundleSha256:
          type: string
          title: app_bundle_sha256
        appBundleSize:
          type: string
          title: app_bundle_size
          format: int64
        rollbackOf:
          type: string
          title: rollback_of
          format: int64
          description: rollback_of is the sequence this release reproduces, when it is one.
        notes:
          type: string
          title: notes
        createdBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        confidential:
          type: boolean
          title: confidential
          description: |-
            confidential is true when the release's bundles are delivered
             encrypted (SEC-053).
        functions:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.ReleaseFunction'
          title: functions
          description: |-
            functions are the function versions the release pins, so a device
             invokes exactly the version its release was built against (FN-006).
      title: Release
      additionalProperties: false
      description: |-
        Release is an immutable set of plugin versions plus one app bundle
         (REL-002).
    plux.v1.ReleaseFunction:
      type: object
      properties:
        name:
          type: string
          title: name
          description: name is the dotted function name.
        version:
          type: integer
          title: version
          description: version is the immutable function version the release resolved.
        moduleSha256:
          type: string
          title: module_sha256
          description: module_sha256 is the hex SHA-256 of the version's module (FN-005).
        placement:
          type: string
          title: placement
          description: placement is "server" or "device" (FN-008).
      title: ReleaseFunction
      additionalProperties: false
      description: ReleaseFunction is one function version a release references (FN-006).
    plux.v1.ReleaseLockRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        session:
          type: string
          title: session
        scope:
          type: string
          title: scope
          description: scope is as in AcquireLockRequest.
      title: ReleaseLockRequest
      additionalProperties: false
    plux.v1.ReleaseLockResponse:
      type: object
      title: ReleaseLockResponse
      additionalProperties: false
    plux.v1.RemoveMemberRequest:
      type: object
      properties:
        organizationId:
          type: string
          title: organization_id
        teamId:
          type: string
          title: team_id
        userId:
          type: string
          title: user_id
      title: RemoveMemberRequest
      additionalProperties: false
    plux.v1.RemoveMemberResponse:
      type: object
      title: RemoveMemberResponse
      additionalProperties: false
    plux.v1.RenewLockRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        session:
          type: string
          title: session
        scope:
          type: string
          title: scope
          description: scope is as in AcquireLockRequest.
      title: RenewLockRequest
      additionalProperties: false
    plux.v1.RenewLockResponse:
      type: object
      properties:
        lock:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Lock'
          title: lock
      title: RenewLockResponse
      additionalProperties: false
    plux.v1.ReportFormat:
      type: string
      title: ReportFormat
      enum:
        - REPORT_FORMAT_UNSPECIFIED
        - REPORT_FORMAT_JSON
        - REPORT_FORMAT_HTML
      description: ReportFormat says how a report is rendered.
    plux.v1.ReportInstalledRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        theme:
          type: string
          title: theme
          description: |-
            theme is the theme in use, such as "dark"; empty when not reported. It,
             text_scale_percent and user_ref are kept in the device's history so that
             a reconstruction can show the page as the user saw it (SEC-142).
        textScalePercent:
          type: integer
          title: text_scale_percent
          format: int32
          description: |-
            text_scale_percent is the text scale in percent, 100 for the default;
             zero when not reported.
        userRef:
          type: string
          title: user_ref
          description: |-
            user_ref is the host's pseudonymous user identifier (HST-011); empty when
             the host set none.
      title: ReportInstalledRequest
      additionalProperties: false
    plux.v1.ReportInstalledResponse:
      type: object
      title: ReportInstalledResponse
      additionalProperties: false
    plux.v1.ReportKind:
      type: string
      title: ReportKind
      enum:
        - REPORT_KIND_UNSPECIFIED
        - REPORT_KIND_ACCESSIBILITY
        - REPORT_KIND_LOCALISATION
      description: ReportKind says which report of a release to return.
    plux.v1.RequestLockRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        pluginId:
          type: string
          title: plugin_id
        scope:
          type: string
          title: scope
          description: scope is as in AcquireLockRequest.
      title: RequestLockRequest
      additionalProperties: false
    plux.v1.RequestLockResponse:
      type: object
      properties:
        lock:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Lock'
          title: lock
      title: RequestLockResponse
      additionalProperties: false
    plux.v1.RestoreFromTrashRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: RestoreFromTrashRequest
      additionalProperties: false
    plux.v1.RestoreFromTrashResponse:
      type: object
      title: RestoreFromTrashResponse
      additionalProperties: false
    plux.v1.RestoreSnapshotRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        paths:
          type: array
          items:
            type: string
          title: paths
        session:
          type: string
          title: session
      title: RestoreSnapshotRequest
      additionalProperties: false
    plux.v1.RestoreSnapshotResponse:
      type: object
      properties:
        snapshotId:
          type: string
          title: snapshot_id
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Diagnostic'
          title: diagnostics
      title: RestoreSnapshotResponse
      additionalProperties: false
    plux.v1.Restriction:
      type: object
      properties:
        id:
          type: string
          title: id
        subjectKind:
          type: string
          title: subject_kind
          description: subject_kind is "organization", "team" or "user".
        subjectId:
          type: string
          title: subject_id
          description: subject_id is the team or the user; empty for the organisation.
        patterns:
          type: array
          items:
            type: string
          title: patterns
          description: |-
            patterns are catalogue permissions or the wildcards "*", "<area>.*"
             and "<area>.<feature>.*".
        appId:
          type: string
          title: app_id
          description: |-
            app_id limits the restriction to one app, and environment, the key of
             one of its environments, to that environment; both are empty for the
             whole organisation.
        environment:
          type: string
          title: environment
        reason:
          type: string
          title: reason
        createdBy:
          type: string
          title: created_by
          description: created_by is the person who made it; empty when that person is gone.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: Restriction
      additionalProperties: false
      description: |-
        Restriction removes permissions from its subject whatever their grants
         say (GOV-006). It is immutable: a change is a delete and a create.
    plux.v1.ResumeRolloutRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: ResumeRolloutRequest
      additionalProperties: false
    plux.v1.ResumeRolloutResponse:
      type: object
      properties:
        rollout:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Rollout'
          title: rollout
      title: ResumeRolloutResponse
      additionalProperties: false
    plux.v1.RetentionChange:
      type: object
      properties:
        id:
          type: string
          title: id
        dataClass:
          type: string
          title: data_class
        days:
          type: integer
          title: days
          format: int32
          description: days is 0 for indefinitely.
        state:
          type: string
          title: state
          description: state is scheduled, applied or cancelled.
        requestedBy:
          type: string
          title: requested_by
        requestedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: requested_at
        applyAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: apply_at
        finishedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: finished_at
      title: RetentionChange
      additionalProperties: false
      description: RetentionChange is a retention change that was scheduled or made.
    plux.v1.RetentionSetting:
      type: object
      properties:
        dataClass:
          type: string
          title: data_class
        days:
          type: integer
          title: days
          format: int32
          description: days is 0 for indefinitely.
        isDefault:
          type: boolean
          title: is_default
          description: is_default says the installation default applies.
        enforced:
          type: boolean
          title: enforced
          description: enforced is false where nothing deletes yet (audit_production).
        changedBy:
          type: string
          title: changed_by
        changedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: changed_at
      title: RetentionSetting
      additionalProperties: false
      description: |-
        RetentionSetting is the retention of one data class: raw_events, rollups
         or audit_production.
    plux.v1.ReviewBreakGlassRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        comment:
          type: string
          title: comment
      title: ReviewBreakGlassRequest
      additionalProperties: false
    plux.v1.ReviewBreakGlassResponse:
      type: object
      properties:
        invocation:
          allOf:
            - $ref: '#/components/schemas/plux.v1.BreakGlassInvocation'
          title: invocation
      title: ReviewBreakGlassResponse
      additionalProperties: false
    plux.v1.ReviewImage:
      type: object
      properties:
        pluginKey:
          type: string
          title: plugin_key
        caseId:
          type: string
          title: case_id
        baseline:
          type: string
          title: baseline
          format: byte
        actual:
          type: string
          title: actual
          format: byte
      title: ReviewImage
      additionalProperties: false
      description: |-
        ReviewImage is a golden-image difference: the approved baseline and the
         image the run produced, as PNG. The baseline is empty for a case that
         has none yet.
    plux.v1.ReviewReport:
      type: object
      properties:
        kind:
          type: string
          title: kind
        content:
          type: string
          title: content
          format: byte
      title: ReviewReport
      additionalProperties: false
      description: ReviewReport is a validation or accessibility report as JSON.
    plux.v1.ReviewRisk:
      type: object
      properties:
        level:
          type: string
          title: level
          description: level is "low", "medium" or "high".
        reasons:
          type: array
          items:
            type: string
          title: reasons
      title: ReviewRisk
      additionalProperties: false
      description: ReviewRisk is the computed risk summary.
    plux.v1.RevokeAccessRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: RevokeAccessRequest
      additionalProperties: false
    plux.v1.RevokeAccessResponse:
      type: object
      title: RevokeAccessResponse
      additionalProperties: false
    plux.v1.RevokeAccessTokenRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: RevokeAccessTokenRequest
      additionalProperties: false
    plux.v1.RevokeAccessTokenResponse:
      type: object
      title: RevokeAccessTokenResponse
      additionalProperties: false
    plux.v1.RevokeDeviceRequest:
      type: object
      properties:
        deviceId:
          type: string
          title: device_id
        reason:
          type: string
          title: reason
          description: reason is recorded in the audit log (SEC-006).
      title: RevokeDeviceRequest
      additionalProperties: false
    plux.v1.RevokeDeviceResponse:
      type: object
      properties:
        device:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Device'
          title: device
      title: RevokeDeviceResponse
      additionalProperties: false
    plux.v1.RevokeScimTokenRequest:
      type: object
      properties:
        id:
          type: string
          title: id
      title: RevokeScimTokenRequest
      additionalProperties: false
    plux.v1.RevokeScimTokenResponse:
      type: object
      title: RevokeScimTokenResponse
      additionalProperties: false
    plux.v1.RevokeSessionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: id is a session's or a token's identifier, as ListSessions gives it.
      title: RevokeSessionRequest
      additionalProperties: false
    plux.v1.RevokeSessionResponse:
      type: object
      title: RevokeSessionResponse
      additionalProperties: false
    plux.v1.RoleDefinition:
      type: object
      properties:
        key:
          type: string
          title: key
          description: |-
            key names the role: the name of a predefined role, or the key of a
             custom role.
        name:
          type: string
          title: name
        description:
          type: string
          title: description
        predefined:
          type: boolean
          title: predefined
        permissions:
          type: array
          items:
            type: string
          title: permissions
          description: |-
            permissions are catalogue names, bare or limited to an environment as
             "<permission>:<environment>".
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
      title: RoleDefinition
      additionalProperties: false
      description: RoleDefinition is a role and the permissions it holds.
    plux.v1.RoleGrant:
      type: object
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
        userId:
          type: string
          title: user_id
          description: Exactly one of user_id and team_id is set.
        teamId:
          type: string
          title: team_id
        role:
          type: string
          title: role
        scope:
          type: string
          title: scope
          description: scope is "organization", "app" or "environment".
        appId:
          type: string
          title: app_id
          description: app_id is set for the scopes "app" and "environment".
        environmentId:
          type: string
          title: environment_id
          description: environment_id is set for the scope "environment".
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
      title: RoleGrant
      additionalProperties: false
      description: RoleGrant binds a role to a user or a team at a scope (GOV-003).
    plux.v1.RollbackReleaseRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
        toSequence:
          type: string
          title: to_sequence
          format: int64
          description: to_sequence is the earlier release whose content to reproduce.
        notes:
          type: string
          title: notes
        breakGlass:
          type: boolean
          title: break_glass
          description: |-
            break_glass runs the change as an emergency action without the freeze
             and approval checks, and needs breakglass.invoke on the environment with
             a fresh step-up (GOV-024, SEC-103). justification is then required
             (PLX-8005); it is refused without break_glass.
        justification:
          type: string
          title: justification
      title: RollbackReleaseRequest
      additionalProperties: false
    plux.v1.RollbackReleaseResponse:
      type: object
      properties:
        release:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Release'
          title: release
      title: RollbackReleaseResponse
      additionalProperties: false
    plux.v1.Rollout:
      type: object
      properties:
        id:
          type: string
          title: id
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channel:
          type: string
          title: channel
        candidateSequence:
          type: string
          title: candidate_sequence
          format: int64
        previousSequence:
          type: string
          title: previous_sequence
          format: int64
          description: |-
            previous_sequence is the channel's release when the rollout started; zero
             while it is scheduled.
        state:
          allOf:
            - $ref: '#/components/schemas/plux.v1.RolloutState'
          title: state
        stateReason:
          type: string
          title: state_reason
        stages:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Stage'
          title: stages
        stageIndex:
          type: integer
          title: stage_index
          format: int32
        basisPoints:
          type: integer
          title: basis_points
          format: int32
          description: basis_points is the share offered the candidate now.
        startAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: start_at
        endAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: end_at
        rule:
          type: string
          title: rule
          format: byte
          description: rule is the targeting rule as JSON, empty for none.
        segments:
          type: array
          items:
            type: string
            format: byte
          title: segments
          description: |-
            segments are the named segments the rollout targets, as the documents
             given at creation.
        allowDevices:
          type: array
          items:
            type: string
          title: allow_devices
        denyDevices:
          type: array
          items:
            type: string
          title: deny_devices
        health:
          allOf:
            - $ref: '#/components/schemas/plux.v1.HealthGate'
          title: health
        lastCheck:
          type: string
          title: last_check
          format: byte
          description: last_check is the figures of the gate's newest check as JSON.
        lastCheckAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_check_at
        revertedSequence:
          type: string
          title: reverted_sequence
          format: int64
          description: reverted_sequence is the release made to revert the rollout, zero if none.
        createdBy:
          type: string
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        environmentKey:
          type: string
          title: environment_key
          description: environment_key is the key of the rollout's environment.
      title: Rollout
      additionalProperties: false
      description: Rollout is a release offered to a share of a channel's devices.
    plux.v1.RolloutState:
      type: string
      title: RolloutState
      enum:
        - ROLLOUT_STATE_UNSPECIFIED
        - ROLLOUT_STATE_SCHEDULED
        - ROLLOUT_STATE_ACTIVE
        - ROLLOUT_STATE_PAUSED
        - ROLLOUT_STATE_CLOSING
        - ROLLOUT_STATE_COMPLETED
        - ROLLOUT_STATE_ENDED
        - ROLLOUT_STATE_ABORTED
        - ROLLOUT_STATE_ROLLED_BACK
      description: RolloutState is where a rollout is in its life.
    plux.v1.RollupGroup:
      type: object
      properties:
        environmentId:
          type: string
          title: environment_id
        releaseSequence:
          type: string
          title: release_sequence
          format: int64
        pluginKey:
          type: string
          title: plugin_key
        page:
          type: string
          title: page
        deviceClass:
          type: string
          title: device_class
        locale:
          type: string
          title: locale
      title: RollupGroup
      additionalProperties: false
      description: |-
        RollupGroup is the dimension values of a point; a dimension not grouped by
         is empty.
    plux.v1.RollupPoint:
      type: object
      properties:
        bucket:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: bucket
        group:
          allOf:
            - $ref: '#/components/schemas/plux.v1.RollupGroup'
          title: group
        events:
          type: string
          title: events
          format: int64
        valueCount:
          type: string
          title: value_count
          format: int64
        sum:
          type: number
          title: sum
          format: double
        min:
          type: number
          title: min
          format: double
        max:
          type: number
          title: max
          format: double
        p50:
          type: number
          title: p50
          format: double
        p90:
          type: number
          title: p90
          format: double
        p99:
          type: number
          title: p99
          format: double
      title: RollupPoint
      additionalProperties: false
      description: |-
        RollupPoint is one bucket of one series. Durations are milliseconds; the
         percentiles are estimated from a fixed-bucket histogram.
    plux.v1.RotateHookSecretRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        overlapSeconds:
          type: string
          title: overlap_seconds
          format: int64
      title: RotateHookSecretRequest
      additionalProperties: false
    plux.v1.RotateHookSecretResponse:
      type: object
      properties:
        secret:
          type: string
          title: secret
      title: RotateHookSecretResponse
      additionalProperties: false
    plux.v1.RotateScimTokenRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        overlapSeconds:
          type: string
          title: overlap_seconds
          format: int64
          description: |-
            overlap_seconds is how long the old token keeps working; 0 selects the
             limit auth.scimTokenOverlapSeconds.
      title: RotateScimTokenRequest
      additionalProperties: false
    plux.v1.RotateScimTokenResponse:
      type: object
      properties:
        token:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ScimToken'
          title: token
        secret:
          type: string
          title: secret
        previous:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ScimToken'
          title: previous
          description: previous is the rotated-away token, with the time it stops working.
      title: RotateScimTokenResponse
      additionalProperties: false
    plux.v1.RotateWebhookSecretRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        overlapSeconds:
          type: string
          title: overlap_seconds
          format: int64
          description: |-
            overlap_seconds is how long the previous secret stays valid; zero is 24
             hours, negative ends it at once. At most seven days.
      title: RotateWebhookSecretRequest
      additionalProperties: false
    plux.v1.RotateWebhookSecretResponse:
      type: object
      properties:
        secret:
          type: string
          title: secret
      title: RotateWebhookSecretResponse
      additionalProperties: false
    plux.v1.RunExportRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
      title: RunExportRequest
      additionalProperties: false
    plux.v1.RunExportResponse:
      type: object
      properties:
        export:
          allOf:
            - $ref: '#/components/schemas/plux.v1.GitExport'
          title: export
      title: RunExportResponse
      additionalProperties: false
    plux.v1.SamlProviderConfig:
      type: object
      properties:
        idpMetadataXml:
          type: string
          title: idp_metadata_xml
          format: byte
          description: |-
            idp_metadata_xml is the identity provider's metadata document, write-only;
             it fills the provider's entity ID, sign-on URL and signing certificates.
        idpEntityId:
          type: string
          title: idp_entity_id
        idpSsoUrl:
          type: string
          title: idp_sso_url
        idpSigningCertificates:
          type: array
          items:
            type: string
          title: idp_signing_certificates
        entityId:
          type: string
          title: entity_id
          description: |-
            entity_id is the service provider's identifier (the audience); it
             defaults to the URL of the metadata.
        acsUrl:
          type: string
          title: acs_url
          description: 'acs_url is the assertion consumer service URL: Studio''s callback.'
        allowIdpInitiated:
          type: boolean
          title: allow_idp_initiated
        emailAttribute:
          type: string
          title: email_attribute
        nameAttribute:
          type: string
          title: name_attribute
        groupsAttribute:
          type: string
          title: groups_attribute
        serviceProviderCertificatePem:
          type: string
          title: service_provider_certificate_pem
          description: |-
            service_provider_certificate_pem is the certificate for encrypted
             assertions, generated with the provider.
      title: SamlProviderConfig
      additionalProperties: false
      description: SamlProviderConfig configures a SAML provider.
    plux.v1.ScimToken:
      type: object
      properties:
        id:
          type: string
          title: id
        organizationId:
          type: string
          title: organization_id
        name:
          type: string
          title: name
        prefix:
          type: string
          title: prefix
          description: prefix identifies the token without revealing it.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
          description: expires_at is set on a token that was rotated away.
        revokedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: revoked_at
        lastUsedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_used_at
      title: ScimToken
      additionalProperties: false
      description: ScimToken is a SCIM bearer token without its secret.
    plux.v1.ScreenshotEvent:
      type: object
      properties:
        commandId:
          type: string
          title: command_id
          description: command_id is the capture command this answers.
        png:
          type: string
          title: png
          format: byte
          description: png is the PNG-encoded image.
        width:
          type: integer
          title: width
          format: int32
        height:
          type: integer
          title: height
          format: int32
        pixelRatio:
          type: number
          title: pixel_ratio
          format: double
        platformViewsNotCaptured:
          type: boolean
          title: platform_views_not_captured
          description: |-
            platform_views_not_captured is true when the screen shows platform
             views (native slots, maps) the capture could not include.
      title: ScreenshotEvent
      additionalProperties: false
      description: ScreenshotEvent carries a captured screenshot (DEV-033).
    plux.v1.SearchHit:
      type: object
      properties:
        kind:
          type: string
          title: kind
          description: kind is one of the kinds a request may name.
        id:
          type: string
          title: id
          description: id is the identifier of the app, plugin or document.
        appId:
          type: string
          title: app_id
        name:
          type: string
          title: name
          description: name is the name of an app or plugin, or the key of a document.
        path:
          type: string
          title: path
          description: |-
            path is the key path of an app or plugin, or the document's path in
             the project layout.
        snippet:
          type: string
          title: snippet
          description: |-
            snippet is the matching text with each hit between « and ». It is
             plain text from the document and must be escaped before it is shown as
             markup.
        rank:
          type: number
          title: rank
          format: float
          description: rank orders results; higher is a better match.
      title: SearchHit
      additionalProperties: false
    plux.v1.SearchRequest:
      type: object
      properties:
        query:
          type: string
          title: query
          description: query holds the words to find; punctuation separates words.
        kinds:
          type: array
          items:
            type: string
          title: kinds
          description: |-
            kinds restricts the results to "app", "plugin", "page", "component",
             "template", "translation_key" or "function"; empty means all.
        page:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Page'
          title: page
          description: page selects the page; only page_size and page_token are read.
      title: SearchRequest
      additionalProperties: false
    plux.v1.SearchResponse:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.SearchHit'
          title: hits
        page:
          allOf:
            - $ref: '#/components/schemas/plux.v1.PageResult'
          title: page
      title: SearchResponse
      additionalProperties: false
    plux.v1.Secret:
      type: object
      properties:
        key:
          type: string
          title: key
        hint:
          type: string
          title: hint
          description: hint is the last few characters, for recognising which value is stored.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Actor'
          title: updated_by
      title: Secret
      additionalProperties: false
      description: Secret never carries its value after creation (SEC-106).
    plux.v1.SecurityConfigRef:
      type: object
      properties:
        version:
          type: string
          title: version
          format: int64
        sha256:
          type: string
          title: sha256
          format: byte
          description: sha256 is the hash of the canonical configuration at that version.
      title: SecurityConfigRef
      additionalProperties: false
      description: |-
        SecurityConfigRef pins one version of the effective security
         configuration (SEC-182).
    plux.v1.SecurityDetectionEvent:
      type: object
      properties:
        kind:
          allOf:
            - $ref: '#/components/schemas/plux.v1.DevSecurityDetectionKind'
          title: kind
        simulated:
          type: boolean
          title: simulated
          description: |-
            simulated is true when a developer's SimulateSecurityDetectionCommand
             caused the detection rather than the device's own checks.
        response:
          type: string
          title: response
          description: |-
            response is the response the app's policy took, such as "warn" or
             "block" (SEC-071).
      title: SecurityDetectionEvent
      additionalProperties: false
      description: |-
        SecurityDetectionEvent reports a detection and what the runtime did
         about it.
    plux.v1.Session:
      type: object
      properties:
        id:
          type: string
          title: id
        userId:
          type: string
          title: user_id
        csrfToken:
          type: string
          title: csrf_token
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        secondFactor:
          type: boolean
          title: second_factor
          description: second_factor is true when a second factor was presented in it.
        stepUpAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: step_up_at
          description: |-
            step_up_at is when a WebAuthn step-up last succeeded in it; unset
             when none did (SEC-103).
      title: Session
      additionalProperties: false
      description: |-
        Session is a browser session. Its secret never appears in a response
         body: the edge sets it as a __Host- prefixed, HttpOnly, Secure,
         SameSite=Strict cookie, and state-changing calls must echo csrf_token
         in the X-CSRF-Token header (SEC-101).
    plux.v1.SessionInfo:
      type: object
      properties:
        id:
          type: string
          title: id
        userId:
          type: string
          title: user_id
        clientKind:
          type: string
          title: client_kind
          description: |-
            client_kind is "studio" for a browser session, "cli" for a token from
             `plux login`, and "token" for a personal access token or a CI token.
        name:
          type: string
          title: name
          description: name is a token's name; empty for a browser session.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        lastSeenAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: last_seen_at
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        ipPrefix:
          type: string
          title: ip_prefix
          description: ip_prefix is the /24 (IPv4) or /48 (IPv6) the last request came from.
        userAgent:
          type: string
          title: user_agent
        stepUpAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: step_up_at
          description: step_up_at is when a step-up last succeeded in a browser session.
      title: SessionInfo
      additionalProperties: false
      description: |-
        SessionInfo is one session or token of a person, as an administrator
         sees it (GOV-005). The secret is never part of it.
    plux.v1.SetAliasRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        name:
          type: string
          title: name
        alias:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Alias'
          title: alias
        session:
          type: string
          title: session
      title: SetAliasRequest
      additionalProperties: false
    plux.v1.SetAliasResponse:
      type: object
      properties:
        aliases:
          type: array
          items:
            $ref: '#/components/schemas/plux.v1.Alias'
          title: aliases
      title: SetAliasResponse
      additionalProperties: false
    plux.v1.SetAppLimitRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        key:
          type: string
          title: key
        value:
          type: string
          title: value
          format: int64
      title: SetAppLimitRequest
      additionalProperties: false
    plux.v1.SetAppLimitResponse:
      type: object
      properties:
        limit:
          allOf:
            - $ref: '#/components/schemas/plux.v1.LimitUsage'
          title: limit
      title: SetAppLimitResponse
      additionalProperties: false
    plux.v1.SetConfigValueRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        value:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ConfigValue'
          title: value
          description: value is the value to store; version and updated_at are ignored.
        expectedVersion:
          type:
            - string
            - "null"
          title: expected_version
          format: int64
          description: |-
            expected_version is the version the caller read; zero for a key that
             does not exist yet. Omit it to set without the check.
      title: SetConfigValueRequest
      additionalProperties: false
    plux.v1.SetConfigValueResponse:
      type: object
      properties:
        value:
          allOf:
            - $ref: '#/components/schemas/plux.v1.ConfigValue'
          title: value
          description: value is the stored value, without its content when it is sensitive.
      title: SetConfigValueResponse
      additionalProperties: false
    plux.v1.SetControlRequest:
      type: object
      properties:
        appId:
          type: string
          title: app_id
        environmentId:
          type: string
          title: environment_id
        channelKey:
          type: string
          title: channel_key
        killSwitchPlugins:
          type: array
          items:
            type: string
          title: kill_switch_plugins
        appKillSwitch:
          type: boolean
          title: app_kill_switch
        mandatoryUpdate:
          type: boolean
          title: mandatory_update
        message:
          type: string
          title: message
      title: SetControlRequest
      additionalProperties: false
    plux.v1.SetControlResponse:
      type: object
      properties:
        control:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Control'
          title: control
      title: SetControlResponse
      additionalProperties: false
    plux.v1.SetExportRequest:
      type: object
      properties:
        endpoint:
          type: string
          title: endpoint
          description: endpoint is the collector's base URL or its /v1/metrics URL, https only.
        enabled:
          type: boolean
          title: enabled
      title: SetExportRequest
      additionalProperties: false
    plux.v1.SetExportResponse:
      type: object
      properties:
        export:
          allOf:
            - $ref: '#/components/schemas/plux.v1.Export'
          title: export
      title: SetExportResponse
      additionalProperties: false
    plux.v1.SetFileExportRequest:
      type: object
      properties:
        settings:
          allOf:
